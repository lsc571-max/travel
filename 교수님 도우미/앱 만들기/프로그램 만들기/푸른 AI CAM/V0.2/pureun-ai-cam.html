<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="푸른 AI CAM - 소규모 기계가공 업체용 FANUC 3축 머시닝센터 2.5축 홀 가공 CAM (무설치·오프라인 웹앱)">
<meta name="theme-color" content="#1e6f5c">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>푸른 AI CAM</title>
<style>
:root{
  --bg:#eef2f1;--panel:#ffffff;--panel2:#f6f8f8;--text:#17211e;--muted:#66736f;--line:#d9e0de;
  --accent:#1e6f5c;--accent-ink:#ffffff;--accent-soft:#e2f1ec;
  --err:#c62828;--err-soft:#fdecec;--warn:#b26a00;--warn-soft:#fff4e0;--ok:#1b7f3a;--ok-soft:#e6f5ea;--info:#2f5f9e;--info-soft:#e8f0fb;
  --cv-bg:#fbfcfc;--cv-grid:#e7ecea;--cv-grid2:#d3dbd8;--cv-stock:#dfe8f0;--cv-stock-line:#5b7a99;
  --font:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:Consolas,"D2Coding","Cascadia Mono",ui-monospace,monospace;
  font-size:14px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1514;--panel:#18201e;--panel2:#1f2826;--text:#e4ebe8;--muted:#93a29d;--line:#2e3a37;
  --accent:#3fb394;--accent-ink:#06231b;--accent-soft:#18352d;
  --err:#ff6b6b;--err-soft:#3a1d1d;--warn:#f0b04c;--warn-soft:#3a2d14;--ok:#5fd287;--ok-soft:#173222;--info:#7fb0ef;--info-soft:#1a2a40;
  --cv-bg:#141b1a;--cv-grid:#1f2927;--cv-grid2:#2c3936;--cv-stock:#22303a;--cv-stock-line:#7fa3c4;
  color-scheme:dark;
}
:root[data-fs="s"]{font-size:13px}
:root[data-fs="l"]{font-size:16px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:5px 10px;line-height:1.3;min-height:30px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--err)}
button.sm{padding:2px 7px;min-height:24px;font-size:.9em}
button.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:28px;min-width:0}
input[type=number]{width:100%}
input[type=checkbox]{min-height:auto;width:16px;height:16px;accent-color:var(--accent)}
textarea{width:100%}
label{display:block}
small,.muted{color:var(--muted)}
h3{font-size:1.02em;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
h3:first-child{margin-top:2px}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}

#app{display:grid;height:100vh;height:100dvh;grid-template-columns:300px minmax(0,1fr) 370px;grid-template-rows:auto minmax(0,1fr) 290px;
  grid-template-areas:"top top top" "left view right" "left bottom right";gap:6px;padding:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;min-width:0}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:6px 10px}
#left{grid-area:left;display:flex;flex-direction:column}
#view{grid-area:view;display:flex;flex-direction:column}
#right{grid-area:right;display:flex;flex-direction:column}
#bottom{grid-area:bottom;display:flex;flex-direction:column}
#mnav{display:none}
.pbody{overflow:auto;padding:8px 10px;flex:1;min-height:0}
.brand{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand .logo{color:var(--accent);font-size:1.25em}
.ver{font-size:10px;color:var(--muted);opacity:.75}
.projname{flex:1;max-width:340px;font-weight:600}
.topbtns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;background:transparent;padding:6px 10px}
.tabs button.act{border-bottom-color:var(--accent);font-weight:700;color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font-size:.8em;font-weight:700}
.badge.err{background:var(--err);color:#fff}.badge.warn{background:var(--warn);color:#fff}.badge.ok{background:var(--ok);color:#fff}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 8px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:.92em;min-width:0}
.fld>span{color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld select,.fld input[type=text]{width:100%}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.chk{display:flex;align-items:center;gap:6px;font-size:.92em;padding:3px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;background:var(--panel2)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card .head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.card .head b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opinfo{font-size:.85em;color:var(--muted);margin-top:5px;line-height:1.45}
.opinfo b{color:var(--text)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0;border:1px solid rgba(0,0,0,.2)}
.glist .card{cursor:pointer;margin:4px 0;padding:6px 8px}
table.tbl{width:100%;border-collapse:collapse;font-size:.9em}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
table.tbl th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
table.tbl input,table.tbl select{width:100%;min-height:26px;padding:2px 4px}
table.tbl tr.sel td{background:var(--accent-soft)}
.tblwrap{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.82em;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.err{background:var(--err-soft);color:var(--err)}.pill.info{background:var(--info-soft);color:var(--info)}
.subtabs{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}

.vtools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:6px;border-bottom:1px solid var(--line)}
.vtools .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.vtools select,.vtools input{min-height:28px}
.canvasWrap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;border-radius:0 0 10px 10px;background:var(--cv-bg)}
.cursorpos{position:absolute;left:8px;bottom:6px;font:12px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;pointer-events:none}
.viewhint{position:absolute;right:8px;top:6px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;pointer-events:none;max-width:60%}

.banner{border-radius:8px;padding:8px 10px;font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner.err{background:var(--err-soft);color:var(--err);border:1px solid var(--err)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.chkcols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px}
.citem{border:1px solid var(--line);border-radius:7px;margin:4px 0;background:var(--panel2)}
.citem>summary{list-style:none;cursor:pointer;padding:5px 8px;display:flex;gap:8px;align-items:center}
.citem>summary::-webkit-details-marker{display:none}
.citem>summary .nm{flex:1}
.citem ul{margin:0;padding:2px 8px 6px 26px;font-size:.9em}
.citem li{margin:3px 0;cursor:pointer}
.citem li.err{color:var(--err)}.citem li.warn{color:var(--warn)}.citem li.info{color:var(--info)}
.ic{width:18px;text-align:center;font-weight:700}
.ic.ok{color:var(--ok)}.ic.err{color:var(--err)}.ic.warn{color:var(--warn)}
.stage{display:flex;gap:6px;align-items:flex-start;font-size:.9em;margin:4px 0}
.codebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.codewrap{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:calc(100% - 70px);min-height:140px}
.gutter{font:12px/1.5 var(--mono);color:var(--muted);text-align:right;padding:6px 6px;background:var(--panel2);user-select:none;overflow:hidden;white-space:pre;min-width:44px}
#ncText{font:12px/1.5 var(--mono);border:0;border-radius:0;resize:none;padding:6px 8px;white-space:pre;overflow:auto;height:100%;flex:1}
#ncText[readonly]{background:var(--panel)}
#ncText.edited{background:var(--warn-soft)}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--text);max-width:min(720px,94vw);width:94vw;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dhead h2{font-size:1.1em;margin:0;flex:1}
.dbody{padding:12px 14px;overflow:auto;max-height:calc(90vh - 110px)}
.dfoot{display:flex;gap:6px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
.gear{font-size:1.25em;border:none;background:transparent;padding:2px 6px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.qrbox canvas{width:min(340px,80vw);height:auto;image-rendering:pixelated;background:#fff;padding:0;border-radius:6px}
.sect{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.sect>b{display:block;margin-bottom:6px}
.adm{border:2px solid var(--warn);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--warn-soft)}

#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:9999;pointer-events:none;align-items:center}
.toast{background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:.95em;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}.toast.warn{background:#9a5b00}

@media (max-width:1250px){#app{grid-template-columns:270px minmax(0,1fr) 330px}}
@media (max-width:900px){
  body{overflow:hidden}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "nav";padding:4px;gap:4px}
  #app>.mpanel{grid-area:main;display:none}
  #app>.mpanel.mact{display:flex}
  #mnav{grid-area:nav;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  #mnav button{font-size:12px;line-height:1.2;padding:4px 2px}
  #mnav button.act{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  #top{flex-wrap:wrap;gap:6px}
  .projname{order:3;max-width:none;flex-basis:100%}
  .topbtns .lbl{display:none}
  .chkcols{grid-template-columns:minmax(0,1fr)}
  .codewrap{height:60vh}
  button{min-height:36px}
}

</style>
</head>
<body>
<div id="app">
  <!-- ① 상단 메뉴 -->
  <header id="top" class="panel">
    <div class="brand"><span class="logo" aria-hidden="true">◎</span><b>푸른 AI CAM</b><small id="verTag" class="ver"></small></div>
    <input id="projName" class="projname" aria-label="프로젝트 이름" maxlength="60">
    <div class="topbtns">
      <button id="btnProjects" title="프로젝트 목록·열기·내보내기">📁 <span class="lbl">프로젝트</span></button>
      <button id="btnUndo" title="되돌리기 (Ctrl+Z)">↶</button>
      <button id="btnRedo" title="다시 하기 (Ctrl+Y)">↷</button>
      <button id="btnDownload" class="primary" title="NC 파일 다운로드">⬇ <span class="lbl">NC 다운로드</span></button>
      <button id="btnShare" title="공유·QR코드">🔗 <span class="lbl">공유</span></button>
      <button id="btnSettings" title="설정" aria-label="설정">⚙</button>
    </div>
  </header>

  <!-- ② 좌측: 소재·장비·공정 묶음 -->
  <aside id="left" class="panel mpanel">
    <nav class="tabs" id="leftTabs" role="tablist">
      <button data-tab="stock" role="tab">소재·가공</button>
      <button data-tab="machine" role="tab">장비·공구</button>
      <button data-tab="bundle" role="tab">공정 묶음</button>
    </nav>
    <div id="leftBody" class="pbody"></div>
  </aside>

  <!-- ③ 중앙: 그래픽 화면 -->
  <section id="view" class="panel mpanel">
    <div class="vtools" id="vtools"></div>
    <div class="canvasWrap" id="canvasWrap">
      <canvas id="cv" aria-label="가공 화면: 소재, 홀 위치, 가공 경로" tabindex="0"></canvas>
      <div id="cursorPos" class="cursorpos"></div>
      <div id="viewHint" class="viewhint"></div>
    </div>
  </section>

  <!-- ④ 우측: 홀 그룹·공정·배열 -->
  <aside id="right" class="panel mpanel">
    <div id="rightBody" class="pbody"></div>
  </aside>

  <!-- ⑤ 하단: 검증 결과·G코드 -->
  <section id="bottom" class="panel mpanel">
    <nav class="tabs" id="bottomTabs" role="tablist">
      <button data-tab="check" role="tab">검증 결과 <span id="chkBadge" class="badge"></span></button>
      <button data-tab="code" role="tab">G코드</button>
    </nav>
    <div id="bottomBody" class="pbody"></div>
  </section>

  <nav id="mnav" aria-label="모바일 화면 전환">
    <button data-m="left">⚙<br>설정</button>
    <button data-m="view">▦<br>화면</button>
    <button data-m="right">◉<br>홀·공정</button>
    <button data-m="bottom">✔<br>검증·코드</button>
  </nav>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<dialog id="dlg2"><div id="dlg2Body"></div></dialog>
<div id="toasts" aria-live="polite"></div>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {

/* =====================================================================
 * 푸른 AI CAM - [포스트프로세서: FANUC] post/fanuc.js
 * 역할: 표준 가공 데이터(plan.steps[].toolpath) → FANUC 0i/31i 계열 G코드 텍스트

 *       - 공구 교환: M09 M05 G91 G28 Z0. G90 (M01) T__ M06 → G43 Z초기점 H__

 * 다른 제어기(미쓰비시·지멘스 등)는 이 파일을 복사해 새 파일로 등록한다 (이 파일 수정 불필요).
 * ===================================================================== */

  'use strict';

    const now = opts.date || new Date();
    const ds = now.getFullYear() + '-' + pad(now.getMonth() + 1, 2) + '-' + pad(now.getDate(), 2) + ' ' + pad(now.getHours(), 2) + ':' + pad(now.getMinutes(), 2);
    out('%', false);
    out('O' + pad(project.programNo, 4) + ' (' + (ncText(project.name, 24) || 'PROGRAM') + ')', false);

 * 역할: 브라우저 저장소(localStorage) 읽기·쓰기, 초기 데이터, 저장 데이터 정규화·손상 복구,
 *       관리자 비밀번호 해시(PBKDF2-SHA256) 도구. 외부 서버 전송 없음.
 * 의존: PCAM(계산 엔진), 화면 알림 함수(toast) 주입
 * ===================================================================== */
(function () {
  'use strict';
  const C = window.PCAM;
  window.PCAM_UI = window.PCAM_UI || {};
  window.PCAM_UI.createStorage = function (toast) {
    const DB_KEY = 'pcam.db.v1', ADMIN_KEY = 'pcam.admin.v1';
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { toast('브라우저 저장 실패: 저장 공간 또는 권한을 확인하세요. 파일로 백업하세요.', 'err'); return false; } }
  function freshDB() {
    const m = C.defaultMachine();
    const p = C.newProject(m);
    p.name = '예제 - M6 탭 플레이트';
    const g = C.newGroup('M6 탭', 0);
    g.holes = C.genGrid({ x: 20, y: 20, px: 55, py: 60, nx: 3, ny: 2 }).map(h => ({ id: C.uid('h'), x: h.x, y: h.y }));
    const bundles = C.defaultBundles(m);
    g.ops = C.applyBundle(bundles[1], m).ops;
    const g2 = C.newGroup('M5 탭 PCD', 1);
    g2.holes = C.genPCD({ cx: 75, cy: 50, dia: 40, count: 4, start: 45 }).map(h => ({ id: C.uid('h'), x: h.x, y: h.y }));
    g2.ops = C.applyBundle(bundles[0], m).ops;
    p.groups = [g, g2];
    return { schema: 1, machines: [m], bundles, projects: { [p.id]: p }, currentProjectId: p.id, settings: { theme: 'system', fs: 'm', sound: true, grid: { show: true, step: 5, snap: true } } };
  }
  function loadDB() {
    const raw = lsGet(DB_KEY);
    if (raw) {
      try {
        const d = JSON.parse(raw);
        if (d && d.schema === 1 && Array.isArray(d.machines) && d.machines.length) {
          d.machines = d.machines.map(C.normalizeMachine);
          d.bundles = Array.isArray(d.bundles) ? d.bundles.map(b => { const n = C.normalizeBundle(b); if (n.importWarnings) { const w = n.importWarnings[0]; delete n.importWarnings; setTimeout(() => toast(w, 'err'), 500); } return n; }) : [];
          const pr = {};
          Object.values(d.projects || {}).forEach(p => { const n = C.normalizeProject(p); if (n.importWarnings) { const w = n.importWarnings[0]; delete n.importWarnings; setTimeout(() => toast('[' + n.name + '] ' + w, 'err'), 500); } pr[n.id] = n; });
          d.projects = pr;
          d.settings = Object.assign({ theme: 'system', fs: 'm', sound: true }, d.settings || {});
          d.settings.grid = Object.assign({ show: true, step: 5, snap: true }, d.settings.grid || {});
          return d;
        }
      } catch (e) { toast('저장 데이터를 읽지 못해 새로 시작합니다. (기존 데이터는 보존: ' + DB_KEY + '.broken)', 'err'); lsSet(DB_KEY + '.broken', raw); }
    }
    return freshDB();
  }
  function adminRec() { try { return JSON.parse(lsGet(ADMIN_KEY) || 'null'); } catch (e) { return null; } }
  function b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
  function unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
  async function pbkdf2(pw, salt, iter) {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, k, 256));
  }
  function safeEq(a, b) { if (a.length !== b.length) return false; let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; }
  function pwRule(pw) { return pw.length >= 8 && /[A-Za-z]/.test(pw) && /\d/.test(pw); }
    return { DB_KEY, ADMIN_KEY, lsGet, lsSet, freshDB, loadDB, adminRec, b64, unb64, pbkdf2, safeEq, pwRule };
  };
})();

/* =====================================================================
 * 푸른 AI CAM - [그래픽 모듈] ui/graphics.js
 * 역할: 캔버스 좌표 변환(월드 mm ↔ 화면 px), 화면 맞춤·확대, 소재·격자·좌표계·클램프·홀·
 *       가공 경로·NC 해석 결과 그리기. 입력(마우스·터치) 처리는 app.js 담당.
 * 의존: PCAM(계산 엔진), 상태 제공 함수 getCtx() → { P, S, DB, drag, machine }
 * ===================================================================== */
(function () {
  'use strict';
  const C = window.PCAM;
  window.PCAM_UI = window.PCAM_UI || {};
  window.PCAM_UI.createGraphics = function (getCtx) {
    let P, S, DB, drag, machine;
    const sync = () => { const c = getCtx(); P = c.P; S = c.S; DB = c.DB; drag = c.drag; machine = c.machine; };
    const $ = s => document.querySelector(s);
    const cv = () => $('#cv');
  function canvasSize() { const c = cv(), r = c.getBoundingClientRect(); return { w: r.width, h: r.height }; }
  function w2s(x, y) { const { w, h } = canvasSize(); return [w / 2 + (x - S.view.cx) * S.view.scale, h / 2 - (y - S.view.cy) * S.view.scale]; }
  function s2w(px, py) { const { w, h } = canvasSize(); return [S.view.cx + (px - w / 2) / S.view.scale, S.view.cy - (py - h / 2) / S.view.scale]; }
  function fitView() {
    const r = C.stockRect(P.stock);
    let x0 = Math.min(r.x0, 0), y0 = Math.min(r.y0, 0), x1 = Math.max(r.x1, 0), y1 = Math.max(r.y1, 0);
    P.groups.forEach(g => g.holes.forEach(h => { if (C.isNum(h.x) && C.isNum(h.y)) { x0 = Math.min(x0, h.x); x1 = Math.max(x1, h.x); y0 = Math.min(y0, h.y); y1 = Math.max(y1, h.y); } }));
    P.clamps.forEach(c => { const cr = { x0: Math.min(c.x, c.x + c.w), x1: Math.max(c.x, c.x + c.w), y0: Math.min(c.y, c.y + c.h), y1: Math.max(c.y, c.y + c.h) }; x0 = Math.min(x0, cr.x0); x1 = Math.max(x1, cr.x1); y0 = Math.min(y0, cr.y0); y1 = Math.max(y1, cr.y1); });
    const { w, h } = canvasSize(); if (!w || !h) return;
    const sw = Math.max(x1 - x0, 1), sh = Math.max(y1 - y0, 1);
    S.view.scale = Math.max(0.05, Math.min((w - 60) / sw, (h - 60) / sh));
    S.view.cx = (x0 + x1) / 2; S.view.cy = (y0 + y1) / 2; S.view.fitted = true;
  }
  function zoom(f, px, py) {
    const { w, h } = canvasSize(); if (px === undefined) { px = w / 2; py = h / 2; }
    const [wx, wy] = s2w(px, py);
    S.view.scale = Math.max(0.05, Math.min(200, S.view.scale * f));
    S.view.cx = wx - (px - w / 2) / S.view.scale; S.view.cy = wy + (py - h / 2) / S.view.scale;
    drawView();
  }
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function drawView() {
    const c = cv(); if (!c) return;
    const { w, h } = canvasSize(); if (!w || !h) return;
    const dpr = window.devicePixelRatio || 1;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    if (!S.view.fitted) fitView();
    const x = c.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.fillStyle = cssVar('--cv-bg'); x.fillRect(0, 0, w, h);
    const sc = S.view.scale, gs = DB.settings.grid;
    // 격자
    if (gs.show) {
      let step = gs.step; while (step * sc < 7) step *= (String(step).startsWith('2') ? 2.5 : 2);
      const [wx0, wy1] = s2w(0, 0), [wx1, wy0] = s2w(w, h);
      x.lineWidth = 1;
      const major = step * 5;
      for (let gx = Math.floor(wx0 / step) * step; gx <= wx1; gx += step) { const [sx] = w2s(gx, 0); x.strokeStyle = Math.abs(gx / major - Math.round(gx / major)) < 1e-6 ? cssVar('--cv-grid2') : cssVar('--cv-grid'); x.beginPath(); x.moveTo(Math.round(sx) + .5, 0); x.lineTo(Math.round(sx) + .5, h); x.stroke(); }
      for (let gy = Math.floor(wy0 / step) * step; gy <= wy1; gy += step) { const [, sy] = w2s(0, gy); x.strokeStyle = Math.abs(gy / major - Math.round(gy / major)) < 1e-6 ? cssVar('--cv-grid2') : cssVar('--cv-grid'); x.beginPath(); x.moveTo(0, Math.round(sy) + .5); x.lineTo(w, Math.round(sy) + .5); x.stroke(); }
    }
    // 소재
    const r = C.stockRect(P.stock);
    const [a0, b0] = w2s(r.x0, r.y1), [a1, b1] = w2s(r.x1, r.y0);
    x.fillStyle = cssVar('--cv-stock'); x.fillRect(a0, b0, a1 - a0, b1 - b0);
    x.strokeStyle = cssVar('--cv-stock-line'); x.lineWidth = 1.5; x.strokeRect(a0, b0, a1 - a0, b1 - b0);
    x.fillStyle = cssVar('--muted'); x.font = '12px ' + cssVar('--font');
    x.fillText(P.stock.sx + ' × ' + P.stock.sy + ' × ' + P.stock.sz + ' ' + P.stock.material, a0 + 4, b0 - 6);
    // 클램프
    P.clamps.forEach((cl, i) => {
      const [p0, q0] = w2s(Math.min(cl.x, cl.x + cl.w), Math.max(cl.y, cl.y + cl.h)), [p1, q1] = w2s(Math.max(cl.x, cl.x + cl.w), Math.min(cl.y, cl.y + cl.h));
      x.save(); x.fillStyle = 'rgba(230,120,20,.18)'; x.fillRect(p0, q0, p1 - p0, q1 - q0); x.strokeStyle = '#d9731a'; x.lineWidth = 1.5; x.setLineDash([5, 3]); x.strokeRect(p0, q0, p1 - p0, q1 - q0);
      x.beginPath(); x.rect(p0, q0, p1 - p0, q1 - q0); x.clip(); x.setLineDash([]); x.strokeStyle = 'rgba(217,115,26,.45)';
      for (let k = -Math.abs(q1 - q0); k < Math.abs(p1 - p0); k += 8) { x.beginPath(); x.moveTo(p0 + k, q1); x.lineTo(p0 + k + (q1 - q0), q0); x.stroke(); }
      x.restore(); x.fillStyle = '#b85c0c'; x.fillText('클램프' + (i + 1) + ' H' + cl.height, p0 + 2, q0 - 3);
    });
    // 원점 축
    const [ox, oy] = w2s(0, 0), al = 40;
    x.lineWidth = 2; x.strokeStyle = '#d62728'; x.beginPath(); x.moveTo(ox, oy); x.lineTo(ox + al, oy); x.stroke(); x.fillStyle = '#d62728'; x.fillText('X', ox + al + 3, oy + 4);
    x.strokeStyle = '#2ca02c'; x.beginPath(); x.moveTo(ox, oy); x.lineTo(ox, oy - al); x.stroke(); x.fillStyle = '#2ca02c'; x.fillText('Y', ox - 4, oy - al - 4);
    x.fillStyle = cssVar('--text'); x.beginPath(); x.arc(ox, oy, 3.5, 0, Math.PI * 2); x.fill();
    x.fillText(P.settings.wcs, ox + 5, oy + 14);
    // 경로
    const steps = S.V.plan.steps;
    const errHoles = new Set(S.V.issues.filter(i => i.level === 'error' && i.ref && i.ref.hid).map(i => i.ref.hid));
    const warnHoles = new Set(S.V.issues.filter(i => i.level === 'warn' && i.ref && i.ref.hid).map(i => i.ref.hid));
    if (S.showPath && steps.length) {
      const show = S.pathStep ? steps.filter(s => s.idx === S.pathStep) : steps;
      show.forEach(s => {
        x.strokeStyle = S.pathStep ? '#7b3fd0' : 'rgba(123,63,208,.35)'; x.lineWidth = S.pathStep ? 1.6 : 1; x.setLineDash([4, 3]);
        x.beginPath(); s.holes.forEach((hh, k) => { const [px, py] = w2s(hh.x, hh.y); if (k) x.lineTo(px, py); else x.moveTo(px, py); }); x.stroke(); x.setLineDash([]);
        if (S.pathStep) {
          s.holes.forEach((hh, k) => {
            const [px, py] = w2s(hh.x, hh.y);
            if (k) { const [qx, qy] = w2s(s.holes[k - 1].x, s.holes[k - 1].y); const mx = (px + qx) / 2, my = (py + qy) / 2, an = Math.atan2(py - qy, px - qx); x.fillStyle = '#7b3fd0'; x.beginPath(); x.moveTo(mx + 6 * Math.cos(an), my + 6 * Math.sin(an)); x.lineTo(mx + 6 * Math.cos(an + 2.5), my + 6 * Math.sin(an + 2.5)); x.lineTo(mx + 6 * Math.cos(an - 2.5), my + 6 * Math.sin(an - 2.5)); x.fill(); }
            x.fillStyle = '#7b3fd0'; x.font = 'bold 11px ' + cssVar('--font'); x.fillText(String(k + 1), px + 7, py - 7);
          });
        }
      });
    }
    // 홀
    const tm = C.toolMap(machine());
    P.groups.forEach(g => {
      const d = C.holeDiaForGroup(g, tm) || 3;
      g.holes.forEach(hh => {
        if (!C.isNum(hh.x) || !C.isNum(hh.y)) return;
        const [px, py] = w2s(hh.x, hh.y), rr = Math.max(3, d / 2 * sc);
        x.fillStyle = g.color + '55'; x.strokeStyle = g.color; x.lineWidth = 1.5;
        x.beginPath(); x.arc(px, py, rr, 0, Math.PI * 2); x.fill(); x.stroke();
        x.beginPath(); x.moveTo(px - 3, py); x.lineTo(px + 3, py); x.moveTo(px, py - 3); x.lineTo(px, py + 3); x.stroke();
        if (errHoles.has(hh.id) || warnHoles.has(hh.id)) { x.strokeStyle = errHoles.has(hh.id) ? cssVar('--err') : cssVar('--warn'); x.lineWidth = 2.5; x.beginPath(); x.arc(px, py, rr + 4, 0, Math.PI * 2); x.stroke(); }
        if (hh.id === S.sel.hid) { x.strokeStyle = cssVar('--accent'); x.lineWidth = 2; x.setLineDash([3, 2]); x.beginPath(); x.arc(px, py, rr + 8, 0, Math.PI * 2); x.stroke(); x.setLineDash([]); x.fillStyle = cssVar('--text'); x.font = '12px ' + cssVar('--mono'); x.fillText('X' + C.fmt(hh.x) + ' Y' + C.fmt(hh.y), px + rr + 10, py + 4); }
      });
    });

      x.strokeStyle = '#e0457b'; x.lineWidth = 1; x.setLineDash([2, 3]);
      vr.moves.forEach(mv => { const [p0, q0] = w2s(mv.x0, mv.y0), [p1, q1] = w2s(mv.x1, mv.y1); x.beginPath(); x.moveTo(p0, q0); x.lineTo(p1, q1); x.stroke(); });
      x.setLineDash([]); x.lineWidth = 2;
      vr.hits.forEach(ht => { const [px, py] = w2s(ht.x, ht.y); x.beginPath(); x.moveTo(px - 5, py - 5); x.lineTo(px + 5, py + 5); x.moveTo(px + 5, py - 5); x.lineTo(px - 5, py + 5); x.stroke(); });
    }
    // 드래그 중인 클램프
    if (drag && drag.kind === 'clamp' && drag.cur) {

      x.strokeStyle = '#d9731a'; x.setLineDash([4, 3]); x.strokeRect(Math.min(p0, p1), Math.min(q0, q1), Math.abs(p1 - p0), Math.abs(q1 - q0)); x.setLineDash([]);

  }
    const wrap = fn => function () { sync(); return fn.apply(null, arguments); };

})();

(function () {

    { v: 'V0.2', d: C.BUILD_DATE, items: ['기능별 모듈 구조: 공통 엔진·가공 모듈(6종)·공정 관리·포스트프로세서·검증·저장·그래픽 분리', '안전 강화: 소재 관통 급속/G01 이동, 탭 기초 구멍·절삭 조건(수정 NC 포함), 좌표계, G94, M29 주축 정지, N번호 5자리 검사', '수정 NC 재검증 결과를 소재·장비 변경 시 자동 갱신, 검증 전 G코드 복사 차단', '개발 예정 가공(평면·사각/원형 포켓·외곽) 목록 표시, 미지원 가공은 드릴로 바꾸지 않고 제외'] },

  /* ---------------- 상태 ---------------- */

  let P = null;            // 현재 프로젝트

    leftTab: 'stock', bottomTab: 'check', mpanel: 'view', mode: 'select',
    sel: { gid: null, hid: null }, arrKind: 'single', arr: {},
    bundleSel: null, pathStep: 0, showPath: true, showNC: false,
    view: { scale: 3, cx: 75, cy: 50, fitted: false },
    undo: [], redo: [],

  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const ST = window.PCAM_UI.createStorage(toast);
  const { DB_KEY, ADMIN_KEY, lsGet, lsSet, freshDB, loadDB, adminRec, b64, unb64, pbkdf2, safeEq, pwRule } = ST;
  let saveTimer = null;
  function saveDB(now) {

    const run = () => { if (P) DB.projects[P.id] = P; DB.currentProjectId = P ? P.id : null; lsSet(DB_KEY, JSON.stringify(DB)); };
    if (now) run(); else saveTimer = setTimeout(run, 300);

  const binds = new Map(), acts = new Map();
  function clearScope(sc) { for (const k of [...binds.keys()]) if (k.startsWith(sc + ':')) binds.delete(k); for (const k of [...acts.keys()]) if (k.startsWith(sc + ':')) acts.delete(k); }

    const key = () => sc + ':' + (++n);

      num(val, fn, a) { const k = key(); binds.set(k, el => { const raw = el.value.trim(); const v = parseFloat(raw); if (raw === '' || !isFinite(v)) { toast('숫자를 입력하세요.', 'err'); renderAll(); return; } fn(v); }); return '<input type="number" step="any" inputmode="decimal" data-k="' + k + '" value="' + esc(fmtN(val)) + '" ' + (a || '') + '>'; },
      int(val, fn, a) { const k = key(); binds.set(k, el => { const v = el.value.trim() === '' ? NaN : Number(el.value); if (!Number.isInteger(v)) { toast('정수를 입력하세요.', 'err'); renderAll(); return; } fn(v); }); return '<input type="number" step="1" inputmode="numeric" data-k="' + k + '" value="' + esc(val) + '" ' + (a || '') + '>'; },
      text(val, fn, a) { const k = key(); binds.set(k, el => fn(el.value)); return '<input type="text" data-k="' + k + '" value="' + esc(val) + '" ' + (a || '') + '>'; },
      select(val, opts, fn, a) { const k = key(); binds.set(k, el => fn(el.value)); return '<select data-k="' + k + '" ' + (a || '') + '>' + opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + (o[2] ? ' disabled' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>'; },
      check(val, fn, label, a) { const k = key(); binds.set(k, el => fn(el.checked)); return '<label class="chk"><input type="checkbox" data-k="' + k + '"' + (val ? ' checked' : '') + ' ' + (a || '') + '>' + esc(label) + '</label>'; },
      btn(label, fn, cls, a) { const k = key(); acts.set(k, fn); return '<button type="button" data-a="' + k + '" class="' + (cls || '') + '" ' + (a || '') + '>' + label + '</button>'; },
      fld(label, inner) { return '<label class="fld"><span>' + esc(label) + '</span>' + inner + '</label>'; }
    };
  }
  // change 처리는 포커스 이동(Tab) 이후 실행하여 다음 입력칸 포커스를 유지
  document.addEventListener('change', e => { const el = e.target, k = el && el.dataset && el.dataset.k; if (k && binds.has(k)) { const fn = binds.get(k); setTimeout(() => fn(el), 0); } });
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-a]'); if (b && acts.has(b.dataset.a) && !b.disabled) { e.preventDefault(); acts.get(b.dataset.a)(e, b); } });

  function mutate(fn, keepNC) {
    S.undo.push(JSON.stringify(P)); if (S.undo.length > 50) S.undo.shift();
    S.redo = [];
    fn();
    P.updatedAt = new Date().toISOString();
    saveDB();
    renderAll();
  }
  function undo() { if (!S.undo.length) return; S.redo.push(JSON.stringify(P)); P = C.normalizeProject(JSON.parse(S.undo.pop())); saveDB(); renderAll(); toast('되돌렸습니다.'); }
  function redo() { if (!S.redo.length) return; S.undo.push(JSON.stringify(P)); P = C.normalizeProject(JSON.parse(S.redo.pop())); saveDB(); renderAll(); toast('다시 실행했습니다.'); }
  function dbChange(fn) { fn(); saveDB(); renderAll(); }

  /* ---------------- 알림 ---------------- */
  function toast(msg, kind) {
    const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg;
    $('#toasts').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 5000 : 2600);
  }
  function beep() {
    if (!DB.settings.sound) return;
    try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 440; o.type = 'square'; g.gain.value = 0.05; o.connect(g); g.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, 250); } catch (e) { /* 소리 미지원 */ }
  }

  /* ---------------- 재계산 (검증·생성·독립 검증) ---------------- */
  function recompute() {
    const m = machine();
    S.V = C.validateProject(P, m);
    const g = C.generateNC(P, m, S.V.plan);
    S.nc.text = g.text; S.nc.hits = g.hits; S.nc.blocked = g.blocked || '';
    S.nc.verify = g.text ? C.verifyNC(g.text, { stock: P.stock, machine: m, clamps: P.clamps, settings: P.settings, expected: g.hits }) : null;
    // 재검증한 수정본도 소재·장비·클램프가 바뀌면 현재 조건으로 다시 검사 (이전 통과 결과 재사용 금지)
    if (S.nc.edited && S.nc.editVerify) S.nc.editVerify = C.verifyNC(S.nc.editText, { stock: P.stock, machine: m, clamps: P.clamps, settings: P.settings, expected: null });
  }
  function counts() {
    const iss = S.V ? S.V.issues : [];
    const e = iss.filter(i => i.level === 'error').length, w = iss.filter(i => i.level === 'warn').length;
    const vr = S.nc.edited ? S.nc.editVerify : S.nc.verify;
    return { e, w, ne: vr ? vr.errors.length : 0, nw: vr ? vr.warnings.length : 0, vr };
  }
  // NC 다운로드 가능 여부와 사유
  function downloadState() {
    const c = counts();
    if (S.nc.blocked) return { ok: false, why: S.nc.blocked };
    if (c.e) return { ok: false, why: '모델 검증 오류 ' + c.e + '건' };
    if (S.nc.edited) {
      if (!S.nc.editVerify) return { ok: false, why: '수정한 G코드는 재검증이 필요합니다' };
      if (S.nc.editVerify.errors.length) return { ok: false, why: '수정한 G코드 검증 오류 ' + S.nc.editVerify.errors.length + '건' };
    } else {
      if (!S.nc.verify) return { ok: false, why: 'G코드가 없습니다' };
      if (S.nc.verify.errors.length) return { ok: false, why: 'NC 해석 검증 오류 ' + S.nc.verify.errors.length + '건' };
    }
    return { ok: true, test: !machine().verified };
  }

  }

    b.setAttribute('aria-disabled', ds.ok ? 'false' : 'true');

  }

  /* ---------------- 공정 카드 (프로젝트·묶음 공용) ---------------- */
  function opCards(u, ops, commit, opts) {
    const m = machine(), tm = C.toolMap(m), st = P.stock;
    let h = '';
    ops.forEach((op, i) => {
      const t = tm.get(op.toolNo);
      const okTools = m.tools.filter(x => C.OP_TYPES[op.type].tools.includes(x.type)).sort((a, b) => a.no - b.no);
      const toolOpts = okTools.map(x => [x.no, C.toolLabel(x)]);
      if (!t || !C.OP_TYPES[op.type].tools.includes(t.type)) toolOpts.unshift([op.toolNo, 'T' + op.toolNo + ' (없음/맞지 않음)']);
      const set = fn => v => commit(() => fn(v));
      const isDr = C.isDrillOp(op.type), isTp = C.isTapOp(op.type), def = C.OPS.get(op.type); // 입력 항목은 가공 모듈의 ui 규격을 따름
      h += '<div class="card"><div class="head"><b>' + (i + 1) + '. ' + esc(C.OP_TYPES[op.type].label) + ' <small>' + esc(C.OP_TYPES[op.type].code) + '</small></b>' +
        u.btn('↑', () => commit(() => { if (i > 0) ops.splice(i - 1, 0, ops.splice(i, 1)[0]); }), 'sm', 'title="위로" ' + (i ? '' : 'disabled')) +
        u.btn('↓', () => commit(() => { if (i < ops.length - 1) ops.splice(i + 1, 0, ops.splice(i, 1)[0]); }), 'sm', 'title="아래로" ' + (i < ops.length - 1 ? '' : 'disabled')) +
        u.btn('✕', () => commit(() => { ops.splice(i, 1); }), 'sm danger', 'title="공정 삭제"') + '</div>';
      h += '<div class="grid2">' +
        u.fld('가공 방식', u.select(op.type, Object.keys(C.OP_TYPES).map(k => [k, C.OP_TYPES[k].label + ' (' + C.OP_TYPES[k].code + ')']), set(v => {
          op.type = v; const ok = m.tools.filter(x => C.OP_TYPES[v].tools.includes(x.type));
          const cur = tm.get(op.toolNo); if (!cur || !C.OP_TYPES[v].tools.includes(cur.type)) { if (ok.length) op.toolNo = ok[0].no; }
          if (C.isTapOp(v) && op.r < 5) op.r = 5;
        }))) +
        u.fld('공구', u.select(op.toolNo, toolOpts, set(v => { op.toolNo = parseInt(v, 10); }))) + '</div>';
      h += '<div class="grid3" style="margin-top:4px">' +
        u.fld(op.thru ? '깊이 (관통 자동)' : '깊이 (mm)', u.num(op.depth, set(v => { op.depth = v; }), op.thru ? 'disabled' : '')) +
        u.fld('R점 (상면 위)', u.num(op.r, set(v => { op.r = v; }))) +
        (def.ui.q ? u.fld('펙 Q (mm)', u.num(op.q, set(v => { op.q = v; }))) :
          (def.ui.dwell ? u.fld('드웰 P (ms, G82)', u.int(op.dwell, set(v => { op.dwell = v; }))) : '<span></span>')) + '</div>';
      if (def.ui.thru) {
        h += '<div class="row">' + u.check(op.thru, set(v => { op.thru = v; }), '관통') + (op.thru ? u.fld('관통 여유(mm)', u.num(op.brk, set(v => { op.brk = v; }), 'style="width:80px"')) : '') +
          (def.ui.depthMode && !op.thru ? u.select(op.depthMode, [['tip', '깊이 = 공구 끝'], ['full', '깊이 = 직경부(끝각 자동 추가)']], set(v => { op.depthMode = v; })) : '') + '</div>';
      }
      const cnd = C.opConditions(op, t, st.material, m);
      h += '<div class="grid3" style="margin-top:4px;align-items:end">' + u.check(op.auto, set(v => { op.auto = v; if (!v) { op.rpm = cnd.rpm; op.feed = cnd.feed; } }), '자동 추천') +
        u.fld('회전수 S', op.auto ? '<input type="text" value="' + cnd.rpm + '" disabled>' : u.num(op.rpm, set(v => { op.rpm = v; }))) +
        u.fld(isTp ? '이송 F (=S×P)' : '이송 F (mm/min)', (op.auto || isTp) ? '<input type="text" value="' + cnd.feed + '" disabled>' : u.num(op.feed, set(v => { op.feed = v; })) ) + '</div>';
      // 계산 정보
      let info = '';
      if (t && C.OP_TYPES[op.type].tools.includes(t.type)) {
        const d = C.opDepth(op, t, st);
        const vc = Math.PI * t.dia * cnd.rpm / 1000, ref = C.refConditions(op.type, t, st.material);
        info += '공구 끝 <b>Z' + C.fmt(d.z) + '</b>';
        if (isDr) info += ' · 직경부 깊이 ' + d.full + ' · 끝각 길이 ' + d.tip;
        if (op.type === 'center') info += ' · 모따기 Ø' + C.r3(C.spotDiameter(t, d.depth));
        info += '<br>Vc ' + vc.toFixed(1) + ' m/min (참고 ' + ref.vc.toFixed(1) + ')';
        if (!isTp && cnd.rpm > 0) info += ' · f ' + C.r3(cnd.feed / cnd.rpm) + ' mm/rev (참고 ' + C.r3(ref.fpr) + ')';
        if (isTp) { const rd = C.tapDrill(t.dia, t.pitch); info += ' · F = ' + cnd.rpm + ' × ' + t.pitch + ' = <b>' + cnd.feed + '</b> (G94)' + (rd ? '<br>기초 드릴 추천 Ø' + rd.dia : ''); }
      } else info = '<span style="color:var(--err)">공구를 확인하세요.</span>';
      if (opts && opts.template && op.toolSpec) {
        const ok = t && t.type === op.toolSpec.type && Math.abs(t.dia - op.toolSpec.dia) < 1e-6;
        info += '<br>등록 공구 사양: ' + esc(C.specText(op.toolSpec)) + (ok ? '' : ' <span style="color:var(--warn)">(현재 장비 T' + op.toolNo + ' 와 다름 → 적용 시 사양 일치 공구로 자동 매칭)</span>');
      }
      h += '<div class="opinfo">' + info + '</div></div>';
    });
    h += '<div class="row">' + u.select('', [['', '+ 공정 추가...']].concat(Object.keys(C.OP_TYPES).map(k => [k, C.OP_TYPES[k].label + ' (' + C.OP_TYPES[k].code + ')'])).concat(C.OPS.planned().map(d => ['', d.label + ' (개발 예정)', true])), v => {
      if (!v) return; const ok = m.tools.filter(x => C.OP_TYPES[v].tools.includes(x.type));
      commit(() => { const o = C.newOp(v, ok.length ? ok[0].no : 1); if (opts && opts.template) { delete o.id; const tt = tm.get(o.toolNo); o.toolSpec = tt ? { type: tt.type, dia: tt.dia, pitch: tt.pitch || 0 } : null; } ops.push(o); });
    }) + '</div>';
    return h;
  }

  function regAct(u, fn) { const k = 'rt:x' + Math.random().toString(36).slice(2, 9); acts.set(k, fn); return k; }
  function regBind(u, fn) { const k = 'rt:b' + Math.random().toString(36).slice(2, 9); binds.set(k, fn); return k; }
  function arrayForm(u, g) {
    const k = S.arrKind, a = S.arr[k] = S.arr[k] || ({ single: { x: 10, y: 10 }, line: { x: 10, y: 10, pitch: 20, angle: 0, count: 5 }, grid: { x: 10, y: 10, px: 20, py: 20, nx: 4, ny: 3 }, pcd: { cx: 50, cy: 50, dia: 60, count: 6, start: 0 } })[k];
    const f = (lbl, key, int) => u.fld(lbl, (int ? u.int : u.num)(a[key], v => { a[key] = v; }));
    let h = '';
    if (k === 'single') h = '<div class="grid2">' + f('X', 'x') + f('Y', 'y') + '</div>';
    if (k === 'line') h = '<div class="grid3">' + f('시작 X', 'x') + f('시작 Y', 'y') + f('간격', 'pitch') + f('각도(°)', 'angle') + f('개수', 'count', 1) + '</div>';
    if (k === 'grid') h = '<div class="grid3">' + f('시작 X', 'x') + f('시작 Y', 'y') + '<span></span>' + f('X 간격', 'px') + f('Y 간격', 'py') + '<span></span>' + f('X 개수', 'nx', 1) + f('Y 개수', 'ny', 1) + '</div>';
    if (k === 'pcd') h = '<div class="grid3">' + f('중심 X', 'cx') + f('중심 Y', 'cy') + f('PCD 직경', 'dia') + f('개수', 'count', 1) + f('시작각(°)', 'start') + '</div>';
    h += '<div class="row" style="margin-top:6px">' + u.btn('홀 추가', () => {
      const e = C.checkArrayParams(k, a); if (e.length) return toast(e[0], 'err');
      const pts = k === 'single' ? [{ x: C.r3(a.x), y: C.r3(a.y) }] : k === 'line' ? C.genLine(a) : k === 'grid' ? C.genGrid(a) : C.genPCD(a);
      const total = P.groups.reduce((s, x) => s + x.holes.length, 0);
      if (total + pts.length > C.MAX_HOLES) return toast('프로젝트 홀 수는 최대 ' + C.MAX_HOLES + '개입니다.', 'err');
      mutate(() => { pts.forEach(p => g.holes.push({ id: C.uid('h'), x: p.x, y: p.y })); });
      toast(pts.length + '개 홀을 추가했습니다.', 'ok');
    }, 'primary sm') + '<small>좌표는 공작물 원점(' + esc(C.ORIGIN_LABEL[P.stock.origin]) + ') 기준</small></div>';
    return h;
  }

  function bottomCheck() {
    U('bc'); // 이 영역의 이전 핸들러 정리
    const c = counts(), ds = downloadState(), iss = S.V.issues;
    let h = '';
    if (!ds.ok) h += '<div class="banner err">✖ NC 파일 생성 차단 — ' + esc(ds.why) + '. 아래 오류를 해결하세요.</div>';
    else if (ds.test || c.w || c.nw) h += '<div class="banner warn">⚠ NC 다운로드 가능' + (ds.test ? ' — <u>검증용(TEST)</u> 표시: 장비 실가공 검증 전' : '') + (c.w + c.nw ? ' · 경고 ' + (c.w + c.nw) + '건 확인' : '') + '</div>';
    else h += '<div class="banner ok">✔ 모든 자동 검증 통과 — NC 다운로드 가능</div>';
    h += '<div class="chkcols"><div><b>모델 검증 (11개 항목)</b>';
    C.CHECKS.forEach(ck => {
      const li = iss.filter(i => i.cat === ck.id);

  /* ---------------- 다운로드·파일 ---------------- */
  function downloadText(name, text, type) {
    const blob = new Blob([text], { type: type || 'text/plain' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function pickFile(accept, cb) {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    i.onchange = () => {
      const f = i.files[0]; if (!f) return;
      if (f.size > 5 * 1024 * 1024) return toast('파일이 너무 큽니다 (5MB 이하).', 'err');
      const r = new FileReader();
      r.onload = () => { try { cb(String(r.result)); } catch (e) { toast('파일을 읽을 수 없습니다: ' + e.message, 'err'); } };
      r.readAsText(f);
    };
    i.click();
  }
  function copyText(t) {
    if (!t) return toast('복사할 내용이 없습니다.', 'err');
    const done = () => toast('클립보드에 복사했습니다.', 'ok');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
    function fallback() { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('복사 실패: 직접 선택하여 복사하세요.', 'err'); } ta.remove(); }
  }
  function doDownload() {
    const ds = downloadState();

      const L = text.split(/\r?\n/), oi = L.findIndex(l => /^\s*O\d/.test(l));

      '가공 전 반드시 확인하세요:\n• 공구 길이·공작물 좌표계(' + P.settings.wcs + ') 보정값\n• Z를 띄운 드라이런(공회전), 싱글 블록 운전\n• 클램프·지그 위치와 소재 하부 여유\n\n다운로드할까요?';
    if (!confirm(msg)) return;
    const name = (ds.test ? 'TEST_' : '') + 'O' + String(P.programNo).padStart(4, '0') + '_' + (C.ncText(P.name, 20).replace(/[^A-Z0-9_-]+/g, '_') || 'PROGRAM') + (S.nc.edited ? '_EDIT' : '') + '.nc';
    downloadText(name, text.replace(/\r?\n/g, '\r\n') + '\r\n', 'text/plain');

  }

  /* ---------------- 그래픽 화면 ---------------- */
  const cv = () => $('#cv');

    const hint = { select: '홀 클릭=선택 · 드래그=이동 · 빈 곳 드래그=화면 이동 · 휠/두 손가락=확대', add: '클릭/터치 위치에 [' + (curGroup() ? curGroup().name : '그룹 없음') + '] 홀 추가', clamp: '드래그하여 클램프 영역 지정 (높이 기본 30mm)' };

  function setMode(m) { S.mode = m; renderVTools(); drawView(); }
  function deleteSelectedHole() {
    const g = curGroup(); if (!g || !S.sel.hid) return;
    const i = g.holes.findIndex(h => h.id === S.sel.hid); if (i < 0) return;
    mutate(() => { g.holes.splice(i, 1); S.sel.hid = null; });
  }
  // 그래픽 모듈 (ui/graphics.js)
  const G = window.PCAM_UI.createGraphics(() => ({ P, S, DB, drag, machine }));
  const canvasSize = G.size, w2s = G.w2s, s2w = G.s2w, fitView = G.fit, zoom = G.zoom, drawView = G.draw;
  function snap(v) { const gs = DB.settings.grid; return gs.snap ? C.r3(Math.round(v / gs.step) * gs.step) : C.r3(v); }
  function hitHole(px, py) {
    const tm = C.toolMap(machine()); let best = null, bd = Infinity;
    P.groups.forEach(g => { const d = C.holeDiaForGroup(g, tm) || 3; g.holes.forEach(h => { const [sx, sy] = w2s(h.x, h.y); const dist = Math.hypot(sx - px, sy - py); if (dist <= Math.max(10, d / 2 * S.view.scale) && dist < bd) { bd = dist; best = { g, h }; } }); });
    return best;
  }
  let drag = null; const ptrs = new Map(); let pinch = null;
  function initCanvas() {
    const c = cv();
    c.addEventListener('contextmenu', e => e.preventDefault());
    c.addEventListener('wheel', e => { e.preventDefault(); const r = c.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    c.addEventListener('pointerdown', e => {
      c.setPointerCapture(e.pointerId);
      const r = c.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      ptrs.set(e.pointerId, { x: px, y: py });
      if (ptrs.size === 2) { const [p1, p2] = [...ptrs.values()]; pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y), mx: (p1.x + p2.x) / 2, my: (p1.y + p2.y) / 2 }; drag = null; return; }
      const w0 = s2w(px, py);
      if (e.button === 1 || e.button === 2) { drag = { kind: 'pan', sx: px, sy: py, cx: S.view.cx, cy: S.view.cy }; return; }
      if (S.mode === 'select') {
        const hit = hitHole(px, py);
        if (hit) { S.sel = { gid: hit.g.id, hid: hit.h.id }; drag = { kind: 'move', g: hit.g, h: hit.h, sx: px, sy: py, ox: hit.h.x, oy: hit.h.y, moved: false, snap: JSON.stringify(P) }; renderAll(); return; }
        drag = { kind: 'pan', sx: px, sy: py, cx: S.view.cx, cy: S.view.cy, click: true };
      } else if (S.mode === 'add') drag = { kind: 'add', sx: px, sy: py, w0 };
      else if (S.mode === 'clamp') drag = { kind: 'clamp', sx: px, sy: py, w0: [snap(w0[0]), snap(w0[1])], cur: null };
    });
    c.addEventListener('pointermove', e => {
      const r = c.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      const [wx, wy] = s2w(px, py);
      $('#cursorPos').textContent = 'X ' + C.fmt(snap(wx)) + '  Y ' + C.fmt(snap(wy)) + (DB.settings.grid.snap ? ' (스냅)' : '');
      if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: px, y: py });
      if (pinch && ptrs.size === 2) {
        const [p1, p2] = [...ptrs.values()]; const d = Math.hypot(p1.x - p2.x, p1.y - p2.y), mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        S.view.cx -= (mx - pinch.mx) / S.view.scale; S.view.cy += (my - pinch.my) / S.view.scale;
        if (pinch.d > 0) zoom(d / pinch.d, mx, my); else drawView();
        pinch = { d, mx, my }; return;
      }
      if (!drag) return;
      if (drag.kind === 'pan') { if (Math.hypot(px - drag.sx, py - drag.sy) > 3) drag.click = false; S.view.cx = drag.cx - (px - drag.sx) / S.view.scale; S.view.cy = drag.cy + (py - drag.sy) / S.view.scale; drawView(); }
      else if (drag.kind === 'move') {
        if (!drag.moved && Math.hypot(px - drag.sx, py - drag.sy) < 5) return;
        drag.moved = true; drag.h.x = snap(wx); drag.h.y = snap(wy); recompute(); drawView();
      } else if (drag.kind === 'clamp') { drag.cur = [snap(wx), snap(wy)]; drawView(); }
    });
    const end = e => {
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinch = null;
      if (!drag) return;
      const r = c.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      const d = drag; drag = null;
      if (d.kind === 'move' && d.moved) {
        const nx = d.h.x, ny = d.h.y; d.h.x = d.ox; d.h.y = d.oy;
        mutate(() => { d.h.x = nx; d.h.y = ny; });
      } else if (d.kind === 'pan' && d.click && e.type === 'pointerup') { if (S.sel.hid) { S.sel.hid = null; renderAll(); } }
      else if (d.kind === 'add' && e.type === 'pointerup' && Math.hypot(px - d.sx, py - d.sy) < 6) {
        const g = curGroup();
        if (!g) { toast('먼저 홀 그룹을 추가하세요.', 'err'); return; }
        const total = P.groups.reduce((s, x) => s + x.holes.length, 0);
        if (total >= C.MAX_HOLES) return toast('홀 수 한계 초과', 'err');
        const hid = C.uid('h');
        mutate(() => { g.holes.push({ id: hid, x: snap(d.w0[0]), y: snap(d.w0[1]) }); S.sel.hid = hid; });
      } else if (d.kind === 'clamp' && d.cur) {
        const w = d.cur[0] - d.w0[0], hh = d.cur[1] - d.w0[1];
        if (Math.abs(w) < 1 || Math.abs(hh) < 1) { drawView(); return; }
        mutate(() => { P.clamps.push({ id: C.uid('c'), x: Math.min(d.w0[0], d.cur[0]), y: Math.min(d.w0[1], d.cur[1]), w: Math.abs(w), h: Math.abs(hh), height: 30 }); });
        toast('클램프를 추가했습니다. 높이는 [소재·가공] 탭에서 수정하세요.', 'ok');
      } else drawView();
    };
    c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
    c.addEventListener('pointerleave', () => { $('#cursorPos').textContent = ''; });
    window.addEventListener('resize', () => drawView());
    if (window.ResizeObserver) new ResizeObserver(() => drawView()).observe($('#canvasWrap'));
  }

        u.btn('⧉ 링크 복사', () => copyText(url), 'sm') + (navigator.share ? u.btn('공유하기', () => navigator.share({ title: '푸른 AI CAM', url }).catch(() => { }), 'sm') : '') +
        u.btn('QR 이미지 저장', () => { const c = $('#qrCanvas'); c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'pureun-ai-cam-qr.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }); }, 'sm') + '</div>' +
        '<small>앱 주소만 공유됩니다. 프로젝트 데이터·인증 정보는 포함되지 않습니다.</small></div>';
    }, null, { second: !!$('#dlg').open });
    if (url) drawQR($('#qrCanvas'), url);
  }
  function drawQR(c, text) {
    try {
      const q = window.qrcode(0, 'M'); q.addData(text, 'Byte'); q.make();
      const n = q.getModuleCount(), cell = 8, quiet = 4, size = (n + quiet * 2) * cell;
      c.width = size; c.height = size;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.fillStyle = '#000';
      for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
    } catch (e) { toast('QR코드 생성 실패: ' + e.message, 'err'); }
  }

  /* ---------------- 관리자 인증·설정 ---------------- */
  // 관리자 해시 도구는 저장 모듈(ui/storage.js)
  function openAdminAuth() {
    if (!window.crypto || !crypto.subtle) return toast('이 브라우저 환경에서는 안전한 암호화 기능을 쓸 수 없어 관리자 설정을 열 수 없습니다 (https 또는 로컬 파일로 실행).', 'err');
    const rec = adminRec();
    if (!rec) {
      openDlg('관리자 비밀번호 등록', u => '<p>이 기기(브라우저)에서 처음 관리자 설정을 엽니다. 관리자 비밀번호를 등록하세요.</p><div class="grid2">' +
        '<label class="fld"><span>새 비밀번호 (8자 이상, 영문+숫자)</span><input type="password" id="apw1" autocomplete="new-password"></label>' +
        '<label class="fld"><span>비밀번호 확인</span><input type="password" id="apw2" autocomplete="new-password"></label></div>' +
        '<p><small>비밀번호 원문은 저장하지 않고 PBKDF2-SHA256 해시만 이 브라우저에 저장합니다. 기기별로 따로 등록되며 동기화되지 않습니다. 브라우저 저장소는 PC 사용자 계정 보안에 의존합니다.</small></p>',
        u => u.btn('등록', async () => {
          const a = $('#apw1').value, b = $('#apw2').value;
          if (!pwRule(a)) return toast('8자 이상, 영문과 숫자를 포함하세요.', 'err');
          if (a !== b) return toast('비밀번호 확인이 일치하지 않습니다.', 'err');
          const salt = crypto.getRandomValues(new Uint8Array(16)), iter = 150000;
          const hash = await pbkdf2(a, salt, iter);
          lsSet(ADMIN_KEY, JSON.stringify({ v: 1, salt: b64(salt), iter, hash, fails: 0, lockUntil: 0 }));
          toast('관리자 비밀번호를 등록했습니다.', 'ok'); startAdmin();
        }, 'primary'), { second: true });
      return;
    }
    const lockLeft = () => Math.max(0, (rec.lockUntil || 0) - Date.now());
    openDlg('관리자 인증', u => (lockLeft() ? '<p style="color:var(--err)">인증 실패가 반복되어 잠겨 있습니다. ' + Math.ceil(lockLeft() / 60000) + '분 후 다시 시도하세요.</p>' : '') +
      '<label class="fld"><span>관리자 비밀번호</span><input type="password" id="apw" autocomplete="current-password"></label>' +
      '<p><small>5회 실패 시 5분간 잠깁니다. ' + (rec.fails ? '현재 실패 ' + rec.fails + '회' : '') + '</small></p>' +
      '<details><summary><small>비밀번호를 잊으셨나요?</small></summary><p><small>재설정하면 관리자 비밀번호가 삭제되고, 보안을 위해 모든 장비의 실가공 검증 승인도 해제됩니다.</small></p>' +
      u.btn('비밀번호 재설정', () => {
        if (prompt('재설정하려면 "재설정" 을 입력하세요.') !== '재설정') return;
        try { localStorage.removeItem(ADMIN_KEY); } catch (e) { }
        DB.machines.forEach(m => { m.verified = false; m.verifiedBy = ''; m.verifiedAt = ''; });
        saveDB(true); closeDlg($('#dlg2')); renderAll(); toast('관리자 비밀번호를 재설정했습니다. 다시 등록하세요.', 'warn');
      }, 'sm danger') + '</details>',
      u => u.btn('확인', async () => {
        const r = adminRec(); if (!r) return;
        if (Math.max(0, (r.lockUntil || 0) - Date.now())) return toast('잠금 중입니다.', 'err');
        const pw = $('#apw').value; if (!pw) return;
        const hash = await pbkdf2(pw, unb64(r.salt), r.iter);
        if (safeEq(hash, r.hash)) { r.fails = 0; r.lockUntil = 0; lsSet(ADMIN_KEY, JSON.stringify(r)); startAdmin(); }
        else {
          r.fails = (r.fails || 0) + 1;
          if (r.fails >= 5) { r.fails = 0; r.lockUntil = Date.now() + 5 * 60000; toast('5회 실패 — 5분간 잠깁니다.', 'err'); }
          else toast('비밀번호가 틀렸습니다 (' + r.fails + '/5).', 'err');
          lsSet(ADMIN_KEY, JSON.stringify(r)); beep(); openAdminAuth();
        }
      }, 'primary'), { second: true });
    setTimeout(() => { const i = $('#apw'); if (i) { i.focus(); i.onkeydown = e => { if (e.key === 'Enter') $('#dlg2 .dfoot button').click(); }; } }, 50);
  }
  let adminTimer = null;
  function startAdmin() {

    clearTimeout(adminTimer); adminTimer = setTimeout(endAdmin, 10 * 60000);

  }
  function endAdmin() { S.admin.authed = false; clearTimeout(adminTimer); const d = $('#dlg2'); if (d.open && d.dataset.admin === '1') d.close(); }
  function openAdminPanel() {
    if (!S.admin.authed || Date.now() > S.admin.until) { S.admin.authed = false; return openAdminAuth(); }
    const d = openDlg('관리자 설정', u => {
      let h = '<div class="adm"><b>⚠ 관리자 모드</b> <small>창을 닫거나 10분이 지나면 자동 종료되며 다시 인증해야 합니다.</small></div>';
      h += '<h3>장비 실가공 검증 승인</h3><p><small>실제 머시닝센터에서 아래 시험을 마친 장비만 승인하세요. 승인 전 NC 파일은 "검증용(TEST)"으로 표시됩니다. 장비 설정을 바꾸면 승인이 자동 해제됩니다.</small></p>';
      DB.machines.forEach(m => {
        h += '<div class="sect"><b>' + esc(m.name) + ' ' + (m.verified ? '<span class="pill ok">승인됨 · ' + esc(m.verifiedBy) + ' · ' + esc(m.verifiedAt) + '</span>' : '<span class="pill warn">미승인</span>') + '</b>';
        if (m.verified) h += u.btn('승인 해제', () => { m.verified = false; m.verifiedBy = ''; m.verifiedAt = ''; saveDB(true); renderAll(); openAdminPanel(); }, 'sm danger');
        else {
          const id = m.id.replace(/[^a-z0-9]/gi, '');
          h += '<label class="chk"><input type="checkbox" id="vc1' + id + '">Z를 띄운 드라이런(공회전)으로 경로 확인</label><label class="chk"><input type="checkbox" id="vc2' + id + '">싱글 블록 운전으로 공구 교환·보정·사이클 확인</label><label class="chk"><input type="checkbox" id="vc3' + id + '">시편 실가공 후 위치·깊이·나사 게이지 확인</label>' +
            '<div class="grid2"><label class="fld"><span>확인자</span><input type="text" id="vby' + id + '" maxlength="40"></label><label class="fld"><span>메모 (사용 파라미터 등)</span><input type="text" id="vno' + id + '" maxlength="200"></label></div>' +
            u.btn('검증 완료 승인', () => {
              if (![1, 2, 3].every(k => $('#vc' + k + id).checked)) return toast('세 가지 실장비 시험을 모두 확인하세요.', 'err');
              const by = $('#vby' + id).value.trim(); if (!by) return toast('확인자를 입력하세요.', 'err');
              m.verified = true; m.verifiedBy = by; m.verifiedAt = new Date().toISOString().slice(0, 10); m.verifyNote = $('#vno' + id).value.trim();
              saveDB(true); renderAll(); openAdminPanel(); toast('실가공 검증을 승인했습니다.', 'ok');
            }, 'sm primary');
        }
        h += '</div>';
      });
      h += '<h3>관리자 비밀번호 변경</h3><div class="grid3"><label class="fld"><span>현재 비밀번호</span><input type="password" id="cpw0" autocomplete="current-password"></label><label class="fld"><span>새 비밀번호</span><input type="password" id="cpw1" autocomplete="new-password"></label><label class="fld"><span>새 비밀번호 확인</span><input type="password" id="cpw2" autocomplete="new-password"></label></div>' +
        u.btn('비밀번호 변경', async () => {
          const r = adminRec(), a = $('#cpw1').value;
          if (!safeEq(await pbkdf2($('#cpw0').value, unb64(r.salt), r.iter), r.hash)) return toast('현재 비밀번호가 틀렸습니다.', 'err');
          if (!pwRule(a)) return toast('8자 이상, 영문과 숫자를 포함하세요.', 'err');
          if (a !== $('#cpw2').value) return toast('새 비밀번호 확인이 일치하지 않습니다.', 'err');
          const salt = crypto.getRandomValues(new Uint8Array(16));
          lsSet(ADMIN_KEY, JSON.stringify({ v: 1, salt: b64(salt), iter: r.iter, hash: await pbkdf2(a, salt, r.iter), fails: 0, lockUntil: 0 }));
          ['cpw0', 'cpw1', 'cpw2'].forEach(k => { $('#' + k).value = ''; }); toast('비밀번호를 변경했습니다.', 'ok');
        }, 'sm');
      h += '<h3>데이터 초기화</h3><p><small>이 브라우저의 모든 프로젝트·장비·공정 묶음을 지우고 초기 상태로 되돌립니다 (자동 백업 후 진행).</small></p>' +
        u.btn('전체 데이터 초기화', () => {
          if (prompt('초기화하려면 "초기화" 를 입력하세요.') !== '초기화') return;
          backupAll(); DB = freshDB(); P = DB.projects[DB.currentProjectId]; S.undo = []; S.redo = []; S.view.fitted = false; S.nc.edited = false;
          saveDB(true); renderAll(); endAdmin(); toast('초기화했습니다.', 'warn');
        }, 'sm danger');
      return h;
    }, null, { second: true, onClose: () => { S.admin.authed = false; clearTimeout(adminTimer); } });
    d.dataset.admin = '1';
  }

  /* ---------------- 시작 ---------------- */
  function init() {
    DB = loadDB();
    P = DB.projects[DB.currentProjectId] || Object.values(DB.projects)[0];
    if (!P) { const n = C.newProject(DB.machines[0]); DB.projects[n.id] = n; P = n; }
    if (!DB.machines.find(m => m.id === P.machineId)) P.machineId = DB.machines[0].id;
    applyTheme();
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); drawView(); });
    $('#projName').addEventListener('change', e => mutate(() => { P.name = e.target.value.slice(0, 60) || '프로젝트'; }));
    $('#btnProjects').onclick = openProjects;
    $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
    $('#btnDownload').onclick = doDownload;
    $('#btnShare').onclick = openShare;
    $('#btnSettings').onclick = openSettings;
    document.querySelectorAll('#leftTabs button').forEach(b => b.onclick = () => { S.leftTab = b.dataset.tab; renderAll(); });
    document.querySelectorAll('#bottomTabs button').forEach(b => b.onclick = () => { S.bottomTab = b.dataset.tab; renderAll(); });
    document.querySelectorAll('#mnav button').forEach(b => b.onclick = () => { S.mpanel = b.dataset.m; renderAll(); });
    document.addEventListener('keydown', e => {
      const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select';
      if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
      else if (!typing && (e.key === 'Delete' || e.key === 'Backspace') && S.sel.hid && !document.querySelector('dialog[open]')) { e.preventDefault(); deleteSelectedHole(); }
      else if (!typing && e.key === 'Escape' && S.mode !== 'select') setMode('select');
      else if (e.altKey && e.shiftKey && e.key.toLowerCase() === 'a') { e.preventDefault(); openAdminAuth(); } // 접근성용 대체 관리자 진입 (비밀번호 필요)
    });
    window.addEventListener('beforeunload', () => saveDB(true));
    initCanvas();
    renderAll();
    requestAnimationFrame(() => { S.view.fitted = false; drawView(); });
  }
  window.addEventListener('DOMContentLoaded', init);
  window.__PCAM_UI__ = { get P() { return P; }, get S() { return S; }, get DB() { return DB; }, renderAll, downloadState };
})();

</script>
</body>
