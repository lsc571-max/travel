<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="푸른 AI CAM - 소규모 기계가공 업체용 FANUC 3축 머시닝센터 구멍·탭·포켓 가공 CAM (무설치·오프라인 웹앱, 3D 가공 시뮬레이션)">
<meta name="theme-color" content="#0b6e79">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>푸른 AI CAM</title>
<style>
/* =====================================================================
 * 푸른 AI CAM V0.4 디자인 시스템
 *  - 색: 중립 회색 바탕 + 브랜드(푸른 청록) 1색 + 가공 종류별 고정색 + 상태색(성공·경고·오류)
 *  - 간격 4/8px 단위, 모서리 10px, 버튼 높이 36px(PC) / 44px(모바일)
 *  - 글자: 시스템 한글 글꼴(맑은 고딕/Apple SD/Noto), 숫자는 등폭 숫자(tabular)
 * ===================================================================== */
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface2:#f6f8fb;--surface3:#edf1f6;--line:#dfe5ec;--line2:#cdd5df;
  --text:#121a24;--text2:#3d4a5a;--muted:#6b7787;
  --brand:#0b6e79;--brand-ink:#ffffff;--brand-soft:#e3f2f3;--brand-strong:#085760;
  --c-center:#14a37f;--c-drill:#2f6fed;--c-tap:#8b5cf6;--c-pocket:#ee8a10;--c-custom:#64748b;
  --ok:#11905a;--ok-soft:#e6f6ee;--warn:#c2620a;--warn-soft:#fff3e3;--err:#d0312d;--err-soft:#fdecec;--info:#2b62b8;--info-soft:#e9f0fb;
  --cv-bg:#fbfcfd;--cv-grid:#e8edf2;--cv-grid2:#d4dce5;--cv-stock:#e4ebf2;--cv-stock-line:#5f7d99;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--shadow2:0 8px 24px rgba(16,24,40,.12);
  --radius:10px;--font:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"D2Coding","Cascadia Mono",Consolas,ui-monospace,monospace;
  font-size:14.5px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d1116;--surface:#161c23;--surface2:#1b222b;--surface3:#212a34;--line:#2a333e;--line2:#36414d;
  --text:#e8edf2;--text2:#c3ccd6;--muted:#8d99a7;
  --brand:#2bb3bf;--brand-ink:#06262a;--brand-soft:#14363a;--brand-strong:#57d0da;
  --c-center:#34c99c;--c-drill:#5b8ff9;--c-tap:#a78bfa;--c-pocket:#ffa94d;--c-custom:#94a3b8;
  --ok:#3dd68c;--ok-soft:#123224;--warn:#f5a54a;--warn-soft:#3a2a12;--err:#ff6b66;--err-soft:#3a1b1b;--info:#7fb0ef;--info-soft:#192b44;
  --cv-bg:#12171d;--cv-grid:#1c242d;--cv-grid2:#27313c;--cv-stock:#203040;--cv-stock-line:#86a9c9;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow2:0 8px 24px rgba(0,0,0,.5);color-scheme:dark;
}
:root[data-fs="s"]{font-size:13.5px}
:root[data-fs="l"]{font-size:16px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex-shrink:0}
.num,.mono{font-variant-numeric:tabular-nums}
small,.muted{color:var(--muted)}
h3{font-size:.98em;margin:16px 0 8px;display:flex;align-items:center;gap:8px;color:var(--text)}
h3:first-child{margin-top:2px}
h3 .step{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:.78em}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- 버튼 ---------- */
button{cursor:pointer;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:34px;line-height:1.25;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s,box-shadow .12s}
button:hover:not(:disabled){border-color:var(--brand);background:var(--surface2)}
button:active:not(:disabled){transform:translateY(.5px)}
button:disabled,button[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:650}
button.primary:hover:not(:disabled){background:var(--brand-strong);border-color:var(--brand-strong)}
button.danger{color:var(--err)}
button.ghost{border-color:transparent;background:transparent}
button.sm{padding:3px 8px;min-height:28px;font-size:.92em}
button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong);font-weight:650}
.ibtn{width:36px;height:36px;padding:0;justify-content:center;border-color:transparent;background:transparent;color:var(--text2)}
.ibtn:hover:not(:disabled){background:var(--surface3);border-color:var(--line)}
.ibtn.sm{width:28px;height:28px;min-height:28px}
.tbtn{border-color:transparent;background:transparent;color:var(--text2);font-weight:550}
.tbtn:hover:not(:disabled){background:var(--surface3)}

/* ---------- 입력 ---------- */
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;min-height:34px;min-width:0}
input:hover,select:hover{border-color:var(--muted)}
input[type=number]{width:100%;font-variant-numeric:tabular-nums}
input[type=checkbox]{min-height:auto;width:17px;height:17px;accent-color:var(--brand)}
input[type=range]{accent-color:var(--brand);padding:0;border:0;min-height:auto}
input[type=color]{padding:2px;width:48px}
textarea{width:100%}
label{display:block}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{color:var(--muted);font-size:.86em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld>span b{color:var(--text2);font-weight:600}
.fld select,.fld input[type=text]{width:100%}
.unit{position:relative}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:.95em;padding:4px 0;cursor:pointer}

/* ---------- 레이아웃 ---------- */
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:288px minmax(0,1fr) 384px;grid-template-rows:56px minmax(0,1fr) 0 38px;
  grid-template-areas:"top top top" "left view right" "left drawer drawer" "status status status";gap:0}
#app.drawer-open{grid-template-rows:56px minmax(0,1fr) minmax(200px,40vh) 38px}
.panel{background:var(--surface);min-height:0;min-width:0}
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:3}
#left{grid-area:left;display:flex;flex-direction:column;border-right:1px solid var(--line)}
#view{grid-area:view;display:flex;flex-direction:column;background:var(--bg)}
#right{grid-area:right;display:flex;flex-direction:column;border-left:1px solid var(--line)}
#bottom{grid-area:drawer;display:none;flex-direction:column;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(16,24,40,.06)}
#app.drawer-open #bottom{display:flex}
#status{grid-area:status;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--surface);border-top:1px solid var(--line);font-size:.92em;white-space:nowrap;overflow:hidden}
#mnav{display:none}
.pbody{overflow:auto;padding:12px 14px;flex:1;min-height:0}

/* 머리글 */
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;margin-right:6px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:conic-gradient(from 210deg,var(--brand),#2bb3bf,var(--brand));box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 7px var(--brand)}
.brand b{font-size:1.06em;letter-spacing:-.01em}
.ver{font-size:10.5px;color:var(--muted);opacity:.8}
.projname{width:260px;max-width:30vw;font-weight:600;border-color:transparent;background:var(--surface2)}
.projname:hover,.projname:focus{border-color:var(--line2);background:var(--surface)}
.hspace{flex:1}
.hgroup{display:flex;gap:2px;padding:0 4px;border-left:1px solid var(--line)}
.savebtn{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700;min-height:38px;padding:0 16px;border-radius:9px;margin-left:6px;box-shadow:0 2px 6px rgba(11,110,121,.25)}
.savebtn:hover:not(:disabled){background:var(--brand-strong)!important;border-color:var(--brand-strong)!important}
.savebtn.blocked{background:var(--surface3);color:var(--muted);border-color:var(--line2);box-shadow:none}
.savebtn.test::after{content:"검증용";font-size:.7em;font-weight:700;background:var(--warn);color:#fff;border-radius:6px;padding:1px 5px;margin-left:2px}

/* ---------- 작업 목록 (왼쪽) ---------- */
.tree .sect-t{font-size:.78em;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:14px 2px 6px;display:flex;align-items:center;gap:6px}
.tree .sect-t:first-child{margin-top:0}
.titem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid transparent;cursor:pointer;position:relative;margin-bottom:4px;background:var(--surface)}
.titem:hover{background:var(--surface2);border-color:var(--line)}
.titem.sel{background:var(--brand-soft);border-color:var(--brand)}
.titem .ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.titem .ico svg{width:20px;height:20px}
.titem .tx{flex:1;min-width:0}
.titem .tx b{display:block;font-size:.98em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82em}
.titem .st{display:flex;align-items:center}
.titem .st svg{width:16px;height:16px}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.err{color:var(--err)}
.ico.k-stock{background:#56677a}.ico.k-drill{background:var(--c-drill)}.ico.k-tap{background:var(--c-tap)}.ico.k-pocket{background:var(--c-pocket)}.ico.k-custom{background:var(--c-custom)}.ico.k-nc{background:#334155}
.addrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.addbtn{flex-direction:column;gap:3px;padding:8px 4px;min-height:58px;font-size:.86em;font-weight:600;border-style:dashed;justify-content:center}
.addbtn svg{width:20px;height:20px}
.addbtn.k-drill{color:var(--c-drill)}.addbtn.k-tap{color:var(--c-tap)}.addbtn.k-pocket{color:var(--c-pocket)}
.titem .del{opacity:0;transition:opacity .1s}
.titem:hover .del,.titem.sel .del{opacity:1}
.tsum{margin-top:12px;padding:10px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-size:.88em;line-height:1.6}
.tsum b{font-variant-numeric:tabular-nums}

/* ---------- 속성 (오른쪽) ---------- */
.prophead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.prophead .ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.prophead .ico svg{width:19px;height:19px}
.prophead input{flex:1;font-weight:650;font-size:1.02em;border-color:transparent;background:transparent;padding-left:4px}
.prophead input[type=color]{flex:0 0 34px;width:34px;height:30px;min-height:30px;padding:2px;border-color:var(--line2)}
.prophead input:hover,.prophead input:focus{border-color:var(--line2);background:var(--surface)}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--surface2);padding:2px;gap:2px}
.seg button{flex:1;border:0;border-radius:7px;background:transparent;min-height:32px;justify-content:center;font-weight:550;color:var(--text2);padding:4px 6px}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.k-drill{color:var(--c-drill)}.seg button.on.k-tap{color:var(--c-tap)}.seg button.on.k-pocket{color:var(--c-pocket)}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:8px 0;background:var(--surface2)}
.card.wiz{background:var(--surface)}
.card .head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.card .head b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opinfo{font-size:.86em;color:var(--muted);margin-top:6px;line-height:1.5}
.opinfo b{color:var(--text)}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chips .chip{border-radius:14px;padding:1px 9px;min-height:26px;font-size:.88em}
.gen{margin-top:10px;border-top:1px dashed var(--line2);padding-top:8px}
.gen>b{font-size:.9em}
.genrow{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.genrow:last-of-type{border-bottom:0}
.genrow .num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:.75em;font-weight:700}
.genrow .nm{font-weight:600;font-size:.93em}
.genrow small{grid-column:2;font-variant-numeric:tabular-nums}
.note{font-size:.87em;margin:6px 0 0;padding:6px 9px;border-radius:7px;line-height:1.45}
.note.error{background:var(--err-soft);color:var(--err)}.note.warn{background:var(--warn-soft);color:var(--warn)}.note.info{background:var(--info-soft);color:var(--info)}
details.adv,details.sect2{margin:10px 0;border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px;background:var(--surface)}
details.adv>summary,details.sect2>summary{cursor:pointer;font-weight:600;padding:7px 0;color:var(--text2)}
details[open]>summary{margin-bottom:6px}
table.tbl{width:100%;border-collapse:collapse;font-size:.9em;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left}
table.tbl th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface);font-size:.86em}
table.tbl input,table.tbl select{width:100%;min-height:28px;padding:2px 5px}
table.tbl tr.sel td{background:var(--brand-soft)}
.tblwrap{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.subtabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.8em;font-weight:650}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.err{background:var(--err-soft);color:var(--err)}.pill.info{background:var(--info-soft);color:var(--info)}
.sect{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:10px 0}
.sect>b{display:block;margin-bottom:6px}

/* 깊이 단면도 */
.depth{margin:10px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:8px 8px 4px}
.depth .dt{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.9em;margin:0 4px 4px}
.depth svg{width:100%;height:auto;display:block}
.depth text{font-family:var(--font);font-variant-numeric:tabular-nums}

/* ---------- 화면 (가운데) ---------- */
.vhead{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.vtabs{display:flex;background:var(--surface3);border-radius:9px;padding:3px;gap:2px}
.vtabs button{border:0;background:transparent;min-height:30px;font-weight:600;color:var(--text2);border-radius:7px;padding:4px 14px}
.vtabs button.act{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.vtools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;flex:1}
.vtools .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.vtools select{min-height:30px}
.canvasWrap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:var(--cv-bg)}
.cursorpos{position:absolute;left:10px;bottom:10px;font:12px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 8px;pointer-events:none;box-shadow:var(--shadow)}
.cursorpos:empty{display:none}
.viewhint{position:absolute;right:10px;top:10px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 8px;pointer-events:none;max-width:60%;box-shadow:var(--shadow)}
.v3wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.v3wrap[hidden]{display:none}
.v3host{position:relative;flex:1;min-height:0;overflow:hidden}
.v3-canvas{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none;display:block}
.v3-msg{padding:40px;text-align:center;color:var(--muted)}
.hud3{position:absolute;left:12px;top:12px;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:min(380px,calc(100% - 24px))}
.hud3 .box{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:9px;padding:7px 10px;box-shadow:var(--shadow);font-size:.88em;line-height:1.5}
.hud3 .xyz{font-family:var(--mono);font-size:.95em;font-variant-numeric:tabular-nums}
.hud3 .xyz b{display:inline-block;min-width:76px}
.hud3 .legend{display:flex;gap:10px;flex-wrap:wrap}
.hud3 .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hud3 .assume{font-size:.8em;color:var(--muted)}
.v3views{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.v3views button{min-height:30px;padding:3px 10px;font-size:.86em;background:var(--surface);box-shadow:var(--shadow)}
.simbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.simbar .play{width:40px;height:40px;border-radius:50%;padding:0;justify-content:center;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.simbar .play svg{width:20px;height:20px}
.simbar .tline{flex:1;min-width:180px;position:relative;height:30px;display:flex;align-items:center}
.simbar .bands{position:absolute;left:0;right:0;top:11px;height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface3)}
.simbar .bands span{height:100%}
.simbar input[type=range]{position:relative;width:100%;background:transparent;-webkit-appearance:none;appearance:none;height:30px;margin:0}
.simbar input[type=range]::-webkit-slider-runnable-track{height:8px;background:transparent}
.simbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--brand);margin-top:-5px;box-shadow:var(--shadow)}
.simbar .time{font-family:var(--mono);font-size:.88em;font-variant-numeric:tabular-nums;color:var(--text2);white-space:nowrap}
.simbar select{min-height:32px}

/* ---------- 서랍 (검증·G코드) ---------- */
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex-shrink:0;align-items:center}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;background:transparent;padding:6px 12px;font-weight:550;color:var(--text2)}
.tabs button.act{border-bottom-color:var(--brand);font-weight:700;color:var(--brand)}
.tabs .tspace{flex:1}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;font-size:.78em;font-weight:700;text-align:center}
.badge.err{background:var(--err);color:#fff}.badge.warn{background:var(--warn);color:#fff}.badge.ok{background:var(--ok);color:#fff}
.banner{border-radius:9px;padding:9px 12px;font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner svg{width:18px;height:18px}
.banner.err{background:var(--err-soft);color:var(--err);border:1px solid var(--err)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.todo{border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:8px}
.todo ul{margin:4px 0;padding-left:2px;list-style:none;font-size:.92em}
.todo li{margin:4px 0;cursor:pointer;padding:3px 6px;border-radius:6px}
.todo li:hover{background:var(--surface2)}
.todo li.err{color:var(--err)}.todo li.warn{color:var(--warn)}
.chkcols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.citem{border:1px solid var(--line);border-radius:8px;margin:4px 0;background:var(--surface2)}
.citem>summary{list-style:none;cursor:pointer;padding:6px 9px;display:flex;gap:8px;align-items:center}
.citem>summary::-webkit-details-marker{display:none}
.citem>summary .nm{flex:1}
.citem ul{margin:0;padding:2px 9px 7px 28px;font-size:.9em}
.citem li{margin:3px 0;cursor:pointer}
.citem li.err{color:var(--err)}.citem li.warn{color:var(--warn)}.citem li.info{color:var(--info)}
.ic{width:18px;text-align:center;font-weight:700}
.ic.ok{color:var(--ok)}.ic.err{color:var(--err)}.ic.warn{color:var(--warn)}
.stage{display:flex;gap:6px;align-items:flex-start;font-size:.9em;margin:4px 0}
.codebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.codewrap{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:calc(100% - 46px);min-height:140px}
.gutter{font:12px/1.55 var(--mono);color:var(--muted);text-align:right;padding:6px 8px;background:var(--surface2);user-select:none;overflow:hidden;white-space:pre;min-width:48px}
#ncText{font:12px/1.55 var(--mono);border:0;border-radius:0;resize:none;padding:6px 10px;white-space:pre;overflow:auto;height:100%;flex:1}
#ncText[readonly]{background:var(--surface)}
#ncText.edited{background:var(--warn-soft)}

/* ---------- 상태 표시줄 ---------- */
.sb{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:7px;padding:3px 9px;min-height:28px;font-size:.98em;color:var(--text2)}
.sb:hover{background:var(--surface3)}
.sb svg{width:15px;height:15px}
.sb.err{color:var(--err);font-weight:650}.sb.warn{color:var(--warn);font-weight:650}.sb.ok{color:var(--ok);font-weight:650}
.sbsep{width:1px;height:18px;background:var(--line);margin:0 2px}
.sbspace{flex:1}

/* ---------- 대화상자·알림 ---------- */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--text);max-width:min(860px,94vw);width:94vw;max-height:90vh;box-shadow:var(--shadow2)}
dialog::backdrop{background:rgba(10,15,22,.5);backdrop-filter:blur(2px)}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dhead h2{font-size:1.1em;margin:0;flex:1}
.dbody{padding:14px 16px;overflow:auto;max-height:calc(90vh - 120px)}
.dfoot{display:flex;gap:6px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.gear{font-size:1.25em;border:none;background:transparent;padding:2px 6px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.qrbox canvas{width:min(340px,80vw);height:auto;image-rendering:pixelated;background:#fff;border-radius:8px}
.adm{border:2px solid var(--warn);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--warn-soft)}
#toasts{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:9999;pointer-events:none;align-items:center}
.toast{background:#1d2630;color:#fff;padding:9px 16px;border-radius:9px;font-size:.95em;box-shadow:var(--shadow2);max-width:90vw}
.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}.toast.warn{background:#9a5b00}

/* ---------- 반응형 ---------- */
@media (max-width:1280px){#app{grid-template-columns:260px minmax(0,1fr) 350px}.tbtn .lbl{display:none}}
@media (max-width:900px){
  #app,#app.drawer-open{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 34px auto;grid-template-areas:"top" "main" "status" "nav"}
  #app>.mpanel{grid-area:main;display:none!important;border:0}
  #app>.mpanel.mact{display:flex!important}
  #mnav{grid-area:nav;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border-top:1px solid var(--line)}
  #mnav button{font-size:13px;min-height:44px;justify-content:center;font-weight:600}
  #mnav button.act{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  #top{flex-wrap:wrap;padding:6px 8px;gap:4px}
  .projname{order:3;max-width:none;width:100%;flex-basis:100%}
  .hgroup{border:0;padding:0}
  .hspace{display:none}
  .savebtn span{display:none}
  .brand b{font-size:1em}
  .chkcols{grid-template-columns:minmax(0,1fr)}
  .codewrap{height:55vh}
  button{min-height:40px}
  .ibtn{width:40px;height:40px}
  #drawerClose{display:none}
  #status{font-size:.85em}
  .hud3 .aux{display:none}
}
/* ---------- 작업지시서 (화면 미리보기 + 인쇄) ---------- */
#printArea{display:none}
.sheet{color:#111;background:#fff;padding:4px;font-size:12.5px;line-height:1.45;border-radius:8px}
:root[data-theme="dark"] dialog .sheet{outline:1px solid var(--line)}
.sheet h1{font-size:18px;margin:0 0 2px}
.sheet h2{font-size:13.5px;margin:14px 0 6px;border-left:4px solid #0b6e79;padding-left:7px}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:8px}
.sh-badge{font-weight:700;border-radius:6px;padding:4px 10px;white-space:nowrap}
.sh-badge.ok{background:#e6f6ee;color:#11905a}.sh-badge.warn{background:#fff3e3;color:#9a5b00}.sh-badge.err{background:#fdecec;color:#d0312d}
table.sh-t{width:100%;border-collapse:collapse;margin:4px 0;font-variant-numeric:tabular-nums}
table.sh-t th,table.sh-t td{border:1px solid #b9c1ca;padding:4px 6px;text-align:left;vertical-align:top}
table.sh-t th{background:#f1f4f7;font-weight:600;white-space:nowrap}
table.sh-t td.box{width:40px}
table.sh-sign td{height:46px;width:22%}
.sh-check li{margin:2px 0}
.sh-foot{color:#555;font-size:11px;margin-top:10px}
@media print{
  #app,dialog,#toasts{display:none!important}
  html,body{overflow:visible;height:auto;background:#fff}
  #printArea{display:block}
  @page{size:A4;margin:12mm}
}

        if (brk < want - 1e-6) notes.push({ level: 'warn', msg: '관통 탭이 소재 아래로 ' + brk + 'mm 만 나갑니다 (권장 ' + want + 'mm). 하부 여유를 늘리면 출구까지 완전한 나사가 됩니다.' });

  // 그룹에 간편 입력 적용 (공정을 다시 구성)

    else if (miss.type === 'center') t = { no, type: 'center', name: '스팟 드릴', dia: 6, angle: 90, mat: 'CARBIDE', flute: 10 };

  // 공정 표시 이름 (예: T05 Ø6.8 고속 펙 드릴 G73)

/* =====================================================================
 * 푸른 AI CAM - [공정 관리: 포켓 간편 입력] process/pocket-wizard.js
 * 역할: 포켓 모양(사각/원형)·크기·깊이·코너 R 만 입력하면 공구·절입·황삭/정삭 공정을 구성한다.

 *   - 공구 자동: 보유 평 엔드밀 중 지름 ≤ 포켓 최소 폭의 75% 인 가장 큰 공구.
 *     사각 포켓에 코너 R 이 있으면 반경 ≤ 코너 R 인 공구를 우선 (모서리 R 그대로 가공)

 * ===================================================================== */
(function (root) {
  'use strict';
  const P = root.PCAM;
  const { toNum, r3, toolMap } = P;
  const AP_FACTOR = { AL6061: 0.5, C3604: 0.5, SS400: 0.3, S45C: 0.3, FC250: 0.3, SCM440: 0.25, SUS304: 0.2 };

  function newPocketSpec(extra) {
    return Object.assign({ kind: 'pocket', shape: 'rect', w: 40, h: 30, cr: 5, dia: 30, depth: 5, rough: true, finish: true, toolNo: 0, stepover: 50, stepdown: 0, allowWall: 0.2, allowFloor: 0.1 }, extra || {});

    if (!(spec.depth > 0)) return { ops, notes: [{ level: 'error', msg: '포켓 깊이를 입력하세요.' }], missing, spec };
    if (!spec.rough && !spec.finish) return { ops, notes: [{ level: 'error', msg: '황삭 또는 정삭을 하나 이상 선택하세요.' }], missing, spec };
    if (spec.finish && !spec.rough) notes.push({ level: 'error', msg: '정삭만으로는 포켓을 팔 수 없습니다. 황삭도 선택하세요.' });
    const sz = toNum(stock && stock.sz, 0);
    if (spec.depth >= sz) notes.push({ level: 'error', msg: '포켓 깊이 ' + spec.depth + 'mm 가 소재 두께 ' + sz + 'mm 이상입니다 (관통 포켓은 지원하지 않음).' });

    // 공구 선택
    const ems = (machine.tools || []).filter(t => t.type === 'endmill').sort((a, b) => b.dia - a.dia || a.no - b.no);
    let tool = null;
    if (spec.toolNo > 0) {

    } else {

      let ap = spec.stepdown > 0 ? spec.stepdown : Math.max(0.1, Math.floor(tool.dia * f * 10) / 10);

      const levels = Math.max(1, Math.ceil((spec.depth - spec.allowFloor) / ap - 1e-9));
      notes.push({ level: 'info', msg: 'T' + tool.no + ' Ø' + tool.dia + ' 엔드밀, 1회 절입 ' + ap + 'mm × ' + levels + '단' + (spec.finish ? ' + 정삭' : '') + (spec.stepdown > 0 ? '' : ' (재질 기준 자동)') });
      if (tool.flute > 0 && spec.depth > tool.flute) notes.push({ level: 'error', msg: 'T' + tool.no + ' 날 길이 ' + tool.flute + 'mm 보다 포켓이 깊습니다 (' + spec.depth + 'mm). 긴 엔드밀이 필요합니다.' });
      if (machine.helical === false) notes.push({ level: 'warn', msg: '장비가 헬리컬 보간을 지원하지 않아 중심 수직 진입합니다 (중심 절삭 엔드밀 필요).' });
    }
    missing.forEach(mm => notes.push({ level: 'error', msg: '포켓에 맞는 평 엔드밀(Ø' + mm.dia + ' 이하)이 장비에 없습니다. [공구 추가]를 누르세요.' }));
    return { ops, notes, missing, spec };
  }

  Object.assign(P, { newPocketSpec, normalizePocketSpec, planPocketSpec });
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ==== post/registry.js ==== */
/* =====================================================================
 * 푸른 AI CAM - [포스트프로세서 등록소] post/registry.js
 * 역할: 제어기별 포스트프로세서 등록·선택. 가공 모듈은 표준 가공 데이터만 만들고
 *       제어기 전용 G코드 변환은 이곳에 등록된 포스트프로세서만 담당한다.
 * 의존: engine/common.js, ops/registry.js
 *
 * ── 포스트프로세서 표준 규격 ──
 *   id          제어기 이름 (장비 설정 machine.control 값, 예 'FANUC')
 *   label       화면 이름          status  'ready' | 'planned'
 *   kinds       지원하는 표준 사이클 종류 배열 (drill, drillDwell, peck, deep, tap, rigidTap …)
 *   generate(project, machine, plan, opts) → { text, hits, lines }
 *       hits = 구멍별 [{ t, x, y, z, r, code }] (독립 검증기와 교차 비교용)
 *   verifier    같은 제어기용 독립 NC 검증기 이름 (PCAM.NCV 등록소)
 * ===================================================================== */
(function (root) {
  'use strict';
  const P = root.PCAM;
  const posts = new Map();
  function register(def) {
    if (!def || !def.id) throw new Error('포스트프로세서 id 가 없습니다.');
    if (posts.has(def.id)) throw new Error('포스트프로세서 중복 등록: ' + def.id);
    const d = Object.assign({ status: 'ready' }, def);
    if (d.status === 'ready' && (typeof d.generate !== 'function' || !Array.isArray(d.kinds))) throw new Error('포스트프로세서 ' + d.id + ': generate/kinds 누락');
    posts.set(d.id, Object.freeze(d));
  }
  const get = id => { const d = posts.get(id); return d && d.status === 'ready' ? d : null; };
  const all = () => [...posts.values()];

  // 공통 진입점: 장비 제어기에 맞는 포스트로 변환. 지원하지 않으면 생성 차단
  function generateNC(project, machine, plan, opts) {
    plan = plan || P.buildPlan(project, machine);
    const empty = why => ({ text: '', hits: [], lines: 0, blocked: why });
    const post = get(machine && machine.control);
    if (!post) return empty('지원하지 않는 제어기입니다: ' + (machine && machine.control));
    if (!plan.steps.length) return empty('가공할 홀/공정이 없습니다.');
    if (plan.steps.some(s => !s.tool || !P.OPS.get(s.type) || !P.OPS.get(s.type).toolTypes.includes(s.tool.type))) return empty('공구가 없거나 공정에 맞지 않는 공구가 있어 G코드를 만들 수 없습니다.');
    const bad = plan.steps.find(s => !post.kinds.includes(s.toolpath.kind));
    if (bad) return empty(post.label + ' 포스트가 지원하지 않는 사이클입니다: ' + bad.toolpath.kind);
    return post.generate(project, machine, plan, opts || {});
  }

  P.POST = Object.freeze({ register, get, all });
  P.generateNC = generateNC;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ==== post/fanuc.js ==== */
/* =====================================================================
 * 푸른 AI CAM - [포스트프로세서: FANUC] post/fanuc.js
 * 역할: 표준 가공 데이터(plan.steps[].toolpath) → FANUC 0i/31i 계열 G코드 텍스트
 *       - 모든 좌표·R·Q 소수점 강제, 주석 ASCII 만

    if (mode === cur) return;

    if (!g.spec && g.ops.length && !confirm('직접 구성한 공정 ' + g.ops.length + '개를 지우고 간편 입력으로 다시 구성할까요?')) return;
    mutate(() => { g.spec = mode === 'pocket' ? C.newPocketSpec() : C.newHoleSpec(mode); if (g.color === KIND[cur].color) g.color = KIND[mode].color; });
  }
  // 자동 구성 결과 (공정 목록·안내·없는 공구 추가)
  function genBlock(u, g, res) {
    const m = machine(), tm = C.toolMap(m);
    let h = '<div class="gen"><b>자동 구성된 공정</b>';
    if (!g.ops.length) h += '<div class="opinfo">공정이 없습니다.</div>';
    g.ops.forEach((op, i) => {
      const t = tm.get(op.toolNo), d = t ? C.opDepth(op, t, P.stock) : null, c = C.opConditions(op, t, P.stock.material, m);
      const col = t ? (TOOL_BAND[t.type] || '#64748b') : '#64748b';
      const extra = op.type === 'pocketRough' ? ' · 절입 ' + op.stepdown + ' · 간격 ' + op.stepover + '% · 여유 ' + op.allowWall + '/' + op.allowFloor : op.type === 'pocketFinish' ? ' · 여유 0' : (op.q && C.OPS.get(op.type).ui.q ? ' · Q' + op.q : '');
      h += '<div class="genrow"><span class="num" style="background:' + col + '">' + (i + 1) + '</span><span class="nm">' + esc(C.opLabel(op, m)) + '</span><small>' + (d ? '끝 Z' + C.fmt(d.z) + ' · ' : '') + 'S' + c.rpm + ' F' + c.feed + extra + '</small></div>';
    });
    res.notes.forEach(n => { h += '<div class="note ' + n.level + '">' + (n.level === 'error' ? '✖ ' : n.level === 'warn' ? '⚠ ' : 'ℹ ') + esc(n.msg) + '</div>'; });
    res.missing.forEach(mm => {
      const lbl = mm.type === 'tap' ? '탭 M' + mm.dia + '×' + mm.pitch : mm.type === 'center' ? '센터 드릴' : mm.type === 'endmill' ? '평 엔드밀 Ø' + mm.dia : '드릴 Ø' + mm.dia;
      h += '<div class="row" style="margin-top:6px">' + u.btn(ico('i-plus') + '공구 추가: ' + lbl, () => {
        let added = null;
        dbChange(() => { added = C.addMissingTool(m, mm); if (m.verified) { m.verified = false; toast('장비 공구가 바뀌어 실가공 검증 승인이 해제되었습니다.', 'warn'); } });
        if (added) toast('T' + added.no + ' 공구를 추가했습니다. 날 길이·재질을 [장비·공구]에서 확인하세요.', 'ok');
      }, 'sm primary') + '</div>';
    });
    h += '</div>';
    h += '<details class="adv" data-sec="adv-' + g.id + '"' + (S.openSec['adv-' + g.id] ? ' open' : '') + '><summary>공정 상세 편집 (고급)</summary><small>여기서 바꾸면 이 가공은 "직접 구성"으로 전환됩니다.</small>' +
      opCards(u, g.ops, fn => { mutate(() => { fn(); g.spec = null; }); toast('직접 구성으로 전환했습니다.', 'warn'); }) + '</details>';
    return h;
  }

      h += '<div class="row">' + u.check(sp.thru, set(v => { sp.thru = v; }), '관통') + u.check(sp.center, set(v => { sp.center = v; }), '센터 드릴') +
        (sp.thru ? '' : u.select(sp.depthMode, [['full', '깊이 = 유효 깊이(직경부)'], ['tip', '깊이 = 드릴 끝']], set(v => { sp.depthMode = v; }))) + '</div>';
    }
    h += '<div class="row">' + u.select(sp.cycle, [['auto', '드릴 사이클: 자동 (깊이/지름 비율)'], ['drill', 'G81 일반'], ['peck', 'G73 고속 펙 (칩 끊기)'], ['deep', 'G83 심공 (완전 후퇴)']], set(v => { sp.cycle = v; })) +
      (sp.thru ? u.fld('관통 여유(mm)', u.num(sp.brk, set(v => { sp.brk = v; }), 'style="width:80px"')) : '') + '</div>';
    h += genBlock(u, g, C.planHoleSpec(sp, m, P.stock)) + '</div>';
    return h;
  }
  // 포켓 간편 입력

    h += sec('pk-' + g.id, '절삭 설정 <small>(경로 간격 · 1회 절입 · 남김 여유)</small>', false) + '<div class="grid2">' +
      u.fld('경로 간격 (공구 지름 %)', u.num(sp.stepover, set(v => { sp.stepover = v; }), 'min="10" max="' + C.STEPOVER_MAX + '"'), '10~' + C.STEPOVER_MAX + '%. 클수록 빠르지만 공구 부하가 큽니다 (권장 40~50%)') +
      u.fld('1회 절입 (mm, 0=자동)', u.num(sp.stepdown, set(v => { sp.stepdown = v; })), '0 이면 재질·공구 지름으로 자동 계산') +
      u.fld('측벽 남김 여유 (mm)', u.num(sp.allowWall, set(v => { sp.allowWall = v; })), '황삭 후 정삭으로 깎을 벽 두께') +
      u.fld('바닥 남김 여유 (mm)', u.num(sp.allowFloor, set(v => { sp.allowFloor = v; })), '황삭 후 정삭으로 깎을 바닥 두께') + '</div>' +
      (sp.stepover > 50 ? '<div class="note warn">⚠ 경로 간격 ' + sp.stepover + '% — 공구 부하가 커집니다. 일반적으로 40~50% 를 권장합니다.</div>' : '') + '</details>';
    h += genBlock(u, g, C.planPocketSpec(sp, m, P.stock)) + '</div>';

  }
  // 직접 구성 (공정 묶음·공정 카드)
  function customForm(u, g) {
    let h = '<div class="card wiz"><div class="row">' + u.select(S.applyB || '', [['', '공정 묶음 선택...']].concat(DB.bundles.map(b => [b.id, b.name])), v => { S.applyB = v; }) +
      u.btn('적용', () => {

      }, 'sm') +

  /* ---------------- 깊이 단면도 (Z값을 한 그림에) ---------------- */
  function depthDiagram(g) {
    const m = machine(), tm = C.toolMap(m), st = P.stock, set = P.settings;
    const ops = g.ops.filter(op => { const t = tm.get(op.toolNo); return t && C.OP_TYPES[op.type] && C.OP_TYPES[op.type].tools.includes(t.type); });
    if (!ops.length) return '';
    const W = 360, H = 250, L = 18, R = 250, top = 22, mid = 104, bot = H - 30;
    const iz = C.toNum(set.initialZ, 50), under = C.toNum(st.under, 0), zb = -st.sz, zu = -(st.sz + under);
    const info = ops.map(op => { const t = tm.get(op.toolNo); return { op, t, d: C.opDepth(op, t, st) }; });
    const rMax = Math.max(1, ...ops.map(o => C.toNum(o.r, 3))) + 2;
    const deep = Math.max(st.sz + under, ...info.map(x => -x.d.z)) * 1.06;
    const dc = Math.min(deep, Math.max(1, ...info.map(x => -x.d.z)) * 1.25); // 가공 깊이 구간을 크게 (아래 나머지는 압축)
    const Y = z => {
      if (z >= 0) { const up = mid - top; if (z <= rMax || iz <= rMax) return mid - Math.min(z, Math.max(iz, rMax)) / rMax * up * 0.5; return mid - (0.5 + 0.5 * Math.min(1, (z - rMax) / Math.max(1e-6, iz - rMax))) * up; }
      const lo = bot - mid, f = dc < deep - 1e-6 ? 0.78 : 1;
      if (-z <= dc) return mid + (-z / dc) * lo * f;
      return mid + (f + (1 - f) * Math.min(1, (-z - dc) / Math.max(1e-6, deep - dc))) * lo;
    };
    const s = []; // svg 조각
    const txt = (x, y, t, st2, anchor) => '<text x="' + x + '" y="' + y + '" font-size="10.5" style="fill:' + (st2 || 'var(--text2)') + '" text-anchor="' + (anchor || 'start') + '">' + esc(t) + '</text>';
    const hline = (z, label, color, dash) => { const y = Y(z).toFixed(1); s.push('<line x1="' + (L - 6) + '" x2="' + (R + 6) + '" y1="' + y + '" y2="' + y + '" style="stroke:' + color + '" stroke-width="1" ' + (dash ? 'stroke-dasharray="4 3"' : '') + '/>'); s.push(txt(R + 10, +y + 3.5, label, color)); };
    // 소재·하부 여유
    s.push('<rect x="' + L + '" y="' + Y(0).toFixed(1) + '" width="' + (R - L) + '" height="' + (Y(zb) - Y(0)).toFixed(1) + '" style="fill:var(--cv-stock);stroke:var(--cv-stock-line)" stroke-width="1"/>');
    if (under > 0) s.push('<rect x="' + L + '" y="' + Y(zb).toFixed(1) + '" width="' + (R - L) + '" height="' + (Y(zu) - Y(zb)).toFixed(1) + '" style="fill:none;stroke:var(--muted)" stroke-dasharray="2 2"/>');
    const isPk = ops.some(o => C.OP_TYPES[o.type].tools.includes('endmill'));
    if (isPk) {
      // 포켓 단면: 황삭 단(절입)과 정삭 바닥
      const rough = info.find(x => x.op.type === 'pocketRough'), fin = info.find(x => x.op.type === 'pocketFinish');
      const depth = C.toNum((fin || rough).op.depth, 0), wallX0 = L + 40, wallX1 = R - 40;
      s.push('<rect x="' + wallX0 + '" y="' + Y(0).toFixed(1) + '" width="' + (wallX1 - wallX0) + '" height="' + (Y(-depth) - Y(0)).toFixed(1) + '" style="fill:var(--surface);stroke:var(--c-pocket)" stroke-width="1.6"/>');
      if (rough) {
        const af = C.toNum(rough.op.allowFloor, 0), ap = Math.max(0.01, C.toNum(rough.op.stepdown, 1)), rd = depth - af;
        const n = Math.max(1, Math.ceil(rd / ap - 1e-9));
        for (let k = 1; k <= n; k++) {
          const z = -rd * k / n, y = Y(z).toFixed(1);
          s.push('<line x1="' + wallX0 + '" x2="' + wallX1 + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--c-pocket)" stroke-dasharray="3 3" opacity=".8"/>');
          if (n <= 6 || k === n) s.push(txt(wallX0 + 4, +y - 2, k + '단 Z' + C.fmt(z), 'var(--c-pocket)'));
        }
      }
      // 공구 (엔드밀 그림)
      const t = (rough || fin).t, tw = Math.min(40, Math.max(10, t.dia * 2.2)), tx = (wallX0 + wallX1) / 2 - tw / 2, ty = Y(-depth);
      s.push('<rect x="' + tx.toFixed(1) + '" y="' + (Y(rMax + 6)).toFixed(1) + '" width="' + tw.toFixed(1) + '" height="' + (ty - Y(rMax + 6)).toFixed(1) + '" rx="1.5" style="fill:var(--c-pocket)" opacity=".25"/>');
      s.push(txt((wallX0 + wallX1) / 2, Y(-depth) + 13, '바닥 Z' + C.fmt(-depth), 'var(--c-pocket)', 'middle'));
      s.push(txt(L + 4, Y(rMax + 6) - 4, 'T' + t.no + ' Ø' + t.dia + ' 엔드밀', 'var(--text2)'));
    } else {
      // 구멍·탭: 공정마다 한 칸
      const n = info.length, colW = (R - L) / n;
      info.forEach((x, i) => {
        const cx = L + colW * (i + 0.5), w = Math.min(colW * 0.5, Math.max(7, x.t.dia * 2.4)), z = x.d.z, y0 = Y(0), yz = Y(z);
        const col = TOOL_BAND[x.t.type] || '#64748b';
        const tipH = (x.t.type === 'drill' || x.t.type === 'center') ? Math.min(14, Math.max(3, w / 2 / Math.tan(((x.t.angle || 118) / 2) * Math.PI / 180))) : 0;
        // 구멍(제거된 부분)
        const yStart = Math.min(y0, yz);
        let path = 'M' + (cx - w / 2).toFixed(1) + ',' + yStart.toFixed(1) + ' L' + (cx - w / 2).toFixed(1) + ',' + (yz - tipH).toFixed(1) + ' L' + cx.toFixed(1) + ',' + yz.toFixed(1) + ' L' + (cx + w / 2).toFixed(1) + ',' + (yz - tipH).toFixed(1) + ' L' + (cx + w / 2).toFixed(1) + ',' + yStart.toFixed(1) + ' Z';
        if (x.t.type === 'center') path = 'M' + (cx - w / 2).toFixed(1) + ',' + y0.toFixed(1) + ' L' + cx.toFixed(1) + ',' + yz.toFixed(1) + ' L' + (cx + w / 2).toFixed(1) + ',' + y0.toFixed(1) + ' Z';
        s.push('<path d="' + path + '" style="fill:var(--surface);stroke:' + col + '" stroke-width="1.6"/>');
        if (x.t.type === 'tap') for (let yy = y0 + 4; yy < yz - 2; yy += 4) s.push('<line x1="' + (cx - w / 2).toFixed(1) + '" x2="' + (cx + w / 2).toFixed(1) + '" y1="' + yy.toFixed(1) + '" y2="' + (yy + 2.5).toFixed(1) + '" style="stroke:' + col + '" stroke-width="1"/>');
        s.push(txt(cx, yz + 13, 'Z' + C.fmt(z), col, 'middle'));
        s.push(txt(cx, top - 6, (i + 1) + '. T' + x.t.no, col, 'middle'));
      });
    }
    // 기준 높이 선
    hline(iz, '초기점 Z' + C.fmt(iz), 'var(--info)', true);
    const rs = [...new Set(ops.map(o => C.toNum(o.r, 3)))].slice(0, 2);
    rs.forEach((r, k) => { hline(r, 'R점 Z' + C.fmt(r), 'var(--warn)', true); if (k && Math.abs(Y(r) - Y(rs[0])) < 11) s[s.length - 1] = s[s.length - 1].replace(/y="([\d.]+)"/, (a, y) => 'y="' + (Math.min(+y, Y(rs[0])) - 8).toFixed(1) + '"'); });
    hline(0, 'Z0 소재 윗면', 'var(--text)', false);
    hline(zb, '소재 밑면 Z' + C.fmt(zb), 'var(--muted)', false);
    if (under > 0) hline(zu, '하부 여유 Z' + C.fmt(zu), 'var(--muted)', true);
    if (iz > rMax) { const y = (Y(rMax) + Y(iz)) / 2; s.push('<path d="M' + (L - 8) + ',' + (y + 3) + ' l6,-6 M' + (L - 8) + ',' + (y + 7) + ' l6,-6" style="stroke:var(--muted)" stroke-width="1"/>'); }
    return '<div class="depth"><div class="dt"><span>깊이 단면도 (Z값)</span><small>단위 mm · 축척 아님</small></div><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="깊이 단면도: 초기점, R점, 소재 윗면, 공구 끝 Z값">' + s.join('') + '</svg></div>';
  }

  /* ---------------- 공정 카드 (프로젝트·묶음 공용) ---------------- */
  function opCards(u, ops, commit, opts) {
    const m = machine(), tm = C.toolMap(m), st = P.stock;
    let h = '';
    ops.forEach((op, i) => {

  /* ---------------- 2D 그래픽 ---------------- */
  const G = window.PCAM_UI.createGraphics(() => ({ P, S, DB, drag, machine }));
  const w2s = G.w2s, s2w = G.s2w, fitView = G.fit, zoom = G.zoom, drawView = G.draw;
  function snap(v) { const gs = DB.settings.grid; return gs.snap ? C.r3(Math.round(v / gs.step) * gs.step) : C.r3(v); }
  function hitHole(px, py) {
    const tm = C.toolMap(machine()); let best = null, bd = Infinity;
    P.groups.forEach(g => {
      const ext = G.extentOf(g, tm);
      g.holes.forEach(h => {
        const [sx, sy] = w2s(h.x, h.y); const dist = Math.hypot(sx - px, sy - py);
        const inside = ext.rect ? (Math.abs(sx - px) <= Math.max(10, ext.w / 2 * S.view.scale) && Math.abs(sy - py) <= Math.max(10, ext.h / 2 * S.view.scale)) : dist <= Math.max(10, ext.d / 2 * S.view.scale);
        if (inside && dist < bd) { bd = dist; best = { g, h }; }

  }
  let drag = null; const ptrs = new Map(); let pinch = null;
  function initCanvas() {
    const c = $('#cv');
    c.addEventListener('contextmenu', e => e.preventDefault());
    c.addEventListener('wheel', e => { e.preventDefault(); const r = c.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    c.addEventListener('pointerdown', e => {
      c.setPointerCapture(e.pointerId);
      const r = c.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      ptrs.set(e.pointerId, { x: px, y: py });
      if (ptrs.size === 2) { const [p1, p2] = [...ptrs.values()]; pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y), mx: (p1.x + p2.x) / 2, my: (p1.y + p2.y) / 2 }; drag = null; return; }
      const w0 = s2w(px, py);
      if (e.button === 1 || e.button === 2) { drag = { kind: 'pan', sx: px, sy: py, cx: S.view.cx, cy: S.view.cy }; return; }
      if (S.mode === 'select') {
        const hit = hitHole(px, py);
        if (hit) { S.sel = { kind: 'group', gid: hit.g.id, hid: hit.h.id }; drag = { kind: 'move', g: hit.g, h: hit.h, sx: px, sy: py, ox: hit.h.x, oy: hit.h.y, moved: false }; renderAll(); return; }
        drag = { kind: 'pan', sx: px, sy: py, cx: S.view.cx, cy: S.view.cy, click: true };
      } else if (S.mode === 'add') drag = { kind: 'add', sx: px, sy: py, w0 };
      else if (S.mode === 'clamp') drag = { kind: 'clamp', sx: px, sy: py, w0: [snap(w0[0]), snap(w0[1])], cur: null };
    });
    c.addEventListener('pointermove', e => {
      const r = c.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      const [wx, wy] = s2w(px, py);
      const hit = !drag ? hitHole(px, py) : null, z = hit ? S.gz.get(hit.g.id) : null;
      $('#cursorPos').textContent = 'X ' + C.fmt(snap(wx)) + '  Y ' + C.fmt(snap(wy)) + (DB.settings.grid.snap ? ' (스냅)' : '') + (hit ? '  ·  ' + hit.g.name + (z !== null && z !== undefined ? ' 바닥 Z' + C.fmt(z) : '') : '');
      if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: px, y: py });
      if (pinch && ptrs.size === 2) {
        const [p1, p2] = [...ptrs.values()]; const d = Math.hypot(p1.x - p2.x, p1.y - p2.y), mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        S.view.cx -= (mx - pinch.mx) / S.view.scale; S.view.cy += (my - pinch.my) / S.view.scale;
        if (pinch.d > 0) zoom(d / pinch.d, mx, my); else drawView();
        pinch = { d, mx, my }; return;
      }
      if (!drag) return;
      if (drag.kind === 'pan') { if (Math.hypot(px - drag.sx, py - drag.sy) > 3) drag.click = false; S.view.cx = drag.cx - (px - drag.sx) / S.view.scale; S.view.cy = drag.cy + (py - drag.sy) / S.view.scale; drawView(); }
      else if (drag.kind === 'move') {
        if (!drag.moved && Math.hypot(px - drag.sx, py - drag.sy) < 5) return;
        drag.moved = true; drag.h.x = snap(wx); drag.h.y = snap(wy); drawView();
      } else if (drag.kind === 'clamp') { drag.cur = [snap(wx), snap(wy)]; drawView(); }
    });
    const end = e => {
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinch = null;
      if (!drag) return;
      const r = c.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      const d = drag; drag = null;
      if (d.kind === 'move' && d.moved) {
        const nx = d.h.x, ny = d.h.y; d.h.x = d.ox; d.h.y = d.oy;
        mutate(() => { d.h.x = nx; d.h.y = ny; });
      } else if (d.kind === 'pan' && d.click && e.type === 'pointerup') { if (S.sel.hid) { S.sel.hid = null; renderAll(); } }
      else if (d.kind === 'add' && e.type === 'pointerup' && Math.hypot(px - d.sx, py - d.sy) < 6) {
        const g = curGroup();
        if (!g) { toast('먼저 왼쪽 목록에서 가공(구멍·탭·포켓)을 선택하거나 추가하세요.', 'err'); return; }
        const total = P.groups.reduce((s, x) => s + x.holes.length, 0);
        if (total >= C.MAX_HOLES) return toast('위치 수 한계 초과', 'err');
        const hid = C.uid('h');
        mutate(() => { g.holes.push({ id: hid, x: snap(d.w0[0]), y: snap(d.w0[1]) }); S.sel.hid = hid; });
      } else if (d.kind === 'clamp' && d.cur) {
        const w = d.cur[0] - d.w0[0], hh = d.cur[1] - d.w0[1];
        if (Math.abs(w) < 1 || Math.abs(hh) < 1) { drawView(); return; }
        mutate(() => { P.clamps.push({ id: C.uid('c'), x: Math.min(d.w0[0], d.cur[0]), y: Math.min(d.w0[1], d.cur[1]), w: Math.abs(w), h: Math.abs(hh), height: 30 }); S.sel = { kind: 'stock', gid: null, hid: null }; });
        toast('클램프를 추가했습니다. 높이는 [소재·고정]에서 수정하세요.', 'ok');
      } else drawView();
    };
    c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
    c.addEventListener('pointerleave', () => { $('#cursorPos').textContent = ''; });
    window.addEventListener('resize', () => { if (S.vmode === '2d') drawView(); });
    if (window.ResizeObserver) new ResizeObserver(() => { if (S.vmode === '2d') drawView(); }).observe($('#canvasWrap'));
  }

  function exportProject() {

  function importProject(txt) {
    const d = JSON.parse(txt);
    if (!d || d.type !== 'pcam-project' || !d.project) throw new Error('푸른 AI CAM 프로젝트 파일이 아닙니다.');
    const p = C.normalizeProject(d.project); p.id = C.uid('p'); p.updatedAt = new Date().toISOString();
    if (p.importWarnings) { p.importWarnings.forEach(w => toast(w, 'err')); delete p.importWarnings; }
    if (d.machine) {
      const m = C.normalizeMachine(d.machine); m.verified = false; m.verifiedBy = ''; m.verifiedAt = '';
      const ex = DB.machines.find(x => x.id === m.id);
      if (!ex) { DB.machines.push(m); toast('장비 "' + m.name + '" 를 추가했습니다 (실가공 검증 상태는 관리자 재승인 필요).', 'warn'); }
      p.machineId = m.id;
    }
    if (!DB.machines.find(x => x.id === p.machineId)) p.machineId = DB.machines[0].id;
    DB.projects[p.id] = p; switchProject(p.id); closeDlg(); toast('프로젝트를 가져왔습니다.', 'ok');
  }

    backupAll();
    const nd = { schema: 1, machines: d.db.machines.map(C.normalizeMachine), bundles: (d.db.bundles || []).map(b => { const n = C.normalizeBundle(b); if (n.importWarnings) { toast(n.importWarnings[0], 'err'); delete n.importWarnings; } return n; }), projects: {}, settings: Object.assign({}, DB.settings, d.db.settings || {}) };
    nd.machines.forEach(m => { m.verified = false; });
    Object.values(d.db.projects || {}).forEach(p => { const n = C.normalizeProject(p); if (n.importWarnings) { toast('[' + n.name + '] ' + n.importWarnings[0], 'err'); delete n.importWarnings; } nd.projects[n.id] = n; });
    if (!nd.machines.length) throw new Error('장비 정보가 없습니다.');

  }

  function shareURL() { return /^https?:$/.test(location.protocol) ? location.href.split('#')[0].split('?')[0] : null; }
  function openShare() {
    const url = shareURL();
    openDlg('앱 공유', u => {
      if (!url) return '<p>현재 <b>로컬 파일</b>(' + esc(location.protocol) + ')로 실행 중이라 다른 기기에서 접속할 수 있는 공유 주소가 없습니다.</p><p><small>웹 서버(예: GitHub Pages, Firebase Hosting)에 배포한 뒤 그 주소에서 열면 링크·QR코드 공유가 가능합니다. 지금은 HTML 파일 자체를 USB·메일로 전달하세요.</small></p>' +
        '<p><small>공유에는 앱 주소만 포함되며 프로젝트 데이터·인증 정보는 포함되지 않습니다.</small></p>';
      return '<div class="qrbox"><canvas id="qrCanvas" aria-label="앱 주소 QR코드"></canvas><input type="text" readonly value="' + esc(url) + '" style="width:100%"><div class="row">' +
        u.btn('링크 복사', () => copyText(url), 'sm') + (navigator.share ? u.btn('공유하기', () => navigator.share({ title: '푸른 AI CAM', url }).catch(() => { }), 'sm') : '') +
        u.btn('QR 이미지 저장', () => { const c = $('#qrCanvas'); c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'pureun-ai-cam-qr.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }); }, 'sm') + '</div>' +
        '<small>앱 주소만 공유됩니다. 프로젝트 데이터·인증 정보는 포함되지 않습니다.</small></div>';
    }, null, { second: !!$('#dlg').open });
    if (url) drawQR($('#qrCanvas'), url);
  }
  function drawQR(c, text) {
    try {
      const q = window.qrcode(0, 'M'); q.addData(text, 'Byte'); q.make();
      const n = q.getModuleCount(), cell = 8, quiet = 4, size = (n + quiet * 2) * cell;
      c.width = size; c.height = size;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.fillStyle = '#000';
      for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
    } catch (e) { toast('QR코드 생성 실패: ' + e.message, 'err'); }
  }

  // 관리자 해시 도구는 저장 모듈(ui/storage.js)
  function openAdminAuth() {
    if (!window.crypto || !crypto.subtle) return toast('이 브라우저 환경에서는 안전한 암호화 기능을 쓸 수 없어 관리자 설정을 열 수 없습니다 (https 또는 로컬 파일로 실행).', 'err');
    const rec = adminRec();
    if (!rec) {
      openDlg('관리자 비밀번호 등록', u => '<p>이 기기(브라우저)에서 처음 관리자 설정을 엽니다. 관리자 비밀번호를 등록하세요.</p><div class="grid2">' +
        '<label class="fld"><span>새 비밀번호 (8자 이상, 영문+숫자)</span><input type="password" id="apw1" autocomplete="new-password"></label>' +
        '<label class="fld"><span>비밀번호 확인</span><input type="password" id="apw2" autocomplete="new-password"></label></div>' +
        '<p><small>비밀번호 원문은 저장하지 않고 PBKDF2-SHA256 해시만 이 브라우저에 저장합니다. 기기별로 따로 등록되며 동기화되지 않습니다. 브라우저 저장소는 PC 사용자 계정 보안에 의존합니다.</small></p>',
        u => u.btn('등록', async () => {
          const a = $('#apw1').value, b = $('#apw2').value;
          if (!pwRule(a)) return toast('8자 이상, 영문과 숫자를 포함하세요.', 'err');
          if (a !== b) return toast('비밀번호 확인이 일치하지 않습니다.', 'err');
          const salt = crypto.getRandomValues(new Uint8Array(16)), iter = 150000;
          const hash = await pbkdf2(a, salt, iter);
          lsSet(ADMIN_KEY, JSON.stringify({ v: 1, salt: b64(salt), iter, hash, fails: 0, lockUntil: 0 }));
          toast('관리자 비밀번호를 등록했습니다.', 'ok'); startAdmin();
        }, 'primary'), { second: true });
      return;
    }
    const lockLeft = () => Math.max(0, (rec.lockUntil || 0) - Date.now());
    openDlg('관리자 인증', u => (lockLeft() ? '<p style="color:var(--err)">인증 실패가 반복되어 잠겨 있습니다. ' + Math.ceil(lockLeft() / 60000) + '분 후 다시 시도하세요.</p>' : '') +
      '<label class="fld"><span>관리자 비밀번호</span><input type="password" id="apw" autocomplete="current-password"></label>' +
      '<p><small>5회 실패 시 5분간 잠깁니다. ' + (rec.fails ? '현재 실패 ' + rec.fails + '회' : '') + '</small></p>' +
      '<details><summary><small>비밀번호를 잊으셨나요?</small></summary><p><small>재설정하면 관리자 비밀번호가 삭제되고, 보안을 위해 모든 장비의 실가공 검증 승인도 해제됩니다.</small></p>' +
      u.btn('비밀번호 재설정', () => {
        if (prompt('재설정하려면 "재설정" 을 입력하세요.') !== '재설정') return;
        try { localStorage.removeItem(ADMIN_KEY); } catch (e) { /* 저장소 접근 불가 */ }
        DB.machines.forEach(m => { m.verified = false; m.verifiedBy = ''; m.verifiedAt = ''; });
        saveDB(true); closeDlg($('#dlg2')); renderAll(); toast('관리자 비밀번호를 재설정했습니다. 다시 등록하세요.', 'warn');
      }, 'sm danger') + '</details>',
      u => u.btn('확인', async () => {
        const r = adminRec(); if (!r) return;
        if (Math.max(0, (r.lockUntil || 0) - Date.now())) return toast('잠금 중입니다.', 'err');
        const pw = $('#apw').value; if (!pw) return;
        const hash = await pbkdf2(pw, unb64(r.salt), r.iter);
        if (safeEq(hash, r.hash)) { r.fails = 0; r.lockUntil = 0; lsSet(ADMIN_KEY, JSON.stringify(r)); startAdmin(); }
        else {
          r.fails = (r.fails || 0) + 1;
          if (r.fails >= 5) { r.fails = 0; r.lockUntil = Date.now() + 5 * 60000; toast('5회 실패 — 5분간 잠깁니다.', 'err'); }
          else toast('비밀번호가 틀렸습니다 (' + r.fails + '/5).', 'err');
          lsSet(ADMIN_KEY, JSON.stringify(r)); beep(); openAdminAuth();
        }
      }, 'primary'), { second: true });
    setTimeout(() => { const i = $('#apw'); if (i) { i.focus(); i.onkeydown = e => { if (e.key === 'Enter') $('#dlg2 .dfoot button').click(); }; } }, 50);
  }
  let adminTimer = null;
  function startAdmin() {
    S.admin.authed = true; S.admin.until = Date.now() + 10 * 60000;
    clearTimeout(adminTimer); adminTimer = setTimeout(endAdmin, 10 * 60000);
    openAdminPanel();
  }
  function endAdmin() { S.admin.authed = false; clearTimeout(adminTimer); const d = $('#dlg2'); if (d.open && d.dataset.admin === '1') d.close(); }
  function openAdminPanel() {
    if (!S.admin.authed || Date.now() > S.admin.until) { S.admin.authed = false; return openAdminAuth(); }
    const d = openDlg('관리자 설정', u => {
      let h = '<div class="adm"><b>⚠ 관리자 모드</b> <small>창을 닫거나 10분이 지나면 자동 종료되며 다시 인증해야 합니다.</small></div>';
      h += '<h3>장비 실가공 검증 승인</h3><p><small>실제 머시닝센터에서 아래 시험을 마친 장비만 승인하세요. 승인 전 NC 파일은 "검증용(TEST)"으로 표시됩니다. 장비 설정을 바꾸면 승인이 자동 해제됩니다.</small></p>';
      DB.machines.forEach(m => {
        h += '<div class="sect"><b>' + esc(m.name) + ' ' + (m.verified ? '<span class="pill ok">승인됨 · ' + esc(m.verifiedBy) + ' · ' + esc(m.verifiedAt) + '</span>' : '<span class="pill warn">미승인</span>') + '</b>';
        if (m.verified) h += u.btn('승인 해제', () => { m.verified = false; m.verifiedBy = ''; m.verifiedAt = ''; saveDB(true); renderAll(); openAdminPanel(); }, 'sm danger');
        else {
          const id = m.id.replace(/[^a-z0-9]/gi, '');
          h += '<label class="chk"><input type="checkbox" id="vc1' + id + '">Z를 띄운 드라이런(공회전)으로 경로 확인</label><label class="chk"><input type="checkbox" id="vc2' + id + '">싱글 블록 운전으로 공구 교환·보정·사이클 확인</label><label class="chk"><input type="checkbox" id="vc3' + id + '">시편 실가공 후 위치·깊이·나사 게이지 확인</label>' +
            '<div class="grid2"><label class="fld"><span>확인자</span><input type="text" id="vby' + id + '" maxlength="40"></label><label class="fld"><span>메모 (사용 파라미터 등)</span><input type="text" id="vno' + id + '" maxlength="200"></label></div>' +
            u.btn('검증 완료 승인', () => {
              if (![1, 2, 3].every(k => $('#vc' + k + id).checked)) return toast('세 가지 실장비 시험을 모두 확인하세요.', 'err');
              const by = $('#vby' + id).value.trim(); if (!by) return toast('확인자를 입력하세요.', 'err');
              m.verified = true; m.verifiedBy = by; m.verifiedAt = new Date().toISOString().slice(0, 10); m.verifyNote = $('#vno' + id).value.trim();
              saveDB(true); renderAll(); openAdminPanel(); toast('실가공 검증을 승인했습니다.', 'ok');
            }, 'sm primary');
        }
        h += '</div>';
      });
      h += '<h3>관리자 비밀번호 변경</h3><div class="grid3"><label class="fld"><span>현재 비밀번호</span><input type="password" id="cpw0" autocomplete="current-password"></label><label class="fld"><span>새 비밀번호</span><input type="password" id="cpw1" autocomplete="new-password"></label><label class="fld"><span>새 비밀번호 확인</span><input type="password" id="cpw2" autocomplete="new-password"></label></div>' +
        u.btn('비밀번호 변경', async () => {
          const r = adminRec(), a = $('#cpw1').value;
          if (!safeEq(await pbkdf2($('#cpw0').value, unb64(r.salt), r.iter), r.hash)) return toast('현재 비밀번호가 틀렸습니다.', 'err');
          if (!pwRule(a)) return toast('8자 이상, 영문과 숫자를 포함하세요.', 'err');
          if (a !== $('#cpw2').value) return toast('새 비밀번호 확인이 일치하지 않습니다.', 'err');
          const salt = crypto.getRandomValues(new Uint8Array(16));
          lsSet(ADMIN_KEY, JSON.stringify({ v: 1, salt: b64(salt), iter: r.iter, hash: await pbkdf2(a, salt, r.iter), fails: 0, lockUntil: 0 }));
          ['cpw0', 'cpw1', 'cpw2'].forEach(k => { $('#' + k).value = ''; }); toast('비밀번호를 변경했습니다.', 'ok');
        }, 'sm');
      h += '<h3>데이터 초기화</h3><p><small>이 브라우저의 모든 프로젝트·장비·공정 묶음을 지우고 초기 상태로 되돌립니다 (자동 백업 후 진행).</small></p>' +
        u.btn('전체 데이터 초기화', () => {
          if (prompt('초기화하려면 "초기화" 를 입력하세요.') !== '초기화') return;
          backupAll(); DB = freshDB(); P = DB.projects[DB.currentProjectId]; S.undo = []; S.redo = []; S.view.fitted = false; S.nc.edited = false; S.sim.sig = '';
          saveDB(true); renderAll(); endAdmin(); toast('초기화했습니다.', 'warn');
        }, 'sm danger');
      return h;
    }, null, { second: true, onClose: () => { S.admin.authed = false; clearTimeout(adminTimer); } });
    d.dataset.admin = '1';
  }

  /* ---------------- 시작 ---------------- */
  function init() {
    DB = loadDB();
    P = DB.projects[DB.currentProjectId] || Object.values(DB.projects)[0];
    if (!P) { const n = C.newProject(DB.machines[0]); DB.projects[n.id] = n; P = n; }
    if (!DB.machines.find(m => m.id === P.machineId)) P.machineId = DB.machines[0].id;
    regenSpecs(); // 저장된 간편 입력 그룹을 현재 장비·소재 기준으로 다시 구성
    applyTheme();
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); drawView(); });
    $('#projName').addEventListener('change', e => mutate(() => { P.name = e.target.value.slice(0, 60) || '프로젝트'; }));
    $('#btnProjects').onclick = openProjects;
    $('#btnTools').onclick = openTools;
    $('#btnSheet').onclick = openSheet;
    $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
    $('#btnDownload').onclick = doDownload;
    $('#btnShare').onclick = openShare;
    $('#btnSettings').onclick = openSettings;
    $('#tab2d').onclick = () => setVMode('2d'); $('#tab3d').onclick = () => setVMode('3d');
    $('#drawerClose').onclick = () => { S.drawer = false; renderAll(); };
    document.querySelectorAll('#bottomTabs button[data-tab]').forEach(b => b.onclick = () => { S.bottomTab = b.dataset.tab; renderAll(); });
    document.querySelectorAll('#mnav button').forEach(b => b.onclick = () => { S.mpanel = b.dataset.m; renderAll(); });
    document.addEventListener('keydown', e => {
      const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select';
      const dlg = document.querySelector('dialog[open]');
      if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
      else if (!typing && !dlg && (e.key === 'Delete' || e.key === 'Backspace') && S.sel.hid && S.vmode === '2d') { e.preventDefault(); deleteSelectedHole(); }
      else if (!typing && !dlg && e.key === ' ' && S.vmode === '3d' && V3 && V3.ok && !(e.target.getAttribute && e.target.getAttribute('role') === 'button') && e.target.tagName !== 'BUTTON') { e.preventDefault(); if (V3.isPlaying()) V3.pause(); else V3.play(); }
      else if (!typing && e.key === 'Escape' && S.mode !== 'select') setMode('select');
      else if (e.altKey && e.shiftKey && e.key.toLowerCase() === 'a') { e.preventDefault(); openAdminAuth(); } // 접근성용 대체 관리자 진입 (비밀번호 필요)
    });
    window.addEventListener('beforeunload', () => saveDB(true));
    window.addEventListener('afterprint', () => { const pa = $('#printArea'); if (pa) pa.innerHTML = ''; });
    initCanvas();
    // 처음 실행(가공 없음)에는 소재부터, 가공이 있으면 첫 가공을 선택
    if (P.groups.length) S.sel = { kind: 'group', gid: P.groups[0].id, hid: null };
    renderAll();
    requestAnimationFrame(() => { S.view.fitted = false; drawView(); });
  }
  window.addEventListener('DOMContentLoaded', init);
  window.__PCAM_UI__ = { get P() { return P; }, get S() { return S; }, get DB() { return DB; }, get V3() { return V3; }, renderAll, downloadState, setVMode };
})();

</script>
</body>
</html>
