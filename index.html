<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#29865c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 통역">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<title>여행 통역</title>
<style>
/* ── 테마 (설정에서 바꿈) ── */
#app{--accent:#29865c;--accent2:#2378c9;--bg:#fff;--surface:#f4f8f6;--text:#16221c;--muted:#6e7c76;--line:#e6ece9;--ko:#e4f4e9;--fg:#f0f2f3;--blue:#2479b9;--radius:16px;--font:system-ui,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif}

*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.modal-content,.drawer,.transcript,.select-pop{overflow-x:hidden!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:#f2f5f4;position:fixed;inset:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #177bc0;outline-offset:3px}
svg{display:block}
#app{--app-h:100dvh;width:100%;height:var(--app-h);max-width:750px;margin:auto;background:var(--bg);color:var(--text);font-family:var(--font);position:relative;overflow:hidden}

/* ── 첫 화면 ── */
.home{height:var(--app-h);overflow:hidden;touch-action:manipulation;position:relative;background:#456 center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(46px + env(safe-area-inset-bottom))}
.home:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003,transparent 40%,#0006)}
.lang{position:relative;border:1px solid #fff9;background:#fffffff0;color:#1e3038;border-radius:40px;padding:13px 26px;font-size:19px;box-shadow:0 4px 16px #0004}
.home-tip{position:relative;color:#fff;font-size:15px;margin-top:16px;text-shadow:0 1px 4px #000c}
.select-pop{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#fff;color:#1e3038;border-radius:18px;padding:8px;width:min(92vw,340px);max-height:58vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:2px;z-index:15;box-shadow:0 8px 40px #0005}
.select-pop button{display:block;width:100%;border:0;background:white;padding:12px 10px;text-align:left;border-radius:10px;font-size:15px}.select-pop button.on{background:#e3f4e9;font-weight:700}

/* ── 본 화면 ── */
.screen{display:flex;flex-direction:column;height:var(--app-h);overflow:hidden;--acc:var(--accent)}
.screen.listen{--acc:var(--accent2)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;padding:calc(12px + env(safe-area-inset-top)) 10px 10px;border-bottom:1px solid var(--line)}
.top-left{justify-self:start}.top-right{justify-self:end;display:flex}
.home-btn{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 9px;font-size:14px;font-weight:650;white-space:nowrap}
.mode{font-size:21px;font-weight:780;color:var(--acc);border:none;background:none;padding:4px;white-space:nowrap}
.icon-btn{border:0;background:none;padding:7px;color:var(--muted);border-radius:10px}
.transcript{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 18px}
.hint{color:var(--muted);text-align:center;margin:13vh 0 0;font-size:15px;line-height:1.8;white-space:pre-line}
.hint svg{margin:0 auto 10px}
.pair{margin:0 0 15px;display:flex;flex-direction:column;gap:6px}
.bubble{position:relative;line-height:1.55;max-width:94%;border-radius:var(--radius);padding:12px 15px 13px;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer}
.bubble.has-edit{padding-right:36px;padding-bottom:17px}
.bubble.ko{background:var(--ko);align-self:flex-start}
.bubble.foreign{background:var(--fg);align-self:flex-end}
.bubble.fail{background:#fff0e0;color:#8a4b12}
.bubble .edit{position:absolute;right:4px;bottom:2px;min-width:30px;min-height:30px;font-size:15px;color:var(--muted);border:0;background:transparent}
.listen-row{padding:12px 14px;background:var(--surface);border-radius:var(--radius);margin-bottom:9px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer}
.listen-row .orig{display:block;font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}

/* 아래 한 줄 */
.bar{border-top:1px solid var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}
.bar-left{justify-self:start;display:flex;gap:5px}.bar-right{justify-self:end;display:flex;gap:4px}
.sbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:48px;height:50px;padding:3px 5px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--text)}
.sbtn span{font-size:10px;line-height:1.1;white-space:nowrap;color:var(--muted)}
.sbtn.off{opacity:.55}
.sbtn.wide span{font-size:11px}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.mic{position:relative;border:0;border-radius:50%;width:62px;height:62px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#a9b6b2,#8d9a96);box-shadow:0 4px 12px #0002}
.mic.on{background:var(--acc)}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:.5;animation:ring 1.8s ease-out infinite}
.mic.on::after{animation-delay:.9s}
.mic.talk{background:#d9962f}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.55);opacity:0}}
.mic-state{font-size:10px;color:var(--muted);white-space:nowrap}
.font-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:50px;font-weight:800;font-size:16px;line-height:1;padding:0}
.font-btn small{display:block;font-size:8px;font-weight:500;margin-top:3px;color:var(--muted)}

/* 서랍 */
.side-tab{position:absolute;top:45%;right:0;transform:translateY(-50%);width:24px;height:84px;border-radius:9px 0 0 9px;border:0;background:var(--accent);color:#fff;font-size:14px;z-index:3}
.drawer{position:absolute;top:0;bottom:0;right:0;width:min(84vw,320px);z-index:6;box-shadow:-7px 0 25px #0003;background:var(--bg);padding:calc(22px + env(safe-area-inset-top)) 16px 18px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.overlay{position:absolute;inset:0;background:#0005;z-index:5}
.drawer-close{float:right;background:none;border:0;font-size:24px}
.drawer h3{margin:18px 0 6px}
.drawer-tip{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.drawer-item{width:100%;padding:13px 12px;text-align:left;background:var(--surface);border:0;border-radius:12px;margin-bottom:8px;font-weight:700}
.drawer-item small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-item.strong{background:var(--accent);color:#fff}.drawer-item.strong small{color:#ffffffd0}

/* 창 */
.modal{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
.modal-head{display:flex;align-items:center;gap:8px}
.modal-head h2{font-size:19px;margin:0 0 0 auto}
.plain{border:0;background:none;padding:9px;font-size:18px}
.ai-badge{display:none;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff;background:#7b4ed6;border-radius:14px;padding:5px 10px}
.ai-badge.show{display:flex}
.ai-badge i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.modal-content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding-top:16px}
.enlarge-body{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.sub-text{font-size:17px;color:var(--muted);margin-bottom:14px}
.big-text{font-size:clamp(27px,8vw,52px);font-weight:700;line-height:1.5;overflow-wrap:anywhere;transition:transform .2s;align-self:flex-start}
.big-text.rotated{transform:rotate(180deg)}
.tap-tip{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
.action{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.primary{background:var(--blue);color:#fff;border:0}
.danger{background:#c0392b;color:#fff;border:0}
.editor{width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:18px;line-height:1.5;background:var(--bg)}
.voice-row{display:flex;gap:8px;margin:10px 0 4px}
.voice-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.voice-btn.on{background:#c0392b}
.voice-btn small{font-weight:400;font-size:12px;opacity:.9}
.go-btn{flex:0 0 auto;padding:14px 18px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-size:16px;font-weight:700}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row-btns .action{flex:1;min-width:0;white-space:nowrap;font-size:14px;padding:11px 8px}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.tiny{font-size:12px;color:var(--muted);line-height:1.6}
.notice{position:absolute;left:14px;right:14px;bottom:120px;z-index:30;background:#243f37;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 3px 15px #0003;font-size:13px}
.field{display:block;margin:12px 0 5px;font-size:13px;color:var(--muted)}
.text-field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sec{border-top:1px solid var(--line);padding:14px 0 6px;margin-top:10px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.sec h4{margin:0 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.dl-row{display:flex;align-items:center;gap:8px;padding:7px 0}
.dl-row b{min-width:70px}.dl-row span{flex:1;font-size:12px;color:var(--muted)}
.dl-row .action{padding:8px 12px;font-size:14px}
.phrase{width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:11px 13px;margin-bottom:7px}
.phrase small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.confirm-back{position:absolute;inset:0;background:#0006;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-box{background:var(--bg);border-radius:18px;padding:22px 20px 16px;width:min(100%,330px);box-shadow:0 10px 40px #0005}
.confirm-box p{white-space:pre-line;margin:0 0 18px;font-size:17px;line-height:1.5}
.confirm-box .actions{justify-content:flex-end}
.offline-banner{padding:6px 15px;background:#ffe7c6;color:#6b4300;font-size:12px;text-align:center}
/* ── v5 추가 ── */
.bubble .ctrls{display:flex;justify-content:flex-end;gap:2px;margin:4px -8px -6px 0}
.bubble .ctrl,.listen-row .ctrl{border:0;background:transparent;color:var(--muted);opacity:.65;min-width:32px;min-height:30px;border-radius:8px;font-size:14px;font-weight:700;display:grid;place-items:center}
.bubble .ctrl.on,.listen-row .ctrl.on{opacity:1;color:var(--accent)}
.rate-m{display:none;align-items:center;gap:3px;margin-right:2px;opacity:.8;pointer-events:none}
.rate-m.on{display:inline-flex}
.rate-m i{width:5px;height:18px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.rate-m i:after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h,40%);background:var(--accent);transition:height .4s}
.rate-m b{font-size:10px;font-weight:500;color:var(--muted);opacity:.75}
.listen-row{position:relative}.listen-row.preview{color:var(--muted)}.listen-row.preview:after{content:'미리 보기 · 문장이 끝나면 바뀜';display:block;font-size:11px;opacity:.7;margin-top:4px}.listen-row .rate-m{position:absolute;right:8px;top:8px}
.bubble .ctrl.edit-ctrl,.listen-row .ctrl.edit-ctrl{font-size:15px;font-weight:400}
.pron-note{font-size:.85em;opacity:.7}
.faint{opacity:.65;font-weight:400;font-size:11px}
.photo-prev{display:block;max-width:100%;max-height:200px;margin:12px auto 0;border-radius:12px}
.photo-out{margin-top:12px;padding:14px;border-radius:14px;background:var(--surface)}
.photo-tr{font-size:20px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.photo-orig{margin-top:10px;font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.pron{display:block;font-size:.72em;color:var(--muted);margin-top:4px;line-height:1.45}
.bubble .fixing{display:block;font-size:12px;color:#7b4ed6;opacity:.75;margin-top:4px}
.live{align-self:flex-start;max-width:94%;border:1.5px dashed var(--line);border-radius:var(--radius);padding:10px 14px;color:var(--muted);font-size:17px;margin-bottom:12px;white-space:pre-wrap}
.live b{display:block;font-size:11px;font-weight:600;margin-bottom:3px}
.pending{border:1.5px solid var(--accent);background:var(--surface);border-radius:var(--radius);padding:12px 14px 10px;margin-bottom:12px;position:relative;overflow:hidden}
.pending .ptext{font-size:18px;line-height:1.5;white-space:pre-wrap}
.pending .prow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.pending .prow button{border:0;border-radius:12px;padding:9px 14px;font-weight:700}
.pending .pfix{background:var(--bg);border:1px solid var(--line)!important}
.pending .psend{background:var(--blue);color:#fff}
.pending .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.sbtn,.font-btn{transition:transform .1s,background .2s}
.sbtn:active,.font-btn:active{transform:scale(.92)}
.sbtn.m-ko{background:#e2f4e8;border-color:#bfe2cb}
.sbtn.m-foreign{background:#e1edfc;border-color:#c0d6f3}
.sbtn.m-auto{background:#eee5fb;border-color:#d6c6f2}
.sbtn.m-both{background:#fff2d9;border-color:#f1d9a6}
.flash{animation:flash .45s ease-out}
@keyframes flash{0%{background:#cfe9ff;transform:scale(.92)}100%{transform:scale(1)}}
.mic.on.l-ko{background:#d9f1e2;color:#1d7a4b}
.mic.on.l-foreign{background:#dceafc;color:#1f5fa8}
.mic.on.l-ko::before,.mic.on.l-ko::after{border-color:#2f9e63}
.mic.on.l-foreign::before,.mic.on.l-foreign::after{border-color:#2f78c9}
.ai-state{font-size:9px;color:var(--muted);opacity:.7;white-space:nowrap}
.ai-state.on{color:#7b4ed6;opacity:.85}
.ai-state{display:block;font-size:14px!important;font-weight:600;text-align:center;padding:7px 6px;border:1px solid currentColor;border-radius:10px;overflow:hidden;text-overflow:ellipsis}
.ai-state.tier{cursor:pointer;opacity:.95}
.listen-row.now{box-shadow:0 0 0 2px var(--accent2,#7b4ed6) inset;font-weight:600}
.listen-row .l-orig{color:#3f9d6e;opacity:.9;line-height:1.4;margin-bottom:4px}
.listen-row .l-tr{line-height:1.5}
.listen-row.waiting{border:1px dashed rgba(63,157,110,.45)}
.listen-row .l-wait{display:inline-block;font-size:11px;font-weight:700;color:#3f9d6e;background:rgba(63,157,110,.12);border-radius:6px;padding:1px 6px;margin-bottom:4px}
.listen-row.live{color:var(--muted);font-style:italic;background:transparent;border:1px dashed var(--line)}
.big-ov{position:absolute;inset:0;background:var(--bg);z-index:60;overflow:hidden}
.big-stage{position:absolute;top:50%;left:50%;display:flex;flex-direction:column;padding:10px 16px 8px;transition:transform .25s}
.big-bar{display:flex;align-items:flex-start;gap:8px}
.big-sub{flex:1;min-width:0;font-size:14px;color:#3f9d6e;line-height:1.4;max-height:3em;overflow:hidden}
.big-btns{display:flex;gap:6px;flex:0 0 auto}
.big-b{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
.big-b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.big-mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.big-main{font-weight:700;line-height:1.35;text-align:center;overflow-wrap:anywhere;max-width:100%}
.big-pron{font-size:20px;color:var(--muted);margin-top:10px;text-align:center}
.big-tip{font-size:11px;color:var(--muted);text-align:center;opacity:.7}
.bubble .ctrl.star,.listen-row .ctrl.star{font-size:17px;color:#d4a017;opacity:.9}.bubble .ctrl.star.on,.listen-row .ctrl.star.on{color:#e0a800;opacity:1}
.listen-row .ctrls{display:flex;justify-content:flex-end;align-items:center;gap:2px;margin-top:6px}
.listen-row .pron{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.share-pick{display:flex;flex-direction:column;gap:8px}
.gl-row.editing{background:rgba(63,157,110,.10)}
.gl-groups{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.gg-big{text-align:left;font-weight:700;border:0;background:var(--surface);border-radius:10px;padding:9px 12px}
.gg-big.on{background:rgba(63,157,110,.16);color:#2a7a52}
.gg-subs{display:flex;flex-wrap:wrap;gap:6px;padding-left:10px}
.gg-sub{border:1px solid var(--line);background:transparent;border-radius:16px;padding:5px 10px;font-size:13px}
.gg-sub.on{border-color:#3f9d6e;color:#2a7a52;background:rgba(63,157,110,.08)}
.saved-row{display:flex;gap:6px;align-items:stretch}
.saved-row .drawer-item.saved{flex:1;min-width:0;font-weight:600}
.saved-row .drawer-item.saved b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-x{border:0;background:transparent;color:var(--muted);padding:0 6px;margin-bottom:8px}
.by-tag{display:block;font-size:11px;opacity:.65;margin-top:4px}
.ctrl.retr{font-size:12px;padding:2px 8px;width:auto}
.head-nav{display:flex;gap:4px}
.ai-result{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface);font-size:14px;line-height:1.5;white-space:pre-wrap}
.ai-result.bad{background:#fff0e0;color:#8a4b12}
.drawer-item.add{background:transparent;border:1.5px dashed var(--line);color:var(--accent);text-align:center}
.phrase.mine{border-left:4px solid var(--accent)}
.danger-link{border:0;background:none;color:#c0392b;font-weight:600;padding:10px 4px}
/* v7 */
.home-flag{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:150px;opacity:.9;filter:drop-shadow(0 8px 20px #0005)}
.recent{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 2px;margin-bottom:10px;max-width:min(92vw,380px);font-size:11px;color:#ffffffaa;text-shadow:0 1px 3px #000c}
.recent span{margin-right:2px}
.recent button{border:0;background:transparent;color:#ffffffc0;font-size:11px;padding:3px 6px;text-decoration:none}
.home-tip2{position:relative;color:#ffffffc8;font-size:12px;margin-top:6px;text-shadow:0 1px 3px #000c}
.long-tip{font-style:normal;font-weight:400;font-size:11px;color:var(--muted);opacity:.8}
.drawer-item.strong .long-tip{color:#fff}
/* v31: 말하기 버튼 */
.talk-row{display:flex;gap:8px;padding:10px 12px 4px;border-top:1px solid var(--line)}
.talk{--c:#2f9e63;--soft:#e2f4e8;position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:66px;border:2px solid var(--c);background:var(--soft);color:var(--c);border-radius:16px;font-size:18px;font-weight:800;transition:transform .1s}
.talk:active{transform:scale(.95)}
.talk small{font-size:11px;font-weight:500;opacity:.85;white-space:nowrap}
.talk.k-foreign{--c:#2f78c9;--soft:#e1edfc}
.talk.k-auto{--c:#7b4ed6;--soft:#eee5fb}
.talk.k-auto.on.as-ko{--c:#2f9e63}
.talk.k-auto.on.as-foreign{--c:#2f78c9}
.talk small.dim{opacity:.6;font-size:10px}
.screen.listen .talk-row{justify-content:center}
.screen.listen .talk{flex:0 1 150px}
.note-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.note-grid .drawer-item{margin:0;padding:12px 8px;text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-grid .drawer-item.empty{opacity:.55}
.talk.on{background:var(--c);color:#fff}
.talk.on::after{content:"";position:absolute;inset:-2px;border-radius:16px;border:2px solid var(--c);animation:ring 1.8s ease-out infinite}
.talk.on.speaking{background:#d9962f;border-color:#d9962f}
.bar.slim{border-top:0;padding-top:4px}
.bar-mid{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0;padding:0 2px}.bar-mid .mic-state{text-align:center}
.set-tabs{position:sticky;top:-16px;z-index:2;display:flex;gap:4px;background:var(--bg);padding:6px 0 10px;margin-top:-6px}
.set-tabs button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:9px 4px;font-size:14px;font-weight:600}
.set-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sw-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px}
.sw-row span{flex:1}.sw-row input{width:22px;height:22px}
/* v10 */
.home-scene{position:absolute;inset:0;width:100%;height:100%}
.lang-back{position:absolute;inset:0;z-index:30;background:#0005}
.select-pop.in-app{bottom:auto;top:12%;max-height:70vh}
.pop-title{grid-column:1/-1;font-weight:700;padding:8px 10px 4px;font-size:15px}
.gl-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.gl-row span{flex:1}.gl-row .action{padding:6px 10px;font-size:13px}
.dl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dl-card{border:1px solid var(--line);border-radius:10px;padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.dl-card b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dl-card span{font-size:10px;color:var(--muted)}
.dl-card.got{background:var(--ko)}
.dl-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:600;width:100%}
/* v8 */
.dim-btn{position:absolute;right:12px;bottom:calc(166px + env(safe-area-inset-bottom));z-index:4;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:20px;padding:8px 13px;font-size:13px;font-weight:650;box-shadow:0 3px 10px #0002}
.dim-overlay{position:absolute;inset:0;z-index:60;background:#000;touch-action:manipulation}
.dim-box{position:absolute;color:#6b6b6b;animation:drift 40s ease-in-out infinite alternate}
.dim-text{font-size:15px}
.dim-sub{font-size:12px;color:#4a4a4a;margin-top:4px}
.dim-back{margin-top:12px;border:1px solid #333;background:#111;color:#8a8a8a;border-radius:16px;padding:8px 14px;font-size:13px}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(30px,60px)}100%{transform:translate(-10px,120px)}}
/* v6 */
.install-band{position:relative;margin-top:14px;display:flex;align-items:center;gap:4px;background:#ffffffee;border-radius:30px;padding:4px 4px 4px 6px;box-shadow:0 4px 14px #0004}
.install-go{border:0;background:#29865c;color:#fff;border-radius:24px;padding:9px 16px;font-size:15px;font-weight:700}
.install-x{border:0;background:transparent;color:#667;font-size:16px;min-width:32px;min-height:32px}
.ios-banner{display:flex;align-items:flex-start;gap:6px;padding:8px 8px 8px 14px;background:#fff6db;color:#5b4500;font-size:12px;line-height:1.5}
.ios-banner span{flex:1}
.top-right .icon-btn{padding:5px}
.key-link{display:inline-block;text-decoration:none;margin:2px 0 4px;background:#fff7e6;border-color:#f0d9a8;color:#7a5200}
.plan-box{font-size:13px;line-height:1.7;background:var(--surface);border-radius:12px;padding:12px 14px}
.version{text-align:center;font-size:12px;color:var(--muted);padding:22px 0 8px;user-select:none}
.admin-box{border:1.5px dashed var(--accent);border-radius:14px;padding:12px 14px;margin:6px 0 14px}
.admin-box h4{margin:0 0 6px}
.admin-link{display:block;text-align:center;text-decoration:none;margin:8px 0}
.help-text{margin:0;font-size:15px;line-height:1.7;white-space:pre-line}
@media(min-width:750px){body{position:static;overflow:auto}#app{--app-h:min(100dvh,920px);min-height:650px;margin:2vh auto;border-radius:22px;box-shadow:0 0 22px #0001}.home,.screen{min-height:650px}}
/* v33: 첫 화면 버전·언어 표시 */
.home-corner{position:absolute;top:max(8px, env(safe-area-inset-top));font-size:13px;font-weight:500;color:#fff;opacity:.7;z-index:20;pointer-events:none;text-shadow:0 1px 3px #000a}
.top-right .snd.off{color:#c0392b}
.top-right{gap:0}
@media(max-width:400px){.top{padding-left:8px;padding-right:6px;gap:2px}.top-right .icon-btn{padding:4px 3px}.top-right .icon-btn svg{width:20px;height:20px}.mode{font-size:18px;padding:4px 2px}.home-btn{padding:7px 7px;font-size:13px}.bar{gap:4px;padding-left:6px;padding-right:6px}.sbtn{min-width:44px;padding:3px 3px}}
.sbtn.wipe{color:var(--muted)}

function groupWords(){const out=[];GLOSS_GROUPS.forEach(g=>g.subs.forEach(sb=>{if(!glossOn.includes(sb.id))return;sb.w.forEach(x=>{const [w,h]=x.split('|');out.push({word:w,heard:h||'',out:''})})}));return out}
function allGloss(){return glossary.concat(groupWords())}
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function fixHeard(text){let t=text;for(const g of allGloss()){for(const w of (g.heard||'').split(',').map(x=>x.trim()).filter(Boolean)){t=t.replace(new RegExp(esc(w),'g'),g.word)}}return t}
function protectWords(text){let t=text;for(const g of glossary){if(g.out&&g.word)t=t.replace(new RegExp(esc(g.word),'g'),g.out)}return t}
function glossaryHint(){const w=allGloss().filter(g=>g.word).slice(0,160).map(g=>g.out?`${g.word}(${g.out})`:g.word);return w.length?`\n다음 단어는 반드시 이렇게 쓰세요: ${w.join(', ')}`:''}

/* ── 소리 ── */
function voiceFor(code,tone){
  const list=speechSynthesis.getVoices?.()||[];const want=state.voices[code];
  if(want&&!(state.autoVoice&&tone)){const v=list.find(v=>v.name===want);if(v)return v}
  const loc=localeOf(code).toLowerCase(),pre=loc.slice(0,2);
  const norm=v=>v.lang.toLowerCase().replace('_','-');
  const m=list.filter(v=>norm(v).startsWith(pre)&&(code!=='zh-TW'||/tw|hk|hant/.test(norm(v)))) ;
  const pool=m.length?m:list.filter(v=>norm(v).startsWith(pre));
  if(tone&&state.autoVoice){
    const high=tone.hz>=175;
    const pattern=high?/female|woman|여성|여자|soyeon|yuna|heami|zira|siri/i:/male|man|남성|남자|injoon|junwoo|david|daniel/i;
    const matching=pool.find(v=>pattern.test(v.name));if(matching)return matching;
  }
  return pool.find(v=>norm(v)===loc&&v.localService)||pool.find(v=>norm(v)===loc)||pool.find(v=>v.localService)||pool[0]||null;
}
let curAudio=null;
function stopSpeech(){outGen++;outQ.forEach(x=>{if(x.entry)x.entry.queued=false});outQ.length=0;if(outCur){outCur.speakingNow=false;outCur=null}outBusy=false;try{speechSynthesis.cancel()}catch{}try{curAudio?.pause()}catch{}curAudio=null;if(state.speaking)speakEnd=Date.now();state.speaking=false;speakQ=0;setReading(null)}

let reading=null;
function setReading(text,rate){reading=text?{text,rate:rate||1}:null;updateMeters()}
function paintMeter(m,on){m.classList.toggle('on',!!on);if(!on)return;const r=reading.rate;m.style.setProperty('--h',Math.round(Math.min(100,Math.max(20,(r-0.6)/1.0*100)))+'%');m.querySelector('b').textContent=r.toFixed(1)+'배'}
function meter(parent,text){const m=node('span','rate-m','',parent);m.innerHTML='<i></i><b></b>';m.dataset.for=text;paintMeter(m,reading&&reading.text===text);return m}
function updateMeters(){document.querySelectorAll('.rate-m').forEach(m=>paintMeter(m,reading&&reading.text===m.dataset.for))}
function speak(text,code,tone){
  // V38: 직접 누른 듣기 — 지금 소리를 멈추고 바로 읽음. 마이크는 끄지 않음
  stopSpeech();const q=outReserve(code,null);q.force=true;outReady(q,text,tone);

/* V38: 말한 순서대로 소리 내기 + 뒤에 밀리면 자동으로 빠르게
   밀린 문장 한두 개 1.5배 · 세 개 1.7배 · 네 개 이상 2배 (밀린 게 없으면 설정 속도) */
const outQ=[];let outBusy=false,outGen=0,outCur=null,speakEnd=0;
function outReserve(code,entry){const q={code,entry,text:null,ready:false};if(entry)entry.queued=true;outQ.push(q);return q}
function outReady(q,text,tone){if(!q)return;q.text=text||'';q.tone=tone;q.ready=true;pumpOut()}
function outRate(len){const w=outQ.length;const c=w>=4?2:w===3?1.7:w>=1?1.5:0;
  // L1: 문장이 길면 밀린 게 없어도 빠르게 (50자↑ 1.5 · 80자↑ 1.7 · 120자↑ 2배), 둘 중 빠른 쪽
  const l=len>120?2:len>80?1.7:len>50?1.5:0;return Math.min(2,Math.max(state.rate,c,l))}
function splitSentences(t){const out=[];String(t).split(/(?<=[.!?。！？])\s*/).forEach(p=>{p=p.trim();if(!p)return;if(p.length>200)out.push(...splitText(p,200));else out.push(p)});return out.length?out:[String(t)]}
function pumpOut(){
  if(outBusy)return;
  while(outQ.length&&outQ[0].ready&&(!outQ[0].text||(state.speech===3&&!outQ[0].force))){const x=outQ.shift();if(x.entry)x.entry.queued=false}
  if(!outQ.length||!outQ[0].ready)return;
  if(!('speechSynthesis'in window)){outQ.length=0;return}
  const q=outQ.shift(),gen=outGen,parts=splitSentences(q.text),v=voiceFor(q.code,q.tone);
  outBusy=true;state.speaking=true;outCur=q.entry;if(q.entry){q.entry.queued=false;q.entry.speakingNow=true}
  if(state.mode==='listen'&&q.entry)render();else updateMic();
  let i=0;
  const next=()=>{
    if(gen!==outGen)return;
    if(i>=parts.length){outBusy=false;state.speaking=false;speakEnd=Date.now();if(outCur){outCur.speakingNow=false;outCur=null}setReading(null);if(state.mode==='listen'&&q.entry)render();else updateMic();pumpOut();return}
    // 문장 하나 읽을 때마다 뒤에 밀린 수를 다시 보고 속도를 정함
    const u=new SpeechSynthesisUtterance(parts[i++]);u.lang=localeOf(q.code);u.rate=outRate(q.text.length);if(v)u.voice=v;
    let fired=false,wd=null;const fin=()=>{if(fired)return;fired=true;clearTimeout(wd);next()};
    // L2: 휴대폰 목소리가 끝 신호를 안 보내고 멈추는 경우 대비 — 예상 시간이 지나면 다음 문장으로
    wd=setTimeout(fin,4000+parts[i-1].length*220/u.rate);
    u.onstart=()=>setReading(q.text,u.rate);u.onend=fin;u.onerror=fin;
    speechSynthesis.speak(u);
  };
  next();
}

const LATIN_LANGS=['en','vi','id','ms','tl','fr','de','es','it','pt','pl','cs','tr'];
const KO_SCRIPT={ja:'가타카나 (예: 안녕하세요 → アンニョンハセヨ)',['zh-CN']:'소리가 비슷한 간체 한자 음역 (예: 안녕하세요 → 安宁哈塞哟, 감사합니다 → 康桑哈密达)',['zh-TW']:'소리가 비슷한 번체 한자 음역 (예: 안녕하세요 → 安寧哈塞喲, 감사합니다 → 康桑哈密達)',th:'태국 문자',hi:'데바나가리 문자',mn:'몽골어 키릴 문자',ru:'러시아어 키릴 문자',ar:'아랍 문자'};

function romanizeKo(text){
  const I=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
  const V=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
  const F=['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
  const FL=['','g','kk','g','n','n','n','d','r','g','m','b','s','t','p','h','m','b','s','s','ss','ng','j','ch','k','t','p',''];
  const ch=[...text];let out='';
  for(let i=0;i<ch.length;i++){
    const c=ch[i].charCodeAt(0)-0xAC00;
    if(c<0||c>11171){out+=ch[i];continue}
    const ini=Math.floor(c/588),med=Math.floor(c%588/28),fin=c%28;
    out+=I[ini]+V[med];
    const nx=(ch[i+1]||'').charCodeAt(0)-0xAC00;
    const nextVowel=nx>=0&&nx<=11171&&Math.floor(nx/588)===11;
    const nasal=nx>=0&&nx<=11171&&[2,6].includes(Math.floor(nx/588));
    if(fin)out+=nextVowel&&fin!==21?FL[fin]:nasal?({k:'ng',t:'n',p:'m'}[F[fin]]||F[fin]):F[fin];
  }
  return out.replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
}
function drawKoPron(parent,text,lang){
  const line=node('span','pron','',parent);
  const key='ko2>'+lang+'|'+text;
  if(LATIN_LANGS.includes(lang)){line.textContent='🗣 '+romanizeKo(text);return}
  if(pronCache[key]){line.textContent='🗣 '+pronCache[key];return}
  const roman=romanizeKo(text);
  if(!aiReady()||!navigator.onLine){line.textContent='🗣 '+roman;return}
  line.textContent='🗣 '+nameOf(lang)+' 글자로 만드는 중…';
  const prompt=`${nameOf(lang)} 사용자가 아래 한국어 문장을 소리 내어 따라 읽을 수 있게, 한국어 발음을 ${KO_SCRIPT[lang]||nameOf(lang)+' 문자'}로 옮겨 적으세요.\n규칙: 뜻을 번역하지 말 것, 한글을 한 글자도 쓰지 말 것, 문장을 한 번만 적을 것, 설명·따옴표 없이 결과 한 줄만.\n\n한국어: ${text}`;
  const ask=()=>withTimeout(aiAsk(prompt,{max:Math.min(400,text.length*6+40)}),12000);
  if(!pronInflight[key])pronInflight[key]=ask().then(r=>badPron(r,text,false)?ask():r).then(r=>{if(!badPron(r,text,false)){pronCache[key]=r;store('pron_cache',JSON.stringify(pronCache))}}).catch(()=>{}).finally(()=>{delete pronInflight[key]});

const pronInflight={};
/* L3: AI 발음 답 검사 — 반복되거나 너무 길거나 글자 종류가 틀리면 버림 */
const HANGUL=/[가-힣ㄱ-ㅎㅏ-ㅣ]/;

  const ask=()=>withTimeout(aiAsk(prompt,{max:Math.min(400,text.length*6+40)}),12000);

}

/* L3: 크게 보기 — 처음엔 가로로 크게, 위 버튼으로 세로·가로 바꾸기와 180° 회전. 원문은 위쪽 구석에 작게 */
function drawBig(root,data){
  if(data.land===undefined)data.land=true;
  const ov=node('section','big-ov','',root);
  const st=node('div','big-stage','',ov);
  const W=innerWidth,H=innerHeight;
  st.style.width=(data.land?H:W)+'px';st.style.height=(data.land?W:H)+'px';
  st.style.transform=`translate(-50%,-50%) rotate(${(data.land?90:0)+(data.rotated?180:0)}deg)`;
  const bar=node('div','big-bar','',st);
  if(data.sub)node('div','big-sub',data.sub,bar).dir='auto';else node('div','big-sub','',bar);
  const bt=node('div','big-btns','',bar);
  button(data.land?'세로':'가로','big-b',e=>{e.stopPropagation();data.land=!data.land;render()},bt);
  button('180°','big-b',e=>{e.stopPropagation();data.rotated=!data.rotated;render()},bt);
  const other=data.other||(data.code==='ko'?active().code:'ko');
  if(data.code!=='ko'?aiReady():other!=='ko')button(data.code==='ko'?scriptMark(other):'가','big-b'+(data.showP?' on':''),e=>{e.stopPropagation();data.showP=!data.showP;render()},bt);
  iconButton(ICON.speaker(18),'big-b','듣기',e=>{e.stopPropagation();speak(data.text,data.code)},bt);
  button('✕','big-b',e=>{e.stopPropagation();closeLayer()},bt);
  const mid=node('div','big-mid','',st);
  const big=node('div','big-main',data.text,mid);big.dir='auto';
  if(data.showP){const pw=node('div','big-pron','',mid);if(data.code!=='ko')drawPron(pw,data.text,data.code);else drawKoPron(pw,data.text,other)}
  node('div','big-tip','빈 곳을 누르면 돌아갑니다',st);
  ov.onclick=e=>{if(!e.target.closest('button,.big-main,.big-pron'))closeLayer()};
  // 글씨를 칸에 꽉 차게 (넘치면 줄임)
  requestAnimationFrame(()=>{let f=Math.min(120,(data.land?W:H)/3.2);big.style.fontSize=f+'px';while(f>22&&(big.scrollHeight>mid.clientHeight*0.92||big.scrollWidth>mid.clientWidth)){f-=4;big.style.fontSize=f+'px'}});
}
function voiceRow(parent,area,getCode,onChange,goLabel,onGo){
  const row=node('div','voice-row','',parent);
  const b=button('','voice-btn',()=>dictateTo(area,getCode(),b,onChange),row);
  setVoiceLabel(b,false);
  if(goLabel)button(goLabel,'go-btn',onGo,row);
  return b;
}
function setVoiceLabel(b,on){b.classList.toggle('on',!!on);b.innerHTML=on?'■ 끝내기 <small>듣는 중…</small>':ICON.mic(20)+'말로 입력하기'}

function drawModal(root){
  const data=state.modal;
  if(data.type==='enlarge')return drawBig(root,data);
  const modal=node('section','modal','',root);
  const header=node('div','modal-head','',modal);
  if(data.type==='settings'){
    const nav=node('div','head-nav','',header);
    const hb=button('','home-btn',goHome,nav);hb.innerHTML=ICON.home(15)+'<span>처음으로</span>';
    button('‹ 뒤로','home-btn',closeLayer,nav);
  }else button('‹ 뒤로','plain',()=>{if(data.type==='fixPending'){stopDictation();state.modal=null;if(state.pending)state.pending.wait=0;render()}else closeLayer()},header);
  const badge=node('span','ai-badge','',header);badge.id='aiBadge';badge.innerHTML='<i></i><b>AI 교정 중</b>';
  const titles={help:'사용법',enlarge:'문장 확대',edit:data.field==='translation'?'번역 문장 고치기':'문장 고치기',photo:'사진 통역',note:data.index<0?'문장 추가':'자주 쓰는 문장',text:'글로 통역하기',settings:'설정',phrases:'여행 문구 · '+active().name,addPhrase:'여행 문구 추가',fixPending:'고친 뒤 보내기'};
  node('h2','',titles[data.type],header);
  const body=node('div','modal-content','',modal),actions=node('div','actions','',modal);


  if(data.type==='edit'||data.type==='fixPending'){
    const item=data.type==='edit'?(data.list==='listening'?state.listening:state.items)[data.index]:null;
    const trField=!!item&&data.field==='translation';
    const code=item?(trField?item.target:item.source):data.source;
    if(item)node('p','tiny',trField?`번역된 ${nameOf(code)} 문장을 직접 고칩니다. (원래 문장: ${item.original})`:`${nameOf(code)} 문장을 고치면 ${nameOf(item.target)}로 다시 번역합니다.`,body);
    const area=node('textarea','editor','',body);area.value=item?(trField?(item.failed?'':item.translation):item.original):data.text;area.placeholder='말로 입력하거나 직접 쓰세요';
    const save=async()=>{
      const val=area.value.trim();if(!val)return notify('문장을 입력하세요');
      stopDictation();
      if(!item){clearPending();state.modal=null;render();consume(val,code,{fromMic:true,skipAI:true});return}
      if(trField){item.translation=val;item.failed=false;state.modal=null;render();return}
      item.original=val;item.translation='번역 중…';item.failed=false;state.modal=null;render();
      try{item.translation=await translate(val,item.source,item.target)}catch(e){item.translation='번역 실패 · '+e.message;item.failed=true}
      render();
    };
    voiceRow(body,area,()=>code,null,item?'저장':'보내기',save);
    const rb=node('div','row-btns','',body);
    button('글 모두 지우기','action',()=>{area.value='';area.focus()},rb);
    node('p','tiny',`${nameOf(code)}로 말하면 글자로 들어갑니다. 말이 끝나고 잠시 조용하면 자동으로 멈춥니다.`+(aiReady()?' 멈추면 AI가 문장을 다듬어 줍니다.':''),body);
  }

  if(data.type==='note'){
    const isNew=data.index<0;const n=isNew?{t:'',x:''}:notes[data.index];
    node('label','field','제목 (서랍에 보이는 이름)',body);
    const title=node('input','text-field','',body);title.value=n.t;title.placeholder='예: 알레르기, 가족 소개';
    node('label','field','문장',body);
    const area=node('textarea','editor','',body);area.value=n.x;area.placeholder='말로 입력하거나 직접 쓰세요';
    const save=()=>{
      const t=title.value.trim()||area.value.trim().slice(0,10),x=area.value.trim();
      if(!x)return notify('문장을 입력하세요');
      stopDictation();
      if(isNew)notes.push({t,x});else notes[data.index]={t,x};
      saveNotes();precache([x]);
      state.modal=null;state.side=true;render();
    };
    voiceRow(body,area,()=>'ko',null,'저장',save);
    node('p','tiny','저장하면 받아 둔 언어로 미리 번역해 휴대폰에 저장합니다. 인터넷이 끊겨도 쓸 수 있어요.'+(aiReady()?' 말로 입력하면 AI가 문장을 다듬어 줍니다.':''),body);
    if(!isNew)button('🗑 이 문장 지우기','danger-link',()=>askConfirm(`"${n.t}" 문장을 지울까요?`,'지우기',()=>{notes.splice(data.index,1);saveNotes();state.modal=null;state.side=true;render()}),body);
  }

  if(data.type==='text'){
    const listen=state.mode==='listen';
    const sel=node('select','text-field','',body);
    [['ko','한국어 → '+active().name],['foreign',active().name+' → 한국어']].forEach(([v,t])=>{const o=node('option','',t,sel);o.value=v});
    if(listen)sel.value='foreign';
    const inp=node('textarea','editor','',body);inp.placeholder='번역할 글을 붙여넣거나, 말하거나, 직접 쓰세요.\n길이 제한 없이 문장 단위로 나눠 번역합니다.';inp.style.marginTop='10px';
    const cnt=node('div','count','0자',body);
    const upd=()=>cnt.textContent=inp.value.length.toLocaleString()+'자';inp.oninput=upd;
    const go=async()=>{
      const t=inp.value.trim();if(!t)return notify('글을 입력하세요');
      stopDictation();state.modal=null;render();
      await consume(t,sel.value==='ko'?'ko':active().code,{fromText:true});
    };
    voiceRow(body,inp,()=>sel.value==='ko'?'ko':active().code,upd,'번역하기',go);
    sel.onchange=()=>stopDictation();
    const rb=node('div','row-btns','',body);
    button('📋 붙여넣기','action',async()=>{
      try{const t=await navigator.clipboard.readText();if(!t)return notify('복사된 글이 없습니다.');inp.value=inp.value?inp.value+'\n'+t:t;upd()}
      catch{notify('붙여넣기가 막혀 있습니다. 글 칸을 길게 눌러 "붙여넣기"를 골라 주세요.');inp.focus()}
    },rb);
    const file=node('input','',null,body);file.type='file';file.accept='.txt,.md,.csv,.srt,text/plain';file.hidden=true;
    file.onchange=async()=>{const f=file.files[0];if(!f)return;try{const t=await f.text();inp.value=inp.value?inp.value+'\n'+t:t;upd();notify(`"${f.name}" 내용을 넣었습니다.`)}catch{notify('파일을 읽지 못했습니다.')}file.value=''};
    button('📁 파일 올리기','action',()=>file.click(),rb);
    button('지우기','action',()=>{inp.value='';upd()},rb);
    const pr=node('div','row-btns','',body);pr.style.marginTop='8px';
    const pbt=button('📷 사진으로 통역','action',()=>openPhoto(),pr);node('small','faint',' Gemini 키 필요',pbt);
    node('p','tiny','번역이 끝나면 바로 소리로 읽어 줍니다 (아래 소리 버튼이 "끔"이면 읽지 않음). 말이 끝나고 잠시 조용하면 마이크가 자동으로 멈춥니다.'+(aiReady()?' 멈추면 AI가 문장을 다듬어 줍니다.':' (설정에 AI 키를 넣으면 말한 문장을 AI가 다듬어 줍니다.)')+' 파일은 글자 파일(.txt)을 올릴 수 있습니다.',body);
  }

  if(data.type==='photo')drawPhoto(body,data,actions);
  if(data.type==='phrases')drawPhrases(body,data);
  if(data.type==='addPhrase')drawAddPhrase(body,data);
  if(data.type==='settings')drawSettings(body);
}

/* ── 사진 통역 (Gemini) ── */
function shrinkImage(file,max=1600){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85))};im.onerror=()=>{URL.revokeObjectURL(url);rej(Error('사진을 열지 못했습니다'))};im.src=url})}
async function photoTranslate(dataUrl,target){
  const key=load('ai_key').trim();
  const prompt=`이 사진에 있는 글자를 모두 읽고 ${nameOf(target)}로 번역해 주세요. 메뉴판이나 목록이면 항목마다 줄을 나눠 주세요. 아래 JSON 형식으로만 답하세요.\n{"original":"사진 속 글자 그대로","translation":"${nameOf(target)} 번역"}\n글자가 없으면 {"original":"","translation":""}`;
  const body={contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}},{text:prompt}]}],generationConfig:{temperature:0.2,response_mime_type:'application/json'}};
  const models=[...new Set([gemModel(),'gemini-flash-latest',GEM_FALLBACK].filter(Boolean))];
  let lastErr;
  for(const m of models){
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(45000)});
      const j=await res.json();if(!res.ok)throw Error(j.error?.message||res.status);
      const out=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim();
      try{const o=JSON.parse(out.replace(/^```(json)?|```$/g,''));return{original:String(o.original||'').trim(),translation:String(o.translation||'').trim()}}
      catch{return{original:'',translation:out}}
    }catch(e){lastErr=e}
  }
  throw lastErr||Error('사진 통역 실패');
}
function drawPhoto(body,data,actions){
  const ready=provider()==='gemini';
  node('p','tiny faint',ready?'Gemini 키로 사진 속 글자를 읽어 번역합니다. 사진은 번역에만 쓰고 저장하지 않습니다.':'사진 통역은 Gemini 키가 필요해요. 설정 → AI 키에 Gemini 키(AIza…)를 넣어 주세요.',body);
  const sel=node('select','text-field','',body);
  [['ko','사진 속 글 → 한국어'],['foreign','사진 속 한국어 → '+active().name]].forEach(([v,t])=>{const o=node('option','',t,sel);o.value=v});
  sel.value=data.dir;sel.onchange=()=>{data.dir=sel.value};
  const rb=node('div','row-btns','',body);rb.style.marginTop='10px';
  const pick=capture=>{
    if(!ready)return notify('사진 통역은 Gemini 키가 필요해요. 설정에서 넣어 주세요.');
    if(!navigator.onLine)return notify('사진 통역은 인터넷이 필요합니다.');
    const f=document.createElement('input');f.type='file';f.accept='image/*';if(capture)f.setAttribute('capture','environment');
    f.onchange=async()=>{
      const file=f.files[0];if(!file)return;
      try{
        data.img=await shrinkImage(file);data.result=null;data.busy=true;data.err='';render();
        const target=data.dir==='ko'?'ko':active().code;
        data.result={...await photoTranslate(data.img,target),target};
      }catch(e){data.err=e.message}
      data.busy=false;if(state.modal===data)render();
    };
    f.click();
  };
  button('📷 사진 찍기','action primary',()=>pick(true),rb);
  button('🖼 사진 고르기','action',()=>pick(false),rb);
  if(data.img){const im=node('img','photo-prev','',body);im.src=data.img;im.alt='고른 사진'}
  if(data.busy)node('p','tiny','🔎 사진 속 글자를 읽고 번역하는 중… (10~20초)',body);
  if(data.err)node('p','tiny','번역 실패 · '+data.err,body);
  const r=data.result;
  if(r){
    if(!r.translation){node('p','tiny','사진에서 글자를 찾지 못했습니다. 글자가 크게 나오도록 다시 찍어 보세요.',body);return}
    const box=node('div','photo-out','',body);
    node('div','photo-tr',r.translation,box).dir='auto';
    if(r.original)node('div','photo-orig',r.original,box).dir='auto';
    button('🔊 듣기','action primary',()=>speak(r.translation,r.target),actions);
    button('크게 보기','action',()=>openEnlarge(r.translation,r.target,r.original),actions);
    button('복사','action',async()=>{try{await navigator.clipboard.writeText(r.translation+(r.original?'\n\n'+r.original:''));notify('복사했습니다.')}catch{notify('복사가 막혀 있습니다.')}},actions);
  }
}
function drawPhrases(body,data){
  const code=active().code;const off=offlineFor(code);const all=allPhrases();
  if(!off?.full){
    node('p','tiny',`${active().name} 여행 문구를 아직 받지 않았습니다. 인터넷이 될 때 받아 두면, 외국에서 인터넷이 끊겨도 글씨와 소리로 보여 줄 수 있어요.`,body);
    const b=button(`📥 ${active().name} 문구 받기`,'action primary',()=>downloadPhrases(code,b,()=>render()),body);
  }
  const chips=node('div','chips','',body);chips.style.margin='10px 0 12px';
  if(!all[data.cat])data.cat=Object.keys(all)[0];
  Object.keys(all).forEach(c=>button(c,'chip'+(data.cat===c?' on':''),()=>{data.cat=c;render()},chips));
  button('＋ 문구 추가하기','drawer-item add',()=>{state.modal={type:'addPhrase',cat:data.cat};render()},body);
  all[data.cat].forEach(ko=>{
    const tr=off?.items[ko];const mine=isCustom(data.cat,ko);
    let timer,long=false;
    const p=button(ko,'phrase'+(mine?' mine':''),()=>{if(long){long=false;return}if(tr)openEnlarge(tr,code,ko);else if(navigator.onLine){translate(ko,'ko',code).then(t=>{cacheTr(code,ko,t);openEnlarge(t,code,ko)}).catch(e=>notify(e.message))}else notify('먼저 문구를 받아 주세요.')},body);
    node('small','',tr||'(아직 받지 않음)',p);
    if(mine){
      p.addEventListener('pointerdown',()=>{long=false;timer=setTimeout(()=>{long=true;askConfirm(`"${ko}" 문구를 지울까요?`,'지우기',()=>{customPhrases[data.cat]=customPhrases[data.cat].filter(x=>x!==ko);if(!customPhrases[data.cat].length)delete customPhrases[data.cat];saveCustom();render()})},600)});
      ['pointerup','pointerleave','pointercancel'].forEach(ev=>p.addEventListener(ev,()=>clearTimeout(timer)));
      p.oncontextmenu=e=>e.preventDefault();
    }
  });
  node('p','tiny','직접 추가한 문구는 왼쪽에 색 줄이 있고, 길게 누르면 지울 수 있어요. 업데이트를 받아도 지워지지 않습니다.',body);
}
function drawAddPhrase(body,data){
  const cats=Object.keys(allPhrases());
  node('label','field','분류',body);
  const sel=node('select','text-field','',body);
  cats.forEach(c=>{const o=node('option','',c,sel);o.value=c});
  const on=node('option','','＋ 새 분류 만들기',sel);on.value='__new';
  sel.value=data.cat||cats[0];
  const newCat=node('input','text-field','',body);newCat.placeholder='새 분류 이름 (예: 병원, 회의)';newCat.style.marginTop='8px';newCat.hidden=true;
  sel.onchange=()=>{newCat.hidden=sel.value!=='__new';if(!newCat.hidden)newCat.focus()};
  node('label','field','문구 (한국어)',body);
  const area=node('textarea','editor','',body);area.placeholder='말로 입력하거나 직접 쓰세요';area.style.minHeight='100px';
  const save=()=>{
    const ko=area.value.trim();if(!ko)return notify('문구를 입력하세요');
    const cat=sel.value==='__new'?newCat.value.trim():sel.value;if(!cat)return notify('분류 이름을 입력하세요');
    stopDictation();
    customPhrases[cat]=[...(customPhrases[cat]||[]).filter(x=>x!==ko),ko];saveCustom();precache([ko]);
    state.modal={type:'phrases',cat};render();notify('추가했습니다.');
  };
  voiceRow(body,area,()=>'ko',null,'저장',save);
  node('p','tiny','저장하면 받아 둔 언어로 바로 번역해 휴대폰에 저장합니다.',body);
}

function drawSettings(body){
  const tab=state.setTab||'basic';
  const tabs=node('div','set-tabs','',body);
  [['basic','기본'],['words','단어장'],['phrases','여행 문구'],['adv','고급']].forEach(([k,t])=>button(t,k===tab?'on':'',()=>{state.setTab=k;render();const c=$('.modal-content');if(c)c.scrollTop=0},tabs));
  let sec;
  if(tab==='basic'){
  sec=node('div','sec','',body);node('h4','','자주 쓰는 기능',sec);
  const fbtns=node('div','row-btns','',sec);
  if(installEvent&&!isInstalled())button('📲 휴대폰에 앱 설치','action primary',installApp,fbtns);
  button('🔗 앱 주소 복사·보내기','action primary',()=>shareAppLink(),fbtns);

/* ── 말로 입력 (끊지 않고 쭉, 6초 조용하면 멈춤) ── */
let dict=null;
function mergeResults(results){
  let out='';
  for(let i=0;i<results.length;i++){
    const t=results[i][0].transcript.trim();if(!t)continue;
    if(!out)out=t;
    else if(t.startsWith(out))out=t;
    else if(out.endsWith(t)||out.includes(t))continue;
    else out+=' '+t;
  }
  return out;
}
function stopDictation(){const d=dict;if(!d)return;d.cancel=true;dict=null;clearTimeout(d.timer);try{d.r.abort()}catch{}}
function dictateTo(area,code,btn,onChange){
  if(dict){if(dict.btn===btn){requestStop();return}stopDictation()}
  if(!SR)return notify('이 브라우저는 음성 입력을 지원하지 않습니다. 크롬이나 삼성 인터넷을 써 주세요.');
  pauseRecognizer();stopSpeech();
  const r=new SR();r.lang=localeOf(code);r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  const base=area.value.trim();
  const d=dict={r,area,code,btn,onChange,timer:null,heard:false};
  const arm=ms=>{clearTimeout(d.timer);d.timer=setTimeout(()=>{if(dict===d)requestStop()},ms)};
  r.onresult=e=>{if(dict!==d)return;d.heard=true;const t=mergeResults(e.results);area.value=base?base+' '+t:t;onChange?.();arm(6000)};
  r.onerror=e=>{if(e.error==='not-allowed'){notify('마이크 권한이 허용되지 않았습니다.')}else if(e.error!=='no-speech'&&e.error!=='aborted')notify('음성 입력 오류: '+e.error)};
  r.onend=()=>finishDictation(d);
  try{r.start();setVoiceLabel(btn,true);arm(9000)}catch(err){dict=null;notify(err.message)}
}
function requestStop(){const d=dict;if(!d)return;clearTimeout(d.timer);try{d.r.stop()}catch{}setTimeout(()=>finishDictation(d),1500)}
function finishDictation(d){
  if(d.done)return;d.done=true;clearTimeout(d.timer);
  if(dict===d)dict=null;
  if(d.btn.isConnected)setVoiceLabel(d.btn,false);
  if(!d.cancel&&d.heard)aiPolish(d.area,d.code,d.onChange);
}

/* ── AI ── */
function geminiKey(){const k=load('ai_key').trim();return !!k&&!k.startsWith('sk-')}
function provider(){return load('ai_key').trim()?'gemini':null}
function providerName(){return provider()?'Gemini':''}
const aiReady=()=>!!provider();
async function aiAsk(prompt,opt={}){
  const key=load('ai_key').trim(),custom=load('ai_model').trim();
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${custom||'gemini-flash-lite-latest'}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.2,...(opt.max?{maxOutputTokens:opt.max}:{})}}),signal:AbortSignal.timeout(20000)});
  const j=await res.json();if(!res.ok)throw Error(j.error?.message||res.status);
  let out=j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('');
  out=(out||'').trim().replace(/^["“]|["”]$/g,'');
  if(!out)throw Error('빈 응답');
  return out;
}
const aiCorrect=(text,code)=>aiAsk(`다음은 음성 인식으로 받아 적은 ${nameOf(code)} 문장입니다. 뜻은 절대 바꾸지 말고, 잘못 인식된 단어·맞춤법·띄어쓰기·문장부호만 자연스럽게 고쳐 주세요. 설명 없이 고친 문장만 ${nameOf(code)}로 출력하세요.${glossaryHint()}\n\n${text}`);
async function aiPolish(area,code,onChange){
  if(!aiReady()||!navigator.onLine)return;
  const before=area.value.trim();if(!before)return;
  const badge=$('#aiBadge');badge?.classList.add('show');
  try{const out=await withTimeout(aiCorrect(before,code),6000);if(area.isConnected&&area.value.trim()===before){area.value=out;onChange?.()}}
  catch{const b=$('#aiBadge');if(b){b.querySelector('b').textContent='교정 생략';setTimeout(()=>{b.classList.remove('show');b.querySelector('b').textContent='AI 교정 중'},1500);return}}
  $('#aiBadge')?.classList.remove('show');
}

/* ── 오프라인 저장 ── */
function offlineFor(code){return loadJSON('offline_'+code,null)}
function cacheTr(code,ko,tr){const o=offlineFor(code)||{at:Date.now(),items:{},full:false};o.items[ko]=tr;store('offline_'+code,JSON.stringify(o))}
async function precache(texts){
  if(!navigator.onLine)return;
  const codes=new Set([active().code,...LANGS.filter(l=>offlineFor(l.code)?.full).map(l=>l.code)]);
  for(const code of codes)for(const ko of texts){try{cacheTr(code,ko,await translateOne(ko,'ko',code))}catch{}}
}
async function downloadPhrases(code,btn,done){
  if(!navigator.onLine)return notify('인터넷이 될 때 받을 수 있습니다.');
  const all=[...new Set([...Object.values(allPhrases()).flat(),...notes.map(n=>n.x).filter(Boolean)])];
  const items={...(offlineFor(code)?.items||{})};
  let n=0,fail=0;const orig=btn.textContent;btn.disabled=true;
  const queue=[...all];
  const worker=async()=>{while(queue.length){const ko=queue.shift();try{items[ko]=await translateOne(ko,'ko',code)}catch{fail++}n++;btn.textContent=`받는 중 ${n}/${all.length}`}};
  await Promise.all([worker(),worker(),worker()]);
  btn.disabled=false;btn.textContent=orig;
  store('offline_'+code,JSON.stringify({at:Date.now(),items,full:true}));
  notify(fail?`${nameOf(code)} 문구를 받았습니다 (${fail}개 실패 · 다시 업데이트해 주세요)`:`${nameOf(code)} 문구 ${all.length}개를 받았습니다.`);
  done?.();
}

/* ── 번역 ── */
function splitText(text,max=380){
  const parts=text.replace(/\r/g,'').split(/(?<=[.!?。！？\n])\s*/);
  const out=[];let cur='';
  for(let p of parts){
    while(p.length>max){if(cur){out.push(cur);cur=''}out.push(p.slice(0,max));p=p.slice(max)}
    if((cur+' '+p).length>max){if(cur)out.push(cur);cur=p}else cur=cur?cur+' '+p:p;
  }
  if(cur.trim())out.push(cur);
  return out.map(s=>s.trim()).filter(Boolean);
}
function decodeEntities(s){if(!s)return s;const t=document.createElement('textarea');let prev;do{prev=s;t.innerHTML=s;s=t.value}while(s!==prev&&/&[#a-z0-9]+;/i.test(s));return s}

const ENGINES=[['free','무료 번역기'],['gemini','Gemini']];
/* V36: Gemini 번역 모델 단계 선택 (빠름·균형·정확). 모델 이름을 직접 적으면 그게 우선 */
const GEM_TIERS=[['fast','⚡ 빠름','gemini-3.5-flash-lite','가장 빠르고 아주 저렴'],['balanced','⚖️ 균형','gemini-3.8-flash','추천 · 문맥 잘 이해, 빠름'],['accurate','🎯 정확','gemini-4-argon','이상한 말도 가장 잘 알아들음 · 느리고 비쌈']];
const GEM_FALLBACK='gemini-flash-lite-latest';
function engLabel(){if(engine()!=='gemini')return engineName();return 'Gemini '+(load('ai_model').trim()||GEM_TIERS.find(x=>x[0]===gemTier())[1])}
function gemTier(){const t=load('gem_tier','');return GEM_TIERS.some(x=>x[0]===t)?t:'balanced'}
function gemModel(){return load('ai_model').trim()||GEM_TIERS.find(x=>x[0]===gemTier())[2]}
function gemCfg(m){const c={temperature:0.2};if(/argon/.test(m))c.thinkingConfig={thinkingLevel:'low'};return c}
function engine(){const e=load('tr_engine','');if(e==='free')return'free';return geminiKey()?'gemini':'free'}
const engineName=()=>({free:'무료 번역기',gemini:'Gemini 번역기'})[engine()];
function aiTrPrompt(text,src,target,ctx){
  const g=glossary.filter(x=>x.word&&x.out).map(x=>`${x.word} → ${x.out}`).join(', ');
  return `당신은 여행 통역사입니다. 아래 ${nameOf(src)} 글을 ${nameOf(target)}로 자연스럽게 번역하세요. 현지 사람이 바로 알아듣는 말투로, 뜻을 빼거나 보태지 마세요. 설명·따옴표·원문 없이 번역문만 출력하세요.`+(g?`\n고유명사는 이렇게 쓰세요: ${g}`:'')+(ctx?`\n바로 앞에 한 말(참고만 하고 번역하지 마세요): ${ctx}`:'')+`\n\n번역할 글:\n${text}`;

async function geminiTranslate(text,src,target,ctx){
  const models=[...new Set([gemModel(),GEM_FALLBACK])];let err;

        body:JSON.stringify({contents:[{parts:[{text:aiTrPrompt(text,src,target,ctx)}]}],generationConfig:gemCfg(m)}),signal:AbortSignal.timeout(/argon/.test(m)?40000:25000)});
      const j=await res.json().catch(()=>({}));if(!res.ok)throw Error(j.error?.message||('Gemini 오류 '+res.status));
      const out=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim();if(!out)throw Error('Gemini 빈 응답');return out;
    }catch(e){err=e}

let lastEngineWarn=0;
async function translateAI(text,src,target,ctx){
  const e=engine();
  if(e!=='free'){
    try{return await geminiTranslate(text,src,target,ctx)}
    catch(err){if(Date.now()-lastEngineWarn>60000){lastEngineWarn=Date.now();notify(`${engineName()} 번역 실패 → 무료 번역기로 대신 번역합니다 (${err.message})`)}}
  }
  const chunks=splitText(text);let out=[];
  for(const c of chunks)out.push(await translateOne(c,src,target));
  return out.join(' ');
}
async function translateOne(text,src,target){
  const qs=new URLSearchParams({q:text,langpair:`${src}|${target}`});
  const email=load('translation_email');if(email)qs.set('de',email);
  const res=await fetch('https://api.mymemory.translated.net/get?'+qs,{signal:AbortSignal.timeout(15000)});
  if(!res.ok)throw Error('번역 서버 오류 '+res.status);
  const p=await res.json();
  if(Number(p.responseStatus)!==200)throw Error(p.responseDetails||'번역 실패');
  const out=decodeEntities(p.responseData?.translatedText);
  if(!out)throw Error('번역 결과 없음');
  return out;
}
function cached(text,src,target){if(src!=='ko')return null;return offlineFor(target)?.items[text]||null}
async function translate(text,src,target,onProgress,ctx){
  text=String(text||'').trim();
  if(!text)throw new Error('번역할 문장이 없습니다');
  if(src===target)return text;
  const c=cached(text,src,target);if(c)return c;
  if(!navigator.onLine)throw new Error('인터넷이 없습니다. 📚 여행 문구나 받아 둔 자주 쓰는 문장을 써 주세요');
  // AI 엔진은 긴 글을 크게 나눠(앞뒤 뜻을 보며) 번역, 무료 번역기는 380자씩
  const ai=engine()!=='free';
  const chunks=splitText(text,ai?2500:380);
  if(chunks.length===1)return ai?translateAI(chunks[0],src,target,ctx):translateOne(chunks[0],src,target);
  const out=[];
  for(let i=0;i<chunks.length;i++){out.push(await(ai?translateAI:translateOne)(chunks[i],src,target));onProgress?.(out.join(' '),i+1,chunks.length)}

}
function isEmptyText(t){return !String(t||'').replace(/[\s.,!?。、！？…·]/g,'')}
async function consume(text,source,opt={}){
  text=String(text||'').trim();
  if(isEmptyText(text))return;
  if(source==='ko')text=fixHeard(text);
  const toListen=state.mode==='listen';
  const target=source==='ko'?active().code:'ko';
  const entry={original:text,translation:'',source,target,failed:false};
  if(opt.retr)entry.by='다시 번역 · '+engLabel();
  (toListen?state.listening:state.items).push(entry);
  const slot=outReserve(target,entry);
  // 대화 모드에서 말로 한 문장은 번역 전에 AI가 다듬음 (5초 넘으면 원래 문장 사용)
  if(!toListen&&opt.fromMic&&!opt.skipAI&&aiReady()&&navigator.onLine&&!cached(text,source,target)){
    entry.correcting=true;render();scrollEnd();
    try{const fixed=await withTimeout(aiCorrect(text,source),5000);if(fixed&&fixed.length<text.length*3+20)entry.original=fixed}catch{}
    entry.correcting=false;
  }
  entry.translation='번역 중…';
  render();scrollEnd();
  const progress=(partial,i,n)=>{entry.translation=partial+`\n… 번역 중 (${i}/${n})`;render()};
  try{
    entry.translation=await translate(source==='ko'?protectWords(entry.original):entry.original,source,target,progress,opt.ctx);
    if(opt.note&&source==='ko')cacheTr(target,entry.original,entry.translation);
    render();scrollEnd();
    outReady(slot,entry.translation,opt.tone);
  }catch(err){entry.translation='번역 실패 · '+err.message;entry.failed=true;outReady(slot,'');render();scrollEnd()}
}

/* ── 실시간 음성 인식 ── */
/* L2: 크롬이 마이크를 다시 켤 때 예전 문장을 다시 보내는 경우가 있어, 최근 번역한 문장과 같으면 버리고 앞에 붙어 오면 잘라 냄 */
let recentSent=[];
const nzs=x=>String(x).replace(/[\s.,!?。、！？…]+/g,'');

  const now=Date.now();recentSent=recentSent.filter(r=>now-r.at<180000);
  let changed=true;
  while(changed&&txt){changed=false;const n=nzs(txt);if(!n)return'';
    for(const r of recentSent){
      if(n.length>=6&&r.n.includes(n))return'';           // 이미 번역한 문장 (또는 그 일부)
      if(r.n.length>=4&&n.startsWith(r.n)){txt=dropChars(txt,r.n.length);changed=true;break}  // 앞에 다시 붙어 온 부분
    }}

}
let lastFinal={text:'',at:0};
function pauseRecognizer(){const r=state.recognizer;state.recognizer=null;try{r?._flush?.()}catch(e){console.warn("flush",e)}try{r?.abort()}catch{}if(state.interim){state.interim='';updateLive()}}

/* ── 화면 꺼짐 방지와 자동 종료 ──

}

let micRetry=0,micLastError='',micRetryTimer=null,micWatchdog=null,micStartingAt=0;

    if(e.error==='aborted')return;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      state.mic=false;state.recognizer=null;render();
      micDiagnostic('마이크/음성 인식 권한 거부 ('+e.error+'). Chrome 사이트 설정을 확인해 주세요.');
    }else if(e.error==='no-speech'){micDiagnostic('음성 인식 결과 없음 (no-speech). 설정된 언어 '+r.lang+'로 말하거나 외국어/한국어 선택을 확인해 주세요.');}
    else{micDiagnostic('음성 인식 오류: '+e.error);if(e.error==='network')notify('음성 인식 서버와 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.')}
  };
  r.onend=()=>{
    if(state.recognizer!==r)return;
    clearTimeout(gapTimer);state.recognizer=null;
    if(rem)commit();
    state.interim='';
    updateLive();updateMic();
    if(state.mic){
      // 크롬이 혼자 끊은 것(조용함 등)은 고장이 아니므로 바로 다시 듣기
      if(gotFin||gotAudio){micRetry=0;resumeRecognizer()}
      else scheduleMicRetry(micLastError||'음성 인식 결과 없이 종료됨 · 인식 언어 '+r.lang);
    }
  };
  try{
    r.start();micStartingAt=Date.now();
    micWatchdog=setTimeout(()=>{if(state.recognizer!==r||!state.mic)return;state.recognizer=null;try{r.abort()}catch{}scheduleMicRetry('마이크 시작 응답 없음 (8초)')},8000);
    micDiagnostic('마이크 연결 시도 중…');
  }catch(e){state.recognizer=null;scheduleMicRetry('마이크 시작 실패: '+e.message);updateMic()}
}

/* ── 전체 화면 / 설치 ── */
function toggleFullscreen(){
  const d=document;
  if(d.fullscreenElement)d.exitFullscreen?.();
  else (d.documentElement.requestFullscreen?.()||Promise.reject()).catch(()=>notify('이 브라우저에서는 전체 화면을 지원하지 않습니다.'));
}
document.addEventListener('fullscreenchange',()=>{if(state.page==='main'&&!state.modal)render()});
let installEvent=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;if(state.modal?.type==='settings')render()});
async function installApp(){if(!installEvent)return notify(isIOS?'사파리 아래 공유 버튼(□↑) → "홈 화면에 추가"를 눌러 주세요.':'크롬 오른쪽 위 메뉴(⋮) → "앱 설치"(또는 "홈 화면에 추가")를 눌러 주세요.');installEvent.prompt();await installEvent.userChoice.catch(()=>{});installEvent=null;render()}
window.addEventListener('appinstalled',()=>notify('설치되었습니다. 홈 화면의 "여행 통역" 아이콘으로 여세요.'));
if('serviceWorker'in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update()).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||state.page!=='home')return;reloaded=true;location.reload()});
}


window.addEventListener('offline',()=>{if(state.page==='main')render()});
window.addEventListener('online',()=>{if(state.page==='main')render()});
window.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('.confirm-back')){$('.confirm-back').remove();return}if(state.modal||state.side)closeLayer();else if(state.page==='main')goHome()});
render();

</script>
