<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#29865c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 통역">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>여행 통역</title>
<style>
/* ── 테마 (설정에서 바꿈) ── */
#app{--accent:#29865c;--accent2:#2378c9;--bg:#fff;--surface:#f4f8f6;--text:#16221c;--muted:#6e7c76;--line:#e6ece9;--ko:#e4f4e9;--fg:#f0f2f3;--blue:#2479b9;--turn-ko:#e4f4e9;--turn-foreign:#fce8ef;--radius:16px;--font:system-ui,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.modal-content,.drawer,.transcript,.select-pop{overflow-x:hidden!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:#f2f5f4;position:fixed;inset:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #177bc0;outline-offset:3px}
svg{display:block}
#app{--app-h:100dvh;width:100%;height:var(--app-h);max-width:750px;margin:auto;background:var(--bg);color:var(--text);font-family:var(--font);position:relative;overflow:hidden}
/* ── 첫 화면 ── */
.home{height:var(--app-h);overflow:hidden;touch-action:manipulation;position:relative;background:#456 center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(46px + env(safe-area-inset-bottom))}
.home:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003,transparent 40%,#0006)}
.lang{position:relative;border:1px solid #fff9;background:#fffffff0;color:#1e3038;border-radius:40px;padding:13px 26px;font-size:19px;box-shadow:0 4px 16px #0004}
.home-tip{position:relative;color:#fff;font-size:15px;margin-top:16px;text-shadow:0 1px 4px #000c}
.select-pop{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#fff;color:#1e3038;border-radius:18px;padding:8px;width:min(92vw,340px);max-height:58vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:2px;z-index:15;box-shadow:0 8px 40px #0005}
.select-pop button{display:block;width:100%;border:0;background:white;padding:12px 10px;text-align:left;border-radius:10px;font-size:15px}.select-pop button.on{background:#e3f4e9;font-weight:700}
/* ── 본 화면 ── */
.screen{display:flex;flex-direction:column;height:var(--app-h);overflow:hidden;--acc:var(--accent)}
.screen.listen{--acc:var(--accent2)}
.top{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;padding:calc(22px + env(safe-area-inset-top)) 10px 10px;border-bottom:1px solid var(--line)}
.top-left{justify-self:start;display:flex;gap:4px;align-items:center;min-width:0}.top-right{justify-self:end;display:flex}
.home-btn{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 9px;font-size:14px;font-weight:650;white-space:nowrap}
.mode-wrap{display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.moon-btn{border:0;background:transparent;font-size:16px;padding:4px 2px;opacity:.8;line-height:1}
.mode{font-size:21px;font-weight:780;color:var(--acc);border:none;background:none;padding:4px;white-space:nowrap}
.icon-btn{border:0;background:none;padding:7px;color:var(--muted);border-radius:10px}
.listen-preview{display:flex;align-items:center;gap:7px;flex-shrink:0;min-height:30px;padding:5px 16px;border-bottom:1px solid #f5e7ec;color:var(--text);background:#fff5f8;font-size:14px;line-height:1.4}
.listen-preview small{flex-shrink:0;color:var(--muted);font-size:11px}.listen-preview span{display:block;min-width:0;flex:1;overflow:hidden;white-space:nowrap}

.transcript{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 18px}
.hint{color:var(--muted);text-align:center;margin:13vh 0 0;font-size:15px;line-height:1.8;white-space:pre-line}
.hint svg{margin:0 auto 10px}
.pair{margin:0 0 15px;display:flex;flex-direction:column;gap:6px}
.bubble{position:relative;line-height:1.55;max-width:94%;border-radius:var(--radius);padding:12px 15px 13px;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer}
.bubble.ko{background:var(--ko);align-self:flex-start}
.bubble.foreign{background:var(--fg);align-self:flex-end}
.bubble.fail{background:#fff0e0;color:#8a4b12}
.bubble .edit{position:absolute;right:4px;bottom:2px;min-width:30px;min-height:30px;font-size:15px;color:var(--muted);border:0;background:transparent}
.listen-row{position:relative;padding:12px 14px;background:var(--surface);border-radius:var(--radius);margin-bottom:9px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer}
.listen-row .orig{display:block;font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}
/* 아래 한 줄 */
.bar{border-top:1px solid var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}
.bar-left{justify-self:start;display:flex;gap:5px}.bar-right{justify-self:end;display:flex;gap:4px}
.sbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:48px;height:50px;padding:3px 5px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--text)}
.sbtn span{font-size:10px;line-height:1.1;white-space:nowrap;color:var(--muted)}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.55);opacity:0}}
.mic-state{font-size:10px;color:var(--muted);white-space:nowrap}
.font-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:50px;font-weight:800;font-size:16px;line-height:1;padding:0}
.font-btn small{display:block;font-size:8px;font-weight:500;margin-top:3px;color:var(--muted)}
/* 서랍 */
.drawer{position:absolute;top:0;bottom:0;right:0;width:min(84vw,320px);z-index:6;box-shadow:-7px 0 25px #0003;background:var(--bg);padding:calc(22px + env(safe-area-inset-top)) 16px 18px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.overlay{position:absolute;inset:0;background:#0005;z-index:5}
.drawer-close{float:right;background:none;border:0;font-size:24px}
.drawer h3{margin:18px 0 6px}
.drawer-tip{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.drawer-item{width:100%;padding:13px 12px;text-align:left;background:var(--surface);border:0;border-radius:12px;margin-bottom:8px;font-weight:700}
.drawer-item small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-item.strong{background:var(--accent);color:#fff}.drawer-item.strong small{color:#ffffffd0}
/* 창 */
.modal{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
.modal-head{display:flex;align-items:center;gap:8px}
.modal-head h2{font-size:19px;margin:0 0 0 auto}
.plain{border:0;background:none;padding:9px;font-size:18px}
.ai-badge{display:none;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff;background:#7b4ed6;border-radius:14px;padding:5px 10px}
.ai-badge.show{display:flex}
.ai-badge i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.modal-content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding-top:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
.action{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.primary{background:var(--blue);color:#fff;border:0}
.danger{background:#c0392b;color:#fff;border:0}
.editor{width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:18px;line-height:1.5;background:var(--bg)}
.voice-row{display:flex;gap:8px;margin:10px 0 4px}
.voice-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.voice-btn.on{background:#c0392b}
.voice-btn small{font-weight:400;font-size:12px;opacity:.9}
.go-btn{flex:0 0 auto;padding:14px 18px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-size:16px;font-weight:700}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row-btns .action{flex:1;min-width:0;white-space:nowrap;font-size:14px;padding:11px 8px}
.row-btns.two .action{flex:1 1 calc(50% - 8px);white-space:normal}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.tiny{font-size:12px;color:var(--muted);line-height:1.6}
.notice{position:absolute;left:14px;right:14px;bottom:120px;z-index:30;background:#243f37;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 3px 15px #0003;font-size:13px}
.field{display:block;margin:12px 0 5px;font-size:13px;color:var(--muted)}
.text-field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sec{border-top:1px solid var(--line);padding:14px 0 6px;margin-top:10px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.sec h4{margin:0 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.phrase{width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:11px 13px;margin-bottom:7px}
.phrase small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.confirm-back{position:absolute;inset:0;background:#0006;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-box{background:var(--bg);border-radius:18px;padding:22px 20px 16px;width:min(100%,330px);box-shadow:0 10px 40px #0005}
.confirm-box p{white-space:pre-line;margin:0 0 18px;font-size:17px;line-height:1.5}
.confirm-box .actions{justify-content:flex-end}
.offline-banner{padding:6px 15px;background:#ffe7c6;color:#6b4300;font-size:12px;text-align:center}
/* ── v5 추가 ── */
.bubble .ctrls{display:flex;justify-content:flex-end;gap:2px;margin:4px -8px -6px 0}
.bubble .ctrl,.listen-row .ctrl{border:0;background:transparent;color:var(--muted);opacity:.65;min-width:32px;min-height:30px;border-radius:8px;font-size:14px;font-weight:700;display:grid;place-items:center}
.bubble .ctrl.on,.listen-row .ctrl.on{opacity:1;color:var(--accent)}

.bubble .ctrl.edit-ctrl,.listen-row .ctrl.edit-ctrl{font-size:15px;font-weight:400}
.faint{opacity:.65;font-weight:400;font-size:11px}
.photo-prev{display:block;max-width:100%;max-height:200px;margin:12px auto 0;border-radius:12px}
.pron{display:block;font-size:.72em;color:var(--muted);margin-top:4px;line-height:1.45}
.bubble .fixing{display:block;font-size:12px;color:#7b4ed6;opacity:.75;margin-top:4px}
.live{align-self:flex-start;max-width:94%;border:1.5px dashed var(--line);border-radius:var(--radius);padding:10px 14px;color:var(--muted);font-size:17px;margin-bottom:12px;white-space:pre-wrap}
.live b{display:block;font-size:11px;font-weight:600;margin-bottom:3px}
.sbtn,.font-btn{transition:transform .1s,background .2s}
.sbtn:active,.font-btn:active{transform:scale(.92)}
.flash{animation:flash .45s ease-out}
@keyframes flash{0%{background:#cfe9ff;transform:scale(.92)}100%{transform:scale(1)}}
.ai-state.on{color:#7b4ed6;opacity:.85}
.ai-state{display:block;font-size:14px;font-weight:600;text-align:center;padding:7px 6px;border:1px solid currentColor;border-radius:10px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);opacity:.7;white-space:nowrap}
.ai-state.tier{cursor:pointer;opacity:.95}

.listen-row .l-orig{color:#3f9d6e;opacity:.9;line-height:1.4;margin-bottom:4px}
.side-tabs{position:absolute;right:0;top:45%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:3}
.side-tab2{width:26px;height:108px;border:0;border-radius:9px 0 0 9px;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:-2px 2px 8px #0002}
.side-tab2 i{font-style:normal;font-size:11px;opacity:.85}.side-tab2 span{font-size:11px;font-weight:700;writing-mode:vertical-rl;letter-spacing:2px}
.st-notes{background:#dce8f6;color:#4c719f}.st-refs{background:#e0efe6;color:#517b64}
.top-left .home-btn{padding:6px 7px;font-size:13px}.home-btn.play-all{color:#2e9b62;border-color:#2e9b6266}.home-btn.play-all.on{background:#2e9b62;color:#fff}
.refs-drawer .drawer-tip{margin-bottom:10px}
.ref-busy{font-size:13px;background:#fdf1dc;border-radius:10px;padding:8px 10px;margin:0 0 10px}.ref-busy.err{background:#fbe6e6}
.rg{border-radius:12px;padding:6px 8px 8px;margin-bottom:10px;color:#1d2a35;border:2px solid transparent}.rg.on{border-color:#2e9b6255}
.rg:not(.on) .rg-name b{opacity:.55}
.rg-head{display:flex;align-items:center;gap:4px}
.rg-arrow,.rg-edit,.ri-edit{border:0;background:transparent;font-size:16px;min-width:30px;min-height:34px;color:#1d2a35}
.rg-name{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:4px 2px;color:#1d2a35}
.rg-name b{display:flex;align-items:center;gap:5px;font-size:16px;min-width:0;overflow-wrap:anywhere}.rg-name small{display:block;flex-shrink:0;white-space:nowrap;font-size:11px;opacity:.7;margin-top:0}
.rg-name .rg-toggle-dot{font-size:18px;line-height:1;flex-shrink:0}
.rg-arrow{font-size:20px;min-width:34px}
.ri{display:flex;align-items:center;gap:6px;background:#ffffffb0;border-radius:9px;padding:7px 4px 7px 8px;margin-top:6px;border:2px solid transparent;user-select:none;cursor:pointer}
.ri:not(.on){opacity:.5}.ri.dim{opacity:.5}.ri.prio{border-color:#2e9b62;background:#dff3e7;opacity:1}
.ri-k{font-size:10px;padding:2px 5px;border-radius:5px;background:#0000000f;white-space:nowrap}.ri.prio .ri-k{background:#2e9b62;color:#fff}
.ri-t{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg-add{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.rg-addb{border:1px dashed #0003;background:#ffffff80;border-radius:9px;padding:5px 0;font-size:16px;color:#1d2a35}.rg-addb small{display:block;font-size:9px;margin-top:1px}
.rg-colors{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}.rg-color{width:36px;height:36px;border-radius:50%;border:2px solid #0001}.rg-color.on{border:3px solid #2e9b62}
.rec-time{font-size:28px;text-align:center;font-variant-numeric:tabular-nums;margin:0 0 16px}
.bubble .ctrls .sel-dot{margin-right:auto}
.sel-dot{border:0;background:transparent;color:#2e9b62;font-size:18px;min-width:30px;min-height:30px;opacity:.55;line-height:1}.sel-dot.on{opacity:1}
.listen-row.picked,.pair.picked .bubble:first-child{box-shadow:0 0 0 2px #2e9b6266 inset}
.bubble.reading-now{box-shadow:none!important;border:0;background:#fff3f7;font-weight:400}
.listen-row.now{box-shadow:none!important;background:#fff3f7;font-weight:400}
.listen-row.now .l-orig,.listen-row.now .l-tr{font-weight:400}
.entry-engine{border:0;background:none;color:var(--muted);font-size:10px;font-weight:400;opacity:.75;padding:3px 2px;min-height:26px;white-space:nowrap;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.entry-engine:disabled{cursor:wait}
.entry-mode-menu{position:fixed;z-index:180;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 3px 14px #0002;display:flex;gap:2px}
.entry-mode-menu button{background:none;border:0;border-radius:7px;font-size:12px;padding:8px 9px;color:var(--text)}
.entry-mode-menu button.on{background:var(--surface)}
.home-btn.play-all.sel{background:#e2f4e9}
.ph-chips{margin:10px 0 6px}
.ph-block{background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.ph-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ph-lang{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 6px;font-size:13px}
.ph-o{font-size:17px;font-weight:600;line-height:1.5;white-space:pre-wrap}
.ph-tr{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:15px;line-height:1.5;white-space:pre-wrap;color:var(--muted)}.ph-tr span{flex:1}
.tm-open{width:100%;text-align:left;margin-bottom:6px}
.rg-terms{width:100%;margin-top:6px;border:1px solid #2e9b6266;background:#ffffffb0;color:#1f6f45;border-radius:9px;padding:7px;font-size:13px;font-weight:700}
.tm-q{margin:8px 0}
.tm-form{background:var(--surface);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.tm-ft{font-weight:700;font-size:14px}.tm-orow{display:grid;grid-template-columns:1fr 1.4fr;gap:6px}
.tm-row{display:flex;align-items:center;gap:4px;padding:8px 6px;border-bottom:1px solid var(--line)}.tm-row.on{background:#e2f4e9;border-radius:8px}
.tm-t{flex:1;min-width:0;line-height:1.35}.tm-t b{font-size:15px}.tm-t small{display:block;font-size:12px;overflow-wrap:anywhere}
.tm-h{color:#b5651d}.tm-o{color:#1f6f45}
.tm-b{border:0;background:transparent;min-width:34px;min-height:34px;font-size:15px;color:var(--muted)}
.listen-row .l-tr{line-height:1.5}
.listen-row.waiting{border:1px dashed rgba(63,157,110,.45)}
.big-ov{position:absolute;inset:0;background:var(--bg);z-index:60;overflow:hidden}
.big-stage{position:absolute;top:50%;left:50%;display:flex;flex-direction:column;padding:10px 16px 8px;transition:transform .25s}
.big-bar{display:flex;align-items:flex-start;gap:8px}
.big-sub{flex:1;min-width:0;font-size:14px;color:#3f9d6e;line-height:1.4;max-height:3em;overflow:hidden}
.big-btns{display:flex;gap:6px;flex:0 0 auto}
.big-b{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
.big-b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.big-mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.big-main{font-weight:700;line-height:1.35;text-align:center;overflow-wrap:anywhere;max-width:100%}
.big-pron{font-size:20px;color:var(--muted);margin-top:10px;text-align:center}
.big-tip{font-size:11px;color:var(--muted);text-align:center;opacity:.7}
.bubble .ctrl.star,.listen-row .ctrl.star{font-size:17px;color:#d4a017;opacity:.9}.bubble .ctrl.star.on,.listen-row .ctrl.star.on{color:#e0a800;opacity:1}
.listen-row .ctrls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:2px;margin-top:6px}
.listen-row .pron{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.share-pick{display:flex;flex-direction:column;gap:8px}
.saved-row{display:flex;gap:6px;align-items:stretch}
.saved-row .drawer-item.saved{flex:1;min-width:0;font-weight:600}
.saved-row .drawer-item.saved b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-x{border:0;background:transparent;color:var(--muted);padding:0 6px;margin-bottom:8px}
/* L22: 듣기 조작줄의 글씨와 간격만 통일. */
.listen-row,.pair{--ctrl-gap:clamp(4px,1.1vw,8px)}
.listen-row .ctrls,.bubble .ctrls{justify-content:flex-start;column-gap:var(--ctrl-gap);row-gap:4px}

/* 휴대폰 저장소(IndexedDB) 공통: dbOpen은 연결을 한 번만 열어 주는 함수를, dbTx는 한 번의 읽기·쓰기를 약속(Promise)으로 돌려줌. 명함 사진·사진 통역 기록·녹음이 같이 씀 */
function dbOpen(name,version,upgrade){let p=null;return()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open(name,version);r.onupgradeneeded=()=>upgrade(r.result,r);r.onsuccess=()=>res(r.result);r.onerror=()=>{p=null;rej(r.error)}}))}
async function dbTx(open,stores,mode,fn){const db=await open();return new Promise((res,rej)=>{const tx=db.transaction(stores,mode),box={};tx.oncomplete=()=>res(box.v);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||Error('저장 중단'));fn(tx,box)})}
const cardDb=dbOpen('travel_card_images',1,db=>db.createObjectStore('images'));
const cardStore=(id,data)=>dbTx(cardDb,'images','readwrite',tx=>{const os=tx.objectStore('images');if(data===null)os.delete(id);else os.put(data,id)});
const cardImage=id=>dbTx(cardDb,'images','readonly',(tx,box)=>{tx.objectStore('images').get(id).onsuccess=e=>box.v=e.target.result||null}).then(v=>v??null);
const phDb=dbOpen('travel_photo_history',2,(db,r)=>{const os=db.objectStoreNames.contains('photos')?r.transaction.objectStore('photos'):db.createObjectStore('photos',{keyPath:'id'});if(!os.indexNames.contains('sig'))os.createIndex('sig','sig')});
const phTx=(mode,fn)=>dbTx(phDb,'photos',mode,fn);
const phStore=record=>phTx('readwrite',tx=>tx.objectStore('photos').put(record));
const phGet=id=>phTx('readonly',(tx,box)=>{tx.objectStore('photos').get(id).onsuccess=e=>box.v=e.target.result});
const phFindSig=sig=>phTx('readonly',(tx,box)=>{tx.objectStore('photos').index('sig').get(sig).onsuccess=e=>box.v=e.target.result||null});
const phAll=()=>phTx('readonly',(tx,box)=>{tx.objectStore('photos').getAll().onsuccess=e=>box.v=e.target.result.sort((a,b)=>b.at-a.at)});
const recDb=dbOpen('travel_recordings',1,db=>{db.createObjectStore('recs',{keyPath:'id'});db.createObjectStore('chunks',{autoIncrement:true}).createIndex('rec','rec')});

function parseTerm(x){x=String(x);let out='',ol='';const k=x.indexOf('→');if(k>=0){out=x.slice(k+1).trim();x=x.slice(0,k);const m=out.match(/^([a-z]{2}(?:-[A-Z]{2})?)\s*[:：]\s*/);if(m){ol=m[1];out=out.slice(m[0].length).trim()}}const [w,...h]=x.split('|');return{word:(w||'').trim(),heard:h.join(',').split(/[,，、]/).map(z=>z.trim()).filter(Boolean).join(','),out,ol}}

function protectWords(text,target){target=target||active().code;let t=text;for(const g of allGloss()){if(g.word&&termFor(g,target))t=t.replace(new RegExp(esc(g.word),'g'),g.out)}return t}

/* ── L11·L12: 배경 자료 ──
   사진·PDF·음성 파일·녹음·명함을 올리면 Gemini가 제목·요약·용어·글 전체를 뽑아 휴대폰에 저장 (파일 자체는 저장 안 함)
   켜 둔 자료의 용어는 대화·듣기 모드 모두에 참고. 🟩 우선 자료(원고) 글 전체는 듣기 모드에서만 참고 */
function refTerms(){const on=activeRefs();return on.filter(r=>r.prio).concat(on.filter(r=>!r.prio)).flatMap(r=>(r.terms||[]).map(x=>parseTerm(x).word)).filter(Boolean)}
/* M29: 번역할 문장(과 앞 문장)에 실제로 나온 용어만 보냄 — 바른 말·잘못 들리는 말·외국어 표기 중 하나라도 나오면 관련 용어.
   최대 12개·머리글 포함 360자, 관련 용어가 없으면 '' (머리글도 안 보냄). 켜 둔 자료(activeRefs)만 보며 🟩 우선 자료 용어가 먼저.
   우선 자료는 문장에 안 나와도 맨 뒤에 REF_PRIO_FILL개까지만 채움(0이면 끔). 용어집 저장·편집은 건드리지 않음. */
const REF_MAX_TERMS=12,REF_MAX_CHARS=360,REF_PRIO_FILL=4;
function compactRefHint(text,ctx){
  const on=activeRefs();if(!on.length)return '';
  const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
  const cur=norm(text),prev=norm(ctx),code=active().code;
  const hit=(h,k)=>!!h&&!!k&&(h===k||(k.length>=2&&h.includes(k)));
  const seen=new Set(),found=[],fill=[];
  for(const r of on.filter(r=>r.prio).concat(on.filter(r=>!r.prio))){
    for(const raw of r.terms||[]){
      const g=parseTerm(raw);if(!g.word||seen.has(g.word))continue;seen.add(g.word);
      const mapped=termFor(g,code);
      const keys=[g.word,...g.heard.split(','),...(mapped?[g.out]:[])].map(norm).filter(Boolean);
      const rank=keys.some(k=>hit(cur,k))?0:keys.some(k=>hit(prev,k))?1:-1;
      const s=(mapped?g.word+'→'+g.out:g.word).slice(0,60);
      if(rank>=0)found.push({rank,s});else if(r.prio&&fill.length<REF_PRIO_FILL)fill.push({rank:2,s});
    }
  }
  const list=found.sort((a,b)=>a.rank-b.rank).concat(fill);
  const head='\n[용어] ';let out=head,n=0;
  for(const {s} of list){
    if(n>=REF_MAX_TERMS)break;
    const add=(n?', ':'')+s;if((out+add).length>REF_MAX_CHARS)break;
    out+=add;n++;
  }
  return n?out:'';
}
function refHint(max,full){
  const on=activeRefs();if(!on.length)return '';
  let out='';
  if(full){
    const ps=on.filter(r=>r.prio&&(r.text||r.sum));
    if(ps.length){const each=Math.round(max*0.75/ps.length);
      out+=`🟩 우선 자료(원고) — 지금 이 원고를 읽거나 이 내용으로 말하고 있을 수 있습니다. 들린 말이 원고 문장과 같으면 원고의 표기·용어를 따르되, 이번 녹음에서 실제로 들리지 않은 원고 문장은 절대 쓰지 마세요.\n`+ps.map(r=>`「${r.title}」\n${String(r.text||r.sum).slice(0,each)}`).join('\n')+'\n'}
    const rest=on.filter(r=>!r.prio&&r.sum);
    if(rest.length)out+=rest.map(r=>`- ${r.title}: ${String(r.sum).replace(/\s+/g,' ')}`).join('\n').slice(0,ps.length?Math.round(max*0.25):max)+'\n';
  }
  const t=[...new Set(refTerms())].slice(0,150);if(t.length)out+=`용어·이름: ${t.join(', ')}\n`;
  return out?`\n\n[배경 자료 · 참고만, 번역하거나 그대로 옮기지 마세요]\n${out}`:'';
}

const LATIN_LANGS=['en','vi','id','ms','tl','fr','de','es','it','pt','pl','cs','tr'];
const KO_SCRIPT={ja:'가타카나 (예: 안녕하세요 → アンニョンハセヨ)',['zh-CN']:'소리가 비슷한 간체 한자 음역 (예: 안녕하세요 → 安宁哈塞哟, 감사합니다 → 康桑哈密达)',['zh-TW']:'소리가 비슷한 번체 한자 음역 (예: 안녕하세요 → 安寧哈塞喲, 감사합니다 → 康桑哈密達)',th:'태국 문자',hi:'데바나가리 문자',mn:'몽골어 키릴 문자',ru:'러시아어 키릴 문자',ar:'아랍 문자'};
function scriptMark(code){return{ru:'Аб',mn:'Аб',ar:'أب',hi:'अ',th:'ก',ja:'カ','zh-CN':'中','zh-TW':'中'}[code]||'Ab'}
function romanizeKo(text){
  const I=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
  const V=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
  const F=['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
  const FL=['','g','kk','g','n','n','n','d','r','g','m','b','s','t','p','h','m','b','s','s','ss','ng','j','ch','k','t','p',''];
  const ch=[...text];let out='';
  for(let i=0;i<ch.length;i++){
    const c=ch[i].charCodeAt(0)-0xAC00;
    if(c<0||c>11171){out+=ch[i];continue}
    const ini=Math.floor(c/588),med=Math.floor(c%588/28),fin=c%28;
    out+=I[ini]+V[med];
    const nx=(ch[i+1]||'').charCodeAt(0)-0xAC00;
    const nextVowel=nx>=0&&nx<=11171&&Math.floor(nx/588)===11;
    const nasal=nx>=0&&nx<=11171&&[2,6].includes(Math.floor(nx/588));
    if(fin)out+=nextVowel&&fin!==21?FL[fin]:nasal?({k:'ng',t:'n',p:'m'}[F[fin]]||F[fin]):F[fin];
  }
  return out.replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
}
function drawKoPron(parent,text,lang){
  const line=node('span','pron','',parent);
  const key='ko2>'+lang+'|'+text;
  if(LATIN_LANGS.includes(lang)){line.textContent='🗣 '+romanizeKo(text);return}
  if(pronCache[key]){line.textContent='🗣 '+pronCache[key];return}
  const roman=romanizeKo(text);
  if(!aiReady()||!navigator.onLine){line.textContent='🗣 '+roman;return}
  line.textContent='🗣 '+nameOf(lang)+' 글자로 만드는 중…';
  const prompt=`${nameOf(lang)} 사용자가 아래 한국어 문장을 소리 내어 따라 읽을 수 있게, 한국어 발음을 ${KO_SCRIPT[lang]||nameOf(lang)+' 문자'}로 옮겨 적으세요.\n규칙: 뜻을 번역하지 말 것, 한글을 한 글자도 쓰지 말 것, 문장을 한 번만 적을 것, 설명·따옴표 없이 결과 한 줄만.\n\n한국어: ${text}`;
  const ask=()=>withTimeout(aiAsk(prompt,{max:Math.min(400,text.length*6+40)}),12000);
  if(!pronInflight[key])pronInflight[key]=ask().then(r=>badPron(r,text,false)?ask():r).then(r=>{if(!badPron(r,text,false)){pronCache[key]=r;store('pron_cache',JSON.stringify(pronCache))}}).catch(()=>{}).finally(()=>{delete pronInflight[key]});
  pronInflight[key].then(()=>{if(line.isConnected)line.textContent='🗣 '+(pronCache[key]||roman)});
}
const pronInflight={};
/* L3: AI 발음 답 검사 — 반복되거나 너무 길거나 글자 종류가 틀리면 버림 */
const HANGUL=/[가-힣ㄱ-ㅎㅏ-ㅣ]/;
function badPron(r,text,wantHangul){if(!r)return true;r=r.trim();if(r.length>text.length*4+30)return true;if(wantHangul?!HANGUL.test(r):HANGUL.test(r))return true;
  const n=r.replace(/[\s.,!?。、，！？]/g,'');for(let L=4;L<=n.length/3;L++){const c=n.slice(0,L);if(n.split(c).length-1>=3)return true}return false}
for(const k of Object.keys(pronCache)){if(k.startsWith('ko2>')?HANGUL.test(pronCache[k]):false)delete pronCache[k]}
function makePron(text,code){
  const key=code+'|'+text;
  if(pronInflight[key])return pronInflight[key];
  const prompt=`다음 ${nameOf(code)} 문장을 한국 사람이 소리 내어 읽을 수 있도록 실제 발음을 한글로만 적어 주세요. 문장을 한 번만 적고, 설명·따옴표·원문 없이 한글 발음만 한 줄로 출력하세요.\n\n${text}`;
  const ask=()=>withTimeout(aiAsk(prompt,{max:Math.min(400,text.length*6+40)}),12000);
  return pronInflight[key]=ask().then(r=>badPron(r,text,true)?ask():r).then(r=>{if(!badPron(r,text,true)){pronCache[key]=r;store('pron_cache',JSON.stringify(pronCache))}}).catch(()=>{}).finally(()=>{delete pronInflight[key]});
}

function drawDrawer(parent){
  node('div','overlay','',parent).onclick=()=>{state.side=false;render()};
  const d=node('aside','drawer','',parent);
  button('▶','drawer-close',()=>{state.side=false;render()},d);
  node('h3','','자주 사용하는 문장',d);
  node('p','drawer-tip','짧게 누르면 통역해서 들려주고, 길게 누르면 고치거나 지울 수 있습니다.',d);
  let touch=0;
  d.addEventListener('touchstart',e=>touch=e.touches[0].clientX,{passive:true});
  d.addEventListener('touchend',e=>{if(e.changedTouches[0].clientX-touch>70){state.side=false;render()}},{passive:true});
  const p=button('📚 여행 문구','drawer-item strong',()=>openPhrases(),d);node('small','',offlineFor(active().code)?.full?'받아 둔 문구 · 인터넷 없어도 사용':'설정에서 받아 두면 인터넷 없이 사용',p);
  const grid=node('div','note-grid','',d);
  notes.forEach((n,i)=>{
    let timer,long=false;
    const b=button('','drawer-item'+(n.x?'':' empty'),()=>{if(long){long=false;return}useNote(i)},grid);
    b.textContent=n.t;b.title=n.x||'(비어 있음 · 길게 눌러 입력)';
    b.addEventListener('pointerdown',()=>{long=false;timer=setTimeout(()=>{long=true;openNote(i)},600)});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(timer)));
    b.oncontextmenu=e=>e.preventDefault();
  });
  button('＋ 문장 추가하기','drawer-item add',()=>openNote(-1),d);
  button('📷 사진 통역 기록','drawer-item strong',openPhotoHistory,d);
  node('h3','','⭐ 저장한 문장',d);
  if(!savedSents.length)node('p','drawer-tip','말풍선의 ☆를 누르면 여기에 모입니다. 인터넷 없이도 크게 보고 들을 수 있어요.',d);
  savedSents.slice().reverse().forEach(v=>{
    const row=node('div','saved-row','',d);
    const b=button('','drawer-item saved',()=>{state.side=false;openEnlarge(v.t,v.tg,v.o);if(state.speech!==3)speak(v.t,v.tg)},row);
    node('b','',v.t,b).dir='auto';node('small','',v.o,b);
    button('✕','saved-x',()=>askConfirm('저장한 문장을 지울까요?\n'+v.t,'지우기',()=>{savedSents=savedSents.filter(z=>z!==v);saveSaved();render()}),row);
  });
}
/* L3: ★ 저장한 문장 — 원문과 번역을 휴대폰에 저장 (새 버전에도 유지, 다시 번역 안 해서 크레딧 0) */
let savedSents=loadJSON('saved_sents',[]);
const saveSaved=()=>store('saved_sents',JSON.stringify(savedSents));
const savedIdx=x=>savedSents.findIndex(v=>v.o===x.original&&v.t===x.translation);
function toggleSave(x){const i=savedIdx(x);if(i>=0){savedSents.splice(i,1);notify('저장을 지웠습니다.')}else{savedSents.push({o:x.original,t:x.translation,s:x.source,tg:x.target,at:Date.now()});notify('★ 저장했습니다. ◀ 서랍에서 인터넷 없이 볼 수 있어요.')}saveSaved();render()}
function starBtn(parent,x){const on=savedIdx(x)>=0;const b=button(on?'★':'☆','ctrl star'+(on?' on':''),ev=>{ev.stopPropagation();toggleSave(x)},parent);b.title=on?'저장 지우기':'이 문장 저장 (인터넷 없이 보기)';return b}
async function useNote(i){
  const text=(notes[i]?.x||'').trim();
  if(!text)return openNote(i);
  if(state.mode!=='conversation')resetTranscripts(false);
  state.side=false;state.mode='conversation';render();
  await consume(text,'ko',{note:true});
  if(state.speech===3)notify('소리가 꺼져 있습니다. 위쪽 🔇 버튼을 누르면 켜집니다.');
}
function openNote(i){state.side=false;state.modal={type:'note',index:i};render()}
function openEnlarge(text,code,sub,other){state.modal={type:'enlarge',text,code,sub,other:other||(code==='ko'?active().code:'ko'),rotated:false};render()}
function openEdit(index,list){stopSpeech();state.modal={type:'edit',index,list:list||'items'};render()}
function openSettings(){state.modal={type:'settings'};render()}
// 긴 글을 줄(문단) 단위로 나누고, 너무 긴 줄은 문장 단위로 나눔 → 골라 번역하기용
function textUnits(text){return String(text).split(/\n+/).map(s=>s.trim()).filter(Boolean).flatMap(l=>l.length>300?splitText(l,300):[l])}
function openText(){stopSpeech();state.side=false;state.modal={type:'text'};render()}

function openPhrases(){state.side=false;state.modal={type:'phrases',cat:Object.keys(allPhrases())[0]};render()}

/* L3: 크게 보기 — 처음엔 가로로 크게, 위 버튼으로 세로·가로 바꾸기와 180° 회전. 원문은 위쪽 구석에 작게 */
function drawBig(root,data){
  if(data.land===undefined)data.land=true;
  const ov=node('section','big-ov','',root);
  const st=node('div','big-stage','',ov);
  const W=innerWidth,H=innerHeight;
  st.style.width=(data.land?H:W)+'px';st.style.height=(data.land?W:H)+'px';
  st.style.transform=`translate(-50%,-50%) rotate(${(data.land?90:0)+(data.rotated?180:0)}deg)`;
  const bar=node('div','big-bar','',st);
  if(data.sub)node('div','big-sub',data.sub,bar).dir='auto';else node('div','big-sub','',bar);
  const bt=node('div','big-btns','',bar);
  button(data.land?'세로':'가로','big-b',e=>{e.stopPropagation();data.land=!data.land;render()},bt);
  button('180°','big-b',e=>{e.stopPropagation();data.rotated=!data.rotated;render()},bt);
  const other=data.other||(data.code==='ko'?active().code:'ko');
  if(data.code!=='ko'?aiReady():other!=='ko')button(data.code==='ko'?scriptMark(other):'가','big-b'+(data.showP?' on':''),e=>{e.stopPropagation();data.showP=!data.showP;render()},bt);
  iconButton(ICON.speaker(18),'big-b','듣기',e=>{e.stopPropagation();speak(data.text,data.code)},bt);
  button('✕','big-b',e=>{e.stopPropagation();closeLayer()},bt);
  const mid=node('div','big-mid','',st);
  const big=node('div','big-main',data.text,mid);big.dir='auto';
  if(data.showP){const pw=node('div','big-pron','',mid);if(data.code!=='ko')drawPron(pw,data.text,data.code);else drawKoPron(pw,data.text,other)}
  node('div','big-tip','빈 곳을 누르면 돌아갑니다',st);
  ov.onclick=e=>{if(!e.target.closest('button,.big-main,.big-pron'))closeLayer()};
  // 글씨를 칸에 꽉 차게 (넘치면 줄임)
  requestAnimationFrame(()=>{let f=Math.min(120,(data.land?W:H)/3.2);big.style.fontSize=f+'px';while(f>22&&(big.scrollHeight>mid.clientHeight*0.92||big.scrollWidth>mid.clientWidth)){f-=4;big.style.fontSize=f+'px'}});
}

/* ── 사진 통역 (Gemini) ── */
/* ── 사진·PDF 공통: 불러오기 → 영역 자르기 → 크기 줄이기 (사진, 스캔 PDF, 자료 사진이 모두 이 함수들을 씀) ── */
async function loadSrc(blob){ // 사진 파일 → {img,w,h}. 휴대폰이 기록한 회전 정보를 반영
  if(window.createImageBitmap){try{const img=await createImageBitmap(blob,{imageOrientation:'from-image'});return {img,w:img.width,h:img.height}}catch{}}
  const url=URL.createObjectURL(blob);
  try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(Error('사진을 열지 못했습니다'));i.src=url});return {img:im,w:im.naturalWidth,h:im.naturalHeight}}
  finally{URL.revokeObjectURL(url)}
}
// rect: 0~1 비율 {x,y,w,h} (없으면 전체) → 긴 변 maxSide 이하 JPEG 데이터 주소. 원본은 건드리지 않음
function cropJpeg(src,rect,maxSide=PH_SIDE,q=PH_QUALITY){
  const r=rect||{x:0,y:0,w:1,h:1},sx=Math.round(r.x*src.w),sy=Math.round(r.y*src.h),sw=Math.max(1,Math.min(src.w-sx,Math.round(r.w*src.w))),sh=Math.max(1,Math.min(src.h-sy,Math.round(r.h*src.h)));
  const k=Math.min(1,maxSide/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src.img,sx,sy,sw,sh,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
const PH_SIDE=1280,PH_QUALITY=0.82,REF_SIDE=1600;
const PH_SIZES=[[1280,'보통 1280'],[1600,'작은 글씨 1600'],[2000,'아주 작은 글씨 2000']];
async function shrinkImage(file,max=PH_SIDE,q=0.85){const src=await loadSrc(file);try{return cropJpeg(src,null,max,q)}finally{src.img.close?.()}}
function pickFiles(accept,multiple,done,capture){const f=document.createElement('input');f.type='file';f.accept=accept;if(multiple)f.multiple=true;if(capture)f.setAttribute('capture','environment');f.onchange=()=>done([...f.files]);f.click()}
const newItem=file=>({file,url:file.type.startsWith('image/')?URL.createObjectURL(file):null,sel:true,rect:null,res:PH_SIDE});

/* 영역 선택기: 손가락으로 네모 그리기 · 안쪽을 끌면 이동 · 변·모서리를 끌면 크기 조절 */
function cropPicker(parent,src,rect,onChange){
  const wrap=node('div','crop-wrap','',parent),cv=node('canvas','crop-cv','',wrap),k=Math.min(1,1100/Math.max(src.w,src.h));
  cv.width=Math.round(src.w*k);cv.height=Math.round(src.h*k);
  const g=cv.getContext('2d'),base=document.createElement('canvas');base.width=cv.width;base.height=cv.height;base.getContext('2d').drawImage(src.img,0,0,cv.width,cv.height);
  let r=rect?{...rect}:null,drag=null;const MIN=0.03,HIT=24;
  const draw=()=>{
    g.drawImage(base,0,0);if(!r)return;
    const x=r.x*cv.width,y=r.y*cv.height,w=r.w*cv.width,h=r.h*cv.height;
    g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.rect(0,0,cv.width,cv.height);g.rect(x,y,w,h);g.fill('evenodd');
    const u=Math.max(2,cv.width/320);g.strokeStyle='#2fd388';g.lineWidth=u;g.strokeRect(x,y,w,h);g.fillStyle='#2fd388';
    for(const hx of [x,x+w/2,x+w])for(const hy of [y,y+h/2,y+h])if(hx!==x+w/2||hy!==y+h/2)g.fillRect(hx-u*2.2,hy-u*2.2,u*4.4,u*4.4);
  };
  const pt=e=>{const b=cv.getBoundingClientRect();return {x:Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),y:Math.min(1,Math.max(0,(e.clientY-b.top)/b.height)),pw:b.width,ph:b.height}};
  cv.onpointerdown=e=>{
    e.preventDefault();const p=pt(e);cv.setPointerCapture(e.pointerId);drag=null;
    if(r){
      const dl=Math.abs(p.x-r.x)*p.pw,dr=Math.abs(p.x-r.x-r.w)*p.pw,dt=Math.abs(p.y-r.y)*p.ph,db=Math.abs(p.y-r.y-r.h)*p.ph;
      const nearX=p.x>r.x-HIT/p.pw&&p.x<r.x+r.w+HIT/p.pw,nearY=p.y>r.y-HIT/p.ph&&p.y<r.y+r.h+HIT/p.ph;
      const L=nearY&&dl<HIT&&dl<=dr,R=nearY&&dr<HIT&&dr<dl,T=nearX&&dt<HIT&&dt<=db,B=nearX&&db<HIT&&db<dt;
      if(L||R||T||B)drag={m:'size',L,R,T,B,o:{...r}};
      else if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h)drag={m:'move',dx:p.x-r.x,dy:p.y-r.y};
    }
    if(!drag){drag={m:'new',x0:p.x,y0:p.y};r={x:p.x,y:p.y,w:0,h:0}}
    draw();
  };
  cv.onpointermove=e=>{
    if(!drag)return;e.preventDefault();const p=pt(e);
    if(drag.m==='new')r={x:Math.min(drag.x0,p.x),y:Math.min(drag.y0,p.y),w:Math.abs(p.x-drag.x0),h:Math.abs(p.y-drag.y0)};
    else if(drag.m==='move')r={...r,x:Math.min(1-r.w,Math.max(0,p.x-drag.dx)),y:Math.min(1-r.h,Math.max(0,p.y-drag.dy))};
    else{const o=drag.o;let x1=o.x,x2=o.x+o.w,y1=o.y,y2=o.y+o.h;if(drag.L)x1=p.x;if(drag.R)x2=p.x;if(drag.T)y1=p.y;if(drag.B)y2=p.y;r={x:Math.min(x1,x2),y:Math.min(y1,y2),w:Math.abs(x2-x1),h:Math.abs(y2-y1)}}
    draw();
  };
  const end=()=>{if(!drag)return;drag=null;if(r&&(r.w<MIN||r.h<MIN))r=null;draw();onChange(r?{...r}:null)};
  cv.onpointerup=end;cv.onpointercancel=end;draw();
  return {set(v){r=v?{...v}:null;draw();onChange(v?{...v}:null)}};
}
const rectInfo=(src,rect,side)=>{const w=Math.round((rect?rect.w:1)*src.w),h=Math.round((rect?rect.h:1)*src.h),k=Math.min(1,side/Math.max(w,h));return Math.round(w*k)+'×'+Math.round(h*k)+'px로 보냄'+(rect?' · 선택한 부분만':' · 전체')};

/* ── 사진 통역 화면: 모으기 → (영역 지정) → 번역 ── */
function openPhoto(){stopSpeech();stopDictation();state.side=false;state.modal={type:'photo',stage:'collect',files:[],mode:state.mode,fg:active().code};render()}
function setStage(data,stage){data.stage=stage;data.resetScroll=true;render()}
function releasePhotoModal(data){if(refCamera?.data===data)stopRefCamera();for(const x of data.files||[])if(x.url)URL.revokeObjectURL(x.url);data.pdf?.doc?.destroy?.();data.src?.img?.close?.()}
function photoBack(data){
  const pd=data.pdf;
  if(data.stage==='crop')setStage(data,'collect');
  else if(data.stage==='pdfPage')setStage(data,'pdf');
  else if(pd?.back){const b=pd.back;releasePhotoModal(data);state.modal=b;render()}
  else if(data.stage==='pdf'){data.pdf.doc?.destroy?.();data.pdf=null;setStage(data,'collect')}
  else closeLayer();
}
function drawPhoto(body,data,actions){
  if(data.stage==='crop')return drawPhotoCrop(body,data,actions);
  if(data.stage==='pdf')return drawPdf(body,data,actions);
  if(data.stage==='pdfPage')return drawPdfPage(body,data,actions);
  if(data.stage==='load')return void node('p','tiny','PDF를 여는 중…',body);
  if(data.stage==='collect')return drawPhotoCollect(body,data,actions);
  drawPhotoResult(body,data,actions);
}
function addPhotoFiles(data,files){
  for(const f of files){
    if(isPdf(f)){openPdf(data,f);return}
    if(f.type.startsWith('image/'))data.files.push(newItem(f));
  }
  if(state.modal===data)render();
}

}
function aiGate(offline='사진·PDF 통역은 인터넷이 필요합니다.'){if(provider()!=='gemini'){notify('Gemini 키·모드가 필요합니다');return false}if(!navigator.onLine){notify(offline);return false}return true}
function drawPhotoCollect(body,data,actions){

  button('🖼 사진 고르기','action',()=>{stopRefCamera();pickFiles('image/*,application/pdf',true,fs=>{if(state.modal===data)addPhotoFiles(data,fs)})},bar).disabled=!!data.busy;
  button('📄 PDF 열기','action',()=>{stopRefCamera();pickFiles('application/pdf',false,fs=>{if(fs[0]&&state.modal===data)openPdf(data,fs[0])})},bar).disabled=!!data.busy;

  if(data.err)node('p','tiny',data.err,body);

    const sel=button(x.sel?'✓':'','ph-sel',()=>{x.sel=!x.sel;cell.classList.toggle('on',x.sel);sel.textContent=x.sel?'✓':'';count.textContent=data.files.filter(y=>y.sel).length},cell);sel.setAttribute('aria-label','번역할 사진으로 선택');
    im.onclick=()=>sel.click();
    node('div','ph-stat',x.err?'실패 · '+x.err:x.status||(x.rect?'✂ 영역 지정됨':'전체 사진'),cell);
    const mini=node('div','row-mini','',cell);
    button('✂ 영역','',()=>openCrop(data,x),mini).disabled=!!data.busy;
    if(x.rec)button('열기','',()=>openSavedPhoto(x.rec),mini);

  button('모두 선택·해제','action',()=>{const all=data.files.every(x=>x.sel);data.files.forEach(x=>x.sel=!all);render()},actions).disabled=!data.files.length;

async function openCrop(data,x){
  stopRefCamera();data.cur=x;data.src?.img?.close?.();data.src=null;setStage(data,'crop');
  try{const s=await loadSrc(x.file);if(state.modal!==data||data.cur!==x){s.img.close?.();return}data.src=s}catch(e){data.err=e.message;if(state.modal===data)setStage(data,'collect');return}
  render();
}
function drawPhotoCrop(body,data,actions){
  const x=data.cur;
  node('p','tiny faint','번역할 부분을 손가락으로 끌어 네모로 그리세요. 네모 안을 끌면 옮겨지고, 변이나 모서리를 끌면 크기가 바뀝니다. 아무것도 안 그리면 사진 전체입니다.',body);

/* 사진 한 장(또는 PDF 쪽) → 번역 → 기록. 같은 그림·같은 언어는 저장된 기록을 다시 씀 (AI 호출 없음) */
const noTextSigs=new Set();
async function translateImage(data,url,from,orig){
  const sig=hashStr(url+'|'+data.fg);
  let rec=await phFindSig(sig);
  if(rec)return {...rec,reused:true};
  if(noTextSigs.has(sig))throw Error('글자를 찾지 못했습니다');
  const blocks=await photoTranslate(url,data.fg);
  if(!blocks.length){noTextSigs.add(sig);throw Error('글자를 찾지 못했습니다')}
  rec={id:null,img:url,blocks,fg:data.fg,mode:data.mode,sig,from,orig:orig&&orig.size<=15e6?orig:undefined};
  await savePhoto(rec);return rec;
}
async function runPhotoItems(data,items){
  if(data.busy||!aiGate())return;
  items=items||data.files.filter(x=>x.sel);if(!items.length)return notify('번역할 사진을 선택하세요.');
  stopRefCamera();stopSpeech();data.busy=true;data.err='';const done=[];
  for(const [i,x] of items.entries()){
    if(state.modal!==data)break; // 화면을 닫으면 남은 사진은 보내지 않음
    x.status='번역 중…';x.err='';data.progress=(i+1)+' / '+items.length;render();
    let src;
    try{src=await loadSrc(x.file);const rec=await translateImage(data,cropJpeg(src,x.rect,x.res),null,x.file);
      x.rec=rec.id;x.status=rec.reused?'이미 번역함 · 저장본 사용':'완료';done.push(rec);
      if(items.length===1)updatePhotoEntries({...rec,mode:data.mode},true);
    }catch(e){x.err=e.message;x.status=''}
    finally{src?.img.close?.()}
  }
  data.busy=false;
  if(state.modal!==data)return;
  if(items.length===1&&done.length===1){state.modal=null;state.mode=data.mode;releasePhotoModal(data);render();scrollEnd();notify('사진과 번역을 저장했습니다. 📷 버튼이나 사진 통역 기록에서 다시 열 수 있습니다.');return}
  render();notify(done.length+'장 번역·저장했습니다.'+(done.length<items.length?' 실패한 사진만 다시 번역할 수 있어요.':''));
}
const isPdf=f=>/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);
function openRefPdf(back,file){ // 자료 올리기: PDF는 전체를 보내지 않고 쪽을 고르는 화면으로
  const d={type:'photo',stage:'load',purpose:'ref',gid:back.gid,files:[],mode:state.mode,fg:active().code,pdf:{back}};state.modal=d;openPdf(d,file);
}
function recropSaved(data){
  if(!data.orig)return;
  const f=data.orig instanceof File?data.orig:new File([data.orig],'원본.jpg',{type:data.orig.type||'image/jpeg'}),x=newItem(f);
  const d={type:'photo',stage:'collect',files:[x],mode:data.mode,fg:data.fg};state.modal=d;render();openCrop(d,x);
}

/* ── PDF: PDF.js를 필요할 때만 불러와 휴대폰 안에서 쪽 나누기·글자 뽑기·그림으로 자르기. 쪽을 고르기 전에는 AI로 아무것도 보내지 않음 ── */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return pdfjsP||(pdfjsP=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';s.crossOrigin='anonymous';
    s.onload=async()=>{const L=window.pdfjsLib;
      try{L.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await(await fetch(PDFJS+'pdf.worker.min.js')).text()],{type:'text/javascript'}))}

function parsePages(spec,n){

    const t=part.replace(/쪽|페이지|p\.?/gi,'');if(!t)continue;

/* Photos may be collected with repeated camera visits before a single submit. */
/* L26: 앱 안 카메라를 계속 열어 셔터만 눌러 여러 장 촬영. */
let refCamera=null;
function stopRefCamera(){const camera=refCamera;refCamera=null;if(!camera)return;camera.closed=true;camera.stream?.getTracks().forEach(t=>t.stop());if(camera.video)camera.video.srcObject=null}
async function startRefCamera(data){
  stopRefCamera();if(!navigator.mediaDevices?.getUserMedia){notify('이 브라우저는 연속 촬영을 지원하지 않습니다. 한 장 촬영이나 파일 선택을 사용하세요.');return}
  const camera={data,stream:null,closed:false};refCamera=camera;data.cameraError='';render();
  try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(camera.closed||refCamera!==camera||state.modal!==data){stream.getTracks().forEach(t=>t.stop());return}camera.stream=stream;render();
  }catch(e){if(refCamera===camera){stopRefCamera();data.cameraError='카메라를 열지 못했습니다. 한 장 촬영 또는 파일 선택을 사용해 주세요.';if(state.modal===data)render()}}
}
async function captureRefFrame(data,single=false){
  const camera=refCamera,video=camera?.video;if(!camera||camera.data!==data||!video?.videoWidth||data.capturing)return;
  data.capturing=true;
  try{const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.9));if(!blob)throw Error('사진을 담지 못했습니다.');
    if(refCamera!==camera||state.modal!==data)return;
    const file=new File([blob],'사진-'+Date.now()+'.jpg',{type:'image/jpeg'});data.files.push(newItem(file));
    if(single){data.capturing=false;await submitRefPhotos(data)}else render();
  }catch(e){notify(e.message)}finally{data.capturing=false}
}
function openRefPhotos(gid,capture,allowPdf){
  if(!aiGate('인터넷이 필요합니다.'))return;
  stopSpeech();state.side=false;const data={type:'refPhotos',gid,files:[],allowPdf};state.modal=data;render();if(capture)startRefCamera(data);
}
function pickRefPhotos(data,capture){
  stopRefCamera();
  pickFiles(capture?'image/*':data.allowPdf?'image/*,application/pdf':'image/*',!capture,files=>{
    if(state.modal!==data)return;
    for(const file of files){if(file.size>40e6){notify(file.name+' · 40MB까지 올릴 수 있습니다.');continue}data.files.push(newItem(file))}
    render();
  },capture);
}
function releaseRefPhotos(data){if(refCamera?.data===data)stopRefCamera();for(const x of data.files||[])if(x.url)URL.revokeObjectURL(x.url)}
async function submitRefPhotos(data){
  const todo=data.files.filter(x=>!isPdf(x.file)); // PDF는 쪽을 고른 뒤에만 보냄
  if(data.busy||!todo.length)return;stopRefCamera();data.busy=true;let success=0;const failed=[];
  for(const [i,x] of todo.entries()){
    data.status=(i+1)+' / '+todo.length+' 정리 중…';if(state.modal===data)render();
    try{const b64=(await shrinkImage(x.file,REF_SIDE)).split(',')[1];
      const extracted=await refExtract([{inline_data:{mime_type:'image/jpeg',data:b64}}],false,x.file.name);if(!refGroups.some(g=>g.id===data.gid))throw Error('대상 그룹이 삭제되었습니다.');refAdd(data.gid,'사진',extracted);success++;if(x.url){URL.revokeObjectURL(x.url);x.sent=true}
    }catch(e){x.err=e.message;failed.push(x)}
  }
  data.files=[...failed,...data.files.filter(x=>isPdf(x.file))];data.busy=false;
  if(state.modal===data){if(!data.files.length)backToRefs();else render();notify(success+'개 저장했습니다.'+(failed.length?' 실패한 '+failed.length+'개는 다시 올릴 수 있습니다.':''))}
}
function drawRefPhotos(body,data,actions){
  node('p','tiny','연속 촬영은 촬영 버튼을 누를 때마다 사진이 쌓입니다. 필요 없는 사진을 빼고 한 번에 올리세요. PDF는 통째로 보내지 않고, 쪽을 직접 골라 필요한 부분만 보냅니다.',body);
  const bar=node('div','row-btns','',body);
  button('연속 촬영','action primary',()=>startRefCamera(data),bar).disabled=!!data.busy;
  button('한 장 촬영·선택','action',()=>pickRefPhotos(data,true),bar).disabled=!!data.busy;
  button('사진·파일 선택','action',()=>pickRefPhotos(data,false),bar).disabled=!!data.busy;
  drawCameraBar(body,data,true);
  node('p','tiny',data.busy?data.status:data.files.length+'장 모았습니다.',body);
  const grid=node('div','ph-grid','',body);data.files.forEach((x,i)=>{if(x.sent)return;const item=node('div','','',grid);if(x.url){const im=node('img','','',item);im.src=x.url;im.alt='모은 사진 '+(i+1)}else node('p','tiny',x.file.name,item);
    if(isPdf(x.file))button('쪽 고르기','action primary',()=>openRefPdf(data,x.file),item).disabled=!!data.busy;
    button((i+1)+' · 빼기','action',()=>{if(x.url)URL.revokeObjectURL(x.url);data.files.splice(i,1);render()},item).disabled=!!data.busy;if(x.err)node('p','tiny',x.err,item)});
  button('사진 한 번에 올리기 ('+data.files.filter(x=>!isPdf(x.file)).length+'개)','action primary',()=>submitRefPhotos(data),actions).disabled=!!data.busy||!data.files.some(x=>!isPdf(x.file));
}

let dict=null;
function mergeResults(results){
  let out='';
  for(let i=0;i<results.length;i++){
    const t=results[i][0].transcript.trim();if(!t)continue;
    if(!out)out=t;
    else if(t.startsWith(out))out=t;
    else if(out.endsWith(t)||out.includes(t))continue;
    else out+=' '+t;
  }
  return out;
}
function stopDictation(){const d=dict;if(!d)return;d.cancel=true;dict=null;clearTimeout(d.timer);try{d.r.abort()}catch{}}
function dictateTo(area,code,btn,onChange){
  if(dict){if(dict.btn===btn){requestStop();return}stopDictation()}
  if(!SR)return notify('이 브라우저는 음성 입력을 지원하지 않습니다. 크롬이나 삼성 인터넷을 써 주세요.');
  pauseRecognizer();stopSpeech();
  const r=new SR();r.lang=localeOf(code);r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  const base=area.value.trim();
  const d=dict={r,area,code,btn,onChange,timer:null,heard:false};
  const arm=ms=>{clearTimeout(d.timer);d.timer=setTimeout(()=>{if(dict===d)requestStop()},ms)};
  r.onresult=e=>{if(dict!==d)return;d.heard=true;const t=mergeResults(e.results);area.value=base?base+' '+t:t;onChange?.();arm(6000)};
  r.onerror=e=>{if(e.error==='not-allowed'){notify('마이크 권한이 허용되지 않았습니다.')}else if(e.error!=='no-speech'&&e.error!=='aborted')notify('음성 입력 오류: '+e.error)};
  r.onend=()=>finishDictation(d);
  try{r.start();setVoiceLabel(btn,true);arm(9000)}catch(err){dict=null;notify(err.message)}
}
function requestStop(){const d=dict;if(!d)return;clearTimeout(d.timer);try{d.r.stop()}catch{}setTimeout(()=>finishDictation(d),1500)}
function finishDictation(d){
  if(d.done)return;d.done=true;clearTimeout(d.timer);
  if(dict===d)dict=null;
  if(d.btn.isConnected)setVoiceLabel(d.btn,false);
  if(!d.cancel&&d.heard)aiPolish(d.area,d.code,d.onChange);
}

   task: 사용량 기록용 이름 · dedupe: 똑같은 요청이 진행 중이면 새로 보내지 않고 그 답을 같이 씀 */
const GEM_BASE='https://generativelanguage.googleapis.com/v1beta/';
const gemUrl=m=>`${GEM_BASE}models/${m}:generateContent?key=${encodeURIComponent(load('ai_key').trim())}`;
const gemText=j=>(j.candidates?.[0]?.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('').trim();
const gemModels=()=>[...new Set([gemModel(),'gemini-3.8-flash',GEM_FALLBACK])];

const gemInflight=new Map();
function gemPost(m,body,{ms=25000,signal,task,entry,dedupe}={}){
  const run=async()=>{
    const res=await fetch(gemUrl(m),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:signal||AbortSignal.timeout(ms),_task:task,_entryGemini:entry});
    const j=await res.json().catch(()=>({}));
    if(!res.ok)throw Object.assign(Error(j.error?.message||('Gemini 오류 '+res.status)),{status:res.status});
    return j;
  };
  if(!dedupe)return run();
  const k=m+hashStr(JSON.stringify(body));let pr=gemInflight.get(k);
  if(!pr){pr=run().finally(()=>gemInflight.delete(k));gemInflight.set(k,pr)}

}
const gemFatal=e=>e.stop||[400,401,403,429].includes(e.status); // 모델을 바꿔도 소용없는 오류 (키·한도·잘못된 요청)
// 모델을 차례로 시도 (무겁지 않은 요청용). 키·한도·요청 오류는 다른 모델로 다시 보내지 않고 바로 멈춤
async function gemEach(fn){
  let err;

/* 번역 결과 저장: 같은 글·같은 언어·같은 번역 방식·같은 용어 자료면 AI를 다시 부르지 않고 저장된 번역을 씀 (최근 300개) */
const TR_CACHE_MAX=300,TR_CACHE_CHARS=300000;
let trCache=loadJSON('tr_cache_v1',{}),trCacheTimer=0;
const trKey=(kind,text,src,target,mode)=>kind+hashStr([src,target,mode,hashStr(glossOut()),text].join('\u0001'));

function trPut(kind,text,src,target,mode,val){
  const k=trKey(kind,text,src,target,mode);delete trCache[k];trCache[k]=val;
  const keys=Object.keys(trCache);while(keys.length>TR_CACHE_MAX)delete trCache[keys.shift()];
  clearTimeout(trCacheTimer);trCacheTimer=setTimeout(()=>{let s=JSON.stringify(trCache);while(s.length>TR_CACHE_CHARS){delete trCache[Object.keys(trCache)[0]];s=JSON.stringify(trCache)}store('tr_cache_v1',s)},2500);

function splitText(text,max=380){
  const parts=text.replace(/\r/g,'').split(/(?<=[.!?。！？\n])\s*/);
  const out=[];let cur='';
  for(let p of parts){
    while(p.length>max){if(cur){out.push(cur);cur=''}out.push(p.slice(0,max));p=p.slice(max)}
    if((cur+' '+p).length>max){if(cur)out.push(cur);cur=p}else cur=cur?cur+' '+p:p;
  }
  if(cur.trim())out.push(cur);
  return out.map(s=>s.trim()).filter(Boolean);
}

function gemClean(raw,target){

  try{const v=JSON.parse(j);if(v&&typeof v.t==='string')o=v.t.trim()}catch{const m=j.match(/"t"\s*:\s*"((?:[^"\\]|\\.)*)"/);if(m)try{o=JSON.parse('"'+m[1]+'"').trim()}catch{}}

  const c=j.candidates?.[0],out=gemText(j),cut=c?.finishReason==='MAX_TOKENS';
  if(!out)throw Error(cut?'답이 너무 길어 끊겼습니다':'빈 응답');

}

  const j=await up.json().catch(()=>({}));if(!up.ok||!j.file)throw Error(j.error?.message||('파일 올리기 실패 '+up.status));

const FILLER_RULE=`생각할 때 내는 소리(아, 음, 어, 에, 흠, えーと, えっと, えー, あのー, うーん, um, uh, er, hmm, 嗯, 呃, 등)는 빼고 적으세요. \"그\", \"저기\", \"あの\", \"那个\"처럼 뜻이 있을 수 있는 말은 같은 말을 되풀이하며 머뭇거릴 때만 빼세요.`;
function stripFillers(t){
  let o=' '+String(t||'')+' ';
  const B='(^|[\\s,.!?。、，！？…])',E='(?=[\\s,.!?。、，！？…]|$)';
  o=o.replace(new RegExp(B+'(?:아+|음+|어+|에{2,}|으음+|흐음|흠+|으+)[~〜ー…]*[,，、]?'+E,'g'),'$1'); // 한국어
  o=o.replace(new RegExp(B+'(?:그|저기)(?:[\\s,.…~]+(?:그|저기))+[,，、]?'+E,'g'),'$1'); // "그 그", "저기 저기" (되풀이만)
  o=o.replace(/(?:えーと|えっと|ええと|ええっと|えー+|あのー+|あの〜|うーん|うん〜|ん〜)[、,…]*/g,''); // 일본어
  o=o.replace(/(?:あの[、,\s]*){2,}/g,'');
  o=o.replace(/\b(?:u+m+|u+h+|e+r+m*|hm+)\b[,.]*/gi,''); // 영어
  o=o.replace(/(?:嗯+|呃+)[，,、…]*/g,''); // 중국어
  o=o.replace(/(?:那个[，,、\s]*){2,}|(?:这个[，,、\s]*){2,}/g,'');
  o=o.replace(/\s{2,}/g,' ').replace(/^[\s,，、…]+/,'').trim();
  return o||String(t||'').trim();
}
// 같은 말이 바로 붙어 두 번 나오면 하나만 ("독단적으로 독단적으로" → "독단적으로")

async function geminiCleanTranslate(text,src,target,ctx,timing,opt={}){
  const tier=opt.tier||gemTier();

  const fixed=compactRefHint(text,ctx).trim();
  // V0: 번역 정확도에 영향 없는 군더더기를 뺀 짧은 지시문 (분야 설명·교정 예시·JSON 설명은 뺌 — 답 형식은 responseSchema로 정함)
  const sys=`${nameOf(src)}→${nameOf(target)} 통역.
s: 받아쓴 [글] 교정(오인식·맞춤법). 추임새(아·음·えーと·um)와 같은 말 반복 삭제(그·저기·あの는 되풀이하며 머뭇거릴 때만). 고쳐 말한 곳은 최종 표현만. 의미·숫자·고유명사 유지, 숫자 범위는 ~. 문제없으면 그대로.
t: s를 현지인이 바로 알아듣게 자연스럽게 번역. 설명·주석·후보 없이 번역문만.`
    +(ctx||fixed?`\n[${[ctx&&'앞',fixed&&'용어'].filter(Boolean).join('·')}]는 참고만, 번역·출력 금지.`:'')+(fixed?' [용어]의 A→B는 B로 번역.\n'+fixed:''); // 앞 문장·용어가 있을 때만 그 안내를 붙임
  const user=(ctx?`[앞]\n${ctx}\n\n`:'')+`[글]\n${text}`;
  const models=[GEM_TIERS.find(x=>x[0]===tier)?.[2]||gemModel()]; // L18: 선택 모델 한 번만, 실패 뒤 Gemini 재번역 금지
  for(const m of models){
    const controller=new AbortController(),cancel=()=>controller.abort();
    if(opt.signal?.aborted)controller.abort();else opt.signal?.addEventListener('abort',cancel,{once:true});
    const timeout=setTimeout(cancel,(tier==='accurate'?20000:tier==='balanced'?16000:12000)+Math.min(240000,text.length*40)); // V2: 5분·10분 묶음처럼 긴 글은 기다리는 시간도 길게 (최대 4분 더)
    try{

    }catch(e){if(timing&&timing.compareStarted!=null&&!timing.compareComplete){compareFinish(timing)}latencyMark(timing,'response');if(timing)timing.marks.requestFailed=1}

}

/* V0: 받아쓴 말을 이어 붙일 때 바로 앞 말과만 비교 — 똑같이 다시 온 말은 버리고, 앞 말을 고쳐·늘려 다시 보낸 건 바꿔 넣고, 겹친 앞부분만 잘라 냄.
   (예전처럼 지난 문장들과 비교해 버리지 않으므로 나중에 같은 말을 다시 해도 빠지지 않음) */
function addTurnPart(turn,text){
  const prev=turn.parts[turn.parts.length-1]??turn.prevPart,np=nrm(prev||''),nt=nrm(text);
  if(np&&nt){

    if(turn.parts.length&&np.length>=4&&nt.startsWith(np)){turn.parts[turn.parts.length-1]=text;return}
    for(let k=Math.min(np.length,nt.length);k>=4;k--)if(np.endsWith(nt.slice(0,k))){rlog('앞 말과 겹친 부분 잘라 냄',prev,text);text=dropChars(text,k);break}

/* V2: 듣기 모드 묶음 시간 — 언어 버튼 옆 버튼으로 20초·40초·1분·5분·10분 중 고름 (휴대폰에 저장, 듣는 중에 바꾸면 바로 적용).

/* V1: 크롬은 1분 안팎이면 말하는 도중에도 받아쓰기를 끊음 → 켠 지 40초가 지나 말이 0.6초 쉬면 앱이 먼저 끊고 바로 다시 켬 (대화·듣기 공통) */

/* V3: 받아쓰기 정리 기록 — 앱이 받아쓴 말을 버리거나 바꿔 넣을 때만 남김 (휴대폰 안에만, 최근 80개).
   설정 → 고급 → "받아쓰기 정리 기록"에서 복사해 보내 주면 원인을 찾을 수 있음. Gemini로는 보내지 않음 */

  const e={t:new Date().toTimeString().slice(0,8),k:kind,a:cut(a),b:cut(b)},last=recogLog[recogLog.length-1];
  if(last&&last.k===e.k&&last.a===e.a&&last.b===e.b)return; // 같은 내용이 계속 오면 한 번만
  recogLog.push(e);if(recogLog.length>80)recogLog.splice(0,recogLog.length-80);

/* V3: 크롬 받아쓰기 결과 이어 붙이기
   ① 크롬이 같은 말을 고쳐서 처음부터 다시 보내면(앞부분이 절반 넘게 같으면) 뒤에 또 붙이지 않고 바꿔 넣음 → 같은 말이 쌓이지 않게
   ② 안드로이드 크롬은 문장 하나가 확정되면 결과 목록을 비우고 새로 시작함 → 그 전에 확정된 말을 따로 모아 둠 → 새로 한 말이 빠지지 않게
      (확정 안 된 중간 결과만 바뀐 것은 고쳐 보낸 말이므로 모아 두지 않음) */
const nrm=t=>String(t||'').replace(/[\s.,!?。、，！？…]+/g,'');

  if(nb.startsWith(na)||(na.length>=4&&nb.includes(na)))return b; // 늘어난 말

  if(nb.length>=4&&na.slice(-(nb.length+10)).includes(nb)){if(log)rlog('같은 말 다시 옴 → 버림',a,b);return a}

  if(head.length>=4)for(let p=na.indexOf(head);p>=0;p=na.indexOf(head,p+1)){ // 고쳐 보낸 말
    const rest=na.slice(p);let cp=0;while(cp<rest.length&&cp<nb.length&&rest[cp]===nb[cp])cp++;
    if(cp>=Math.max(6,rest.length*0.5)){if(log)rlog('고쳐 보낸 말 → 바꿔 넣음',a,b);return (keepChars(a,p)+' '+b).trim()}
  }

    // 이미 보낸 말의 철자만 고친 것은 새 말로 보내지 않음
    if(same>=Math.max(3,consumed.length*.65))return n.length>consumed.length?drop(current,consumed.length):'';

    if(state.mic){if(gotFin||gotAudio){micRetry=0;resumeRecognizer()}else scheduleMicRetry(micLastError||'음성 인식 결과 없이 종료됨')}
  };
  try{r.start();micStartingAt=Date.now();micWatchdog=setTimeout(()=>{if(state.recognizer!==r||!state.mic)return;state.recognizer=null;try{r.abort()}catch{}scheduleMicRetry('마이크 시작 응답 없음 (8초)')},8000)}catch(e){state.recognizer=null;scheduleMicRetry(e.message);updateMic()}
}

/* ── 전체 화면 / 설치 ── */
function toggleFullscreen(){
  const d=document;
  if(d.fullscreenElement)d.exitFullscreen?.();
  else (d.documentElement.requestFullscreen?.()||Promise.reject()).catch(()=>notify('이 브라우저에서는 전체 화면을 지원하지 않습니다.'));
}
document.addEventListener('fullscreenchange',()=>{if(state.page==='main'&&!state.modal)render()});
let installEvent=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;if(state.modal?.type==='settings')render()});
async function installApp(){if(!installEvent)return notify(isIOS?'사파리 아래 공유 버튼(□↑) → "홈 화면에 추가"를 눌러 주세요.':'크롬 오른쪽 위 메뉴(⋮) → "앱 설치"(또는 "홈 화면에 추가")를 눌러 주세요.');installEvent.prompt();await installEvent.userChoice.catch(()=>{});installEvent=null;render()}
window.addEventListener('appinstalled',()=>notify('설치되었습니다. 홈 화면의 "여행 통역" 아이콘으로 여세요.'));
if('serviceWorker'in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update()).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||state.page!=='home')return;reloaded=true;location.reload()});
}


window.addEventListener('offline',()=>{if(state.page==='main')render()});
window.addEventListener('online',()=>{if(state.page==='main')render()});
window.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('.confirm-back')){$('.confirm-back').remove();return}if(state.modal||state.side)closeLayer();else if(state.page==='main')goHome()});
render();

</script>
