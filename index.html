<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#29865c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 통역">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<title>여행 통역</title>
<style>
/* ── 테마 (설정에서 바꿈) ── */
#app{--accent:#29865c;--accent2:#2378c9;--bg:#fff;--surface:#f4f8f6;--text:#16221c;--muted:#6e7c76;--line:#e6ece9;--ko:#e4f4e9;--fg:#f0f2f3;--blue:#2479b9;--radius:16px;--font:system-ui,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif}

*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.modal-content,.drawer,.transcript,.select-pop{overflow-x:hidden!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:#f2f5f4;position:fixed;inset:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #177bc0;outline-offset:3px}
svg{display:block}
#app{--app-h:100dvh;width:100%;height:var(--app-h);max-width:750px;margin:auto;background:var(--bg);color:var(--text);font-family:var(--font);position:relative;overflow:hidden}

/* ── 첫 화면 ── */
.home{height:var(--app-h);overflow:hidden;touch-action:manipulation;position:relative;background:#456 center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(46px + env(safe-area-inset-bottom))}
.home:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003,transparent 40%,#0006)}
.lang{position:relative;border:1px solid #fff9;background:#fffffff0;color:#1e3038;border-radius:40px;padding:13px 26px;font-size:19px;box-shadow:0 4px 16px #0004}
.home-tip{position:relative;color:#fff;font-size:15px;margin-top:16px;text-shadow:0 1px 4px #000c}
.select-pop{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#fff;color:#1e3038;border-radius:18px;padding:8px;width:min(92vw,340px);max-height:58vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:2px;z-index:15;box-shadow:0 8px 40px #0005}
.select-pop button{display:block;width:100%;border:0;background:white;padding:12px 10px;text-align:left;border-radius:10px;font-size:15px}.select-pop button.on{background:#e3f4e9;font-weight:700}

/* ── 본 화면 ── */
.screen{display:flex;flex-direction:column;height:var(--app-h);overflow:hidden;--acc:var(--accent)}
.screen.listen{--acc:var(--accent2)}
.top{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;padding:calc(22px + env(safe-area-inset-top)) 10px 10px;border-bottom:1px solid var(--line)}
.top-left{justify-self:start}.top-right{justify-self:end;display:flex}
.home-btn{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 9px;font-size:14px;font-weight:650;white-space:nowrap}
.mode-wrap{display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.moon-btn{border:0;background:transparent;font-size:16px;padding:4px 2px;opacity:.8;line-height:1}
.mode{font-size:21px;font-weight:780;color:var(--acc);border:none;background:none;padding:4px;white-space:nowrap}
.icon-btn{border:0;background:none;padding:7px;color:var(--muted);border-radius:10px}
.listen-preview{display:flex;align-items:center;gap:7px;flex-shrink:0;min-height:30px;padding:5px 16px;border-bottom:1px solid #f5e7ec;color:var(--text);background:#fff5f8;font-size:14px;line-height:1.4}
.listen-preview small{flex-shrink:0;color:var(--muted);font-size:11px}.listen-preview span{display:block;min-width:0;flex:1;overflow:hidden;white-space:nowrap}
.listen-row .ctrls{flex-wrap:wrap}
.transcript{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 18px}
.hint{color:var(--muted);text-align:center;margin:13vh 0 0;font-size:15px;line-height:1.8;white-space:pre-line}
.hint svg{margin:0 auto 10px}
.pair{margin:0 0 15px;display:flex;flex-direction:column;gap:6px}
.bubble{position:relative;line-height:1.55;max-width:94%;border-radius:var(--radius);padding:12px 15px 13px;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer}
.bubble.has-edit{padding-right:36px;padding-bottom:17px}
.bubble.ko{background:var(--ko);align-self:flex-start}
.bubble.foreign{background:var(--fg);align-self:flex-end}
.bubble.fail{background:#fff0e0;color:#8a4b12}
.bubble .edit{position:absolute;right:4px;bottom:2px;min-width:30px;min-height:30px;font-size:15px;color:var(--muted);border:0;background:transparent}
.listen-row{padding:12px 14px;background:var(--surface);border-radius:var(--radius);margin-bottom:9px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer}
.listen-row .orig{display:block;font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}

/* 아래 한 줄 */
.bar{border-top:1px solid var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}
.bar-left{justify-self:start;display:flex;gap:5px}.bar-right{justify-self:end;display:flex;gap:4px}
.sbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:48px;height:50px;padding:3px 5px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--text)}
.sbtn span{font-size:10px;line-height:1.1;white-space:nowrap;color:var(--muted)}
.sbtn.off{opacity:.55}
.sbtn.wide span{font-size:11px}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.mic{position:relative;border:0;border-radius:50%;width:62px;height:62px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#a9b6b2,#8d9a96);box-shadow:0 4px 12px #0002}
.mic.on{background:var(--acc)}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:.5;animation:ring 1.8s ease-out infinite}
.mic.on::after{animation-delay:.9s}
.mic.talk{background:#d9962f}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.55);opacity:0}}
.mic-state{font-size:10px;color:var(--muted);white-space:nowrap}
.font-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:50px;font-weight:800;font-size:16px;line-height:1;padding:0}
.font-btn small{display:block;font-size:8px;font-weight:500;margin-top:3px;color:var(--muted)}

/* 서랍 */
.side-tab{position:absolute;top:45%;right:0;transform:translateY(-50%);width:24px;height:84px;border-radius:9px 0 0 9px;border:0;background:var(--accent);color:#fff;font-size:14px;z-index:3}
.drawer{position:absolute;top:0;bottom:0;right:0;width:min(84vw,320px);z-index:6;box-shadow:-7px 0 25px #0003;background:var(--bg);padding:calc(22px + env(safe-area-inset-top)) 16px 18px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.overlay{position:absolute;inset:0;background:#0005;z-index:5}
.drawer-close{float:right;background:none;border:0;font-size:24px}
.drawer h3{margin:18px 0 6px}
.drawer-tip{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.drawer-item{width:100%;padding:13px 12px;text-align:left;background:var(--surface);border:0;border-radius:12px;margin-bottom:8px;font-weight:700}
.drawer-item small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-item.strong{background:var(--accent);color:#fff}.drawer-item.strong small{color:#ffffffd0}

/* 창 */
.modal{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
.modal-head{display:flex;align-items:center;gap:8px}
.modal-head h2{font-size:19px;margin:0 0 0 auto}
.plain{border:0;background:none;padding:9px;font-size:18px}
.ai-badge{display:none;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff;background:#7b4ed6;border-radius:14px;padding:5px 10px}
.ai-badge.show{display:flex}
.ai-badge i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.modal-content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding-top:16px}
.enlarge-body{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.sub-text{font-size:17px;color:var(--muted);margin-bottom:14px}
.big-text{font-size:clamp(27px,8vw,52px);font-weight:700;line-height:1.5;overflow-wrap:anywhere;transition:transform .2s;align-self:flex-start}
.big-text.rotated{transform:rotate(180deg)}
.tap-tip{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
.action{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.primary{background:var(--blue);color:#fff;border:0}
.danger{background:#c0392b;color:#fff;border:0}
.editor{width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:18px;line-height:1.5;background:var(--bg)}
.voice-row{display:flex;gap:8px;margin:10px 0 4px}
.voice-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.voice-btn.on{background:#c0392b}
.voice-btn small{font-weight:400;font-size:12px;opacity:.9}
.go-btn{flex:0 0 auto;padding:14px 18px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-size:16px;font-weight:700}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row-btns .action{flex:1;min-width:0;white-space:nowrap;font-size:14px;padding:11px 8px}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.tiny{font-size:12px;color:var(--muted);line-height:1.6}
.notice{position:absolute;left:14px;right:14px;bottom:120px;z-index:30;background:#243f37;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 3px 15px #0003;font-size:13px}
.field{display:block;margin:12px 0 5px;font-size:13px;color:var(--muted)}
.text-field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sec{border-top:1px solid var(--line);padding:14px 0 6px;margin-top:10px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.sec h4{margin:0 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.dl-row{display:flex;align-items:center;gap:8px;padding:7px 0}
.dl-row b{min-width:70px}.dl-row span{flex:1;font-size:12px;color:var(--muted)}
.dl-row .action{padding:8px 12px;font-size:14px}
.phrase{width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:11px 13px;margin-bottom:7px}
.phrase small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.confirm-back{position:absolute;inset:0;background:#0006;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-box{background:var(--bg);border-radius:18px;padding:22px 20px 16px;width:min(100%,330px);box-shadow:0 10px 40px #0005}
.confirm-box p{white-space:pre-line;margin:0 0 18px;font-size:17px;line-height:1.5}
.confirm-box .actions{justify-content:flex-end}
.offline-banner{padding:6px 15px;background:#ffe7c6;color:#6b4300;font-size:12px;text-align:center}
/* ── v5 추가 ── */
.bubble .ctrls{display:flex;justify-content:flex-end;gap:2px;margin:4px -8px -6px 0}
.bubble .ctrl,.listen-row .ctrl{border:0;background:transparent;color:var(--muted);opacity:.65;min-width:32px;min-height:30px;border-radius:8px;font-size:14px;font-weight:700;display:grid;place-items:center}
.bubble .ctrl.on,.listen-row .ctrl.on{opacity:1;color:var(--accent)}
.rate-m{display:none;align-items:center;gap:3px;margin-right:2px;opacity:.8;pointer-events:none}
.rate-m.on{display:inline-flex}
.listen-row .ctrl-left .rate-m{display:inline-flex}
.rate-m i{width:5px;height:18px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.rate-m i:after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h,40%);background:var(--accent);transition:height .4s}
.rate-m b{font-size:10px;font-weight:500;color:var(--muted);opacity:.75}
.listen-row{position:relative}.listen-row.preview{color:var(--muted)}.listen-row.preview:after{content:'미리 보기 · 문장이 끝나면 바뀜';display:block;font-size:11px;opacity:.7;margin-top:4px}.listen-row .rate-m{position:absolute;right:8px;top:8px}
.bubble .ctrl.edit-ctrl,.listen-row .ctrl.edit-ctrl{font-size:15px;font-weight:400}
.pron-note{font-size:.85em;opacity:.7}
.faint{opacity:.65;font-weight:400;font-size:11px}
.photo-prev{display:block;max-width:100%;max-height:200px;margin:12px auto 0;border-radius:12px}
.photo-out{margin-top:12px;padding:14px;border-radius:14px;background:var(--surface)}
.photo-tr{font-size:20px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.photo-orig{margin-top:10px;font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.pron{display:block;font-size:.72em;color:var(--muted);margin-top:4px;line-height:1.45}
.bubble .fixing{display:block;font-size:12px;color:#7b4ed6;opacity:.75;margin-top:4px}
.live{align-self:flex-start;max-width:94%;border:1.5px dashed var(--line);border-radius:var(--radius);padding:10px 14px;color:var(--muted);font-size:17px;margin-bottom:12px;white-space:pre-wrap}
.live b{display:block;font-size:11px;font-weight:600;margin-bottom:3px}
.pending{border:1.5px solid var(--accent);background:var(--surface);border-radius:var(--radius);padding:12px 14px 10px;margin-bottom:12px;position:relative;overflow:hidden}
.pending .ptext{font-size:18px;line-height:1.5;white-space:pre-wrap}
.pending .prow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.pending .prow button{border:0;border-radius:12px;padding:9px 14px;font-weight:700}
.pending .pfix{background:var(--bg);border:1px solid var(--line)!important}
.pending .psend{background:var(--blue);color:#fff}
.pending .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.sbtn,.font-btn{transition:transform .1s,background .2s}
.sbtn:active,.font-btn:active{transform:scale(.92)}
.sbtn.m-ko{background:#e2f4e8;border-color:#bfe2cb}
.sbtn.m-foreign{background:#e1edfc;border-color:#c0d6f3}
.sbtn.m-auto{background:#eee5fb;border-color:#d6c6f2}
.sbtn.m-both{background:#fff2d9;border-color:#f1d9a6}
.flash{animation:flash .45s ease-out}
@keyframes flash{0%{background:#cfe9ff;transform:scale(.92)}100%{transform:scale(1)}}
.mic.on.l-ko{background:#d9f1e2;color:#1d7a4b}
.mic.on.l-foreign{background:#dceafc;color:#1f5fa8}
.mic.on.l-ko::before,.mic.on.l-ko::after{border-color:#2f9e63}
.mic.on.l-foreign::before,.mic.on.l-foreign::after{border-color:#2f78c9}
.ai-state{font-size:9px;color:var(--muted);opacity:.7;white-space:nowrap}
.ai-state.on{color:#7b4ed6;opacity:.85}
.ai-state{display:block;font-size:14px!important;font-weight:600;text-align:center;padding:7px 6px;border:1px solid currentColor;border-radius:10px;overflow:hidden;text-overflow:ellipsis}
.ai-state.tier{cursor:pointer;opacity:.95}
.listen-row.now{background:#fff3f7;box-shadow:none;font-weight:400}
.listen-row .l-orig{color:#3f9d6e;opacity:.9;line-height:1.4;margin-bottom:4px}
.ref{background:var(--surface);border:2px solid transparent;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;user-select:none}
.ref.prio{border-color:#3f9d6e;background:#3f9d6e26}.ref.off{opacity:.45}
.ref-top{display:flex;align-items:center;gap:8px}.ref-top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-k{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--line);white-space:nowrap}.ref.prio .ref-k{background:#3f9d6e;color:#fff}
.ref-x{border:0;background:transparent;font-size:15px;color:var(--muted);min-width:28px}
.ref-onoff{border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:12px;padding:3px 7px}
.ref-sum{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45;white-space:pre-wrap}
.ref-terms{font-size:12px;margin-top:6px;line-height:1.5;color:#3f9d6e}
.side-tabs{position:absolute;right:0;top:45%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:3}
.side-tab2{width:26px;height:108px;border:0;border-radius:9px 0 0 9px;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:-2px 2px 8px #0002}
.side-tab2 i{font-style:normal;font-size:11px;opacity:.85}.side-tab2 span{font-size:11px;font-weight:700;writing-mode:vertical-rl;letter-spacing:2px}
.st-notes{background:#dce8f6;color:#4c719f}.st-refs{background:#e0efe6;color:#517b64}
.top-left{display:flex;gap:4px;align-items:center;min-width:0}.top-left .home-btn{padding:6px 7px;font-size:13px}.home-btn.play-all{color:#2e9b62;border-color:#2e9b6266}.home-btn.play-all.on{background:#2e9b62;color:#fff}
.pa-rec{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 10px}
.refs-drawer .drawer-tip{margin-bottom:10px}
.ref-busy{font-size:13px;background:#fdf1dc;border-radius:10px;padding:8px 10px;margin:0 0 10px}.ref-busy.err{background:#fbe6e6}
.rg{border-radius:12px;padding:6px 8px 8px;margin-bottom:10px;color:#1d2a35;border:2px solid transparent}.rg.on{border-color:#2e9b6255}
.rg:not(.on) .rg-name b{opacity:.55}
.rg-head{display:flex;align-items:center;gap:4px}
.rg-arrow,.rg-edit,.ri-edit{border:0;background:transparent;font-size:16px;min-width:30px;min-height:34px;color:#1d2a35}
.rg-name{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:4px 2px;color:#1d2a35}
.rg-name b{display:flex;align-items:center;gap:5px;font-size:16px;min-width:0;overflow-wrap:anywhere}.rg-name small{display:block;flex-shrink:0;white-space:nowrap;font-size:11px;opacity:.7;margin-top:0}
.rg-name .rg-toggle-dot{font-size:18px;line-height:1;flex-shrink:0}
.rg-arrow{font-size:20px;min-width:34px}
.ri{display:flex;align-items:center;gap:6px;background:#ffffffb0;border-radius:9px;padding:7px 4px 7px 8px;margin-top:6px;border:2px solid transparent;user-select:none;cursor:pointer}
.ri:not(.on){opacity:.5}.ri.dim{opacity:.5}.ri.prio{border-color:#2e9b62;background:#dff3e7;opacity:1}
.ri-k{font-size:10px;padding:2px 5px;border-radius:5px;background:#0000000f;white-space:nowrap}.ri.prio .ri-k{background:#2e9b62;color:#fff}
.ri-t{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg-add{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.rg-addb{border:1px dashed #0003;background:#ffffff80;border-radius:9px;padding:5px 0;font-size:16px;color:#1d2a35}.rg-addb small{display:block;font-size:9px;margin-top:1px}
.rg-colors{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}.rg-color{width:36px;height:36px;border-radius:50%;border:2px solid #0001}.rg-color.on{border:3px solid #2e9b62}

  }

   켜 둔 자료의 용어는 대화·듣기 모드 모두에 참고. 🟩 우선 자료(원고) 글 전체는 듣기 모드에서만 참고 */

function refHint(max,full){
  const on=activeRefs();if(!on.length)return '';
  let out='';
  if(full){
    const ps=on.filter(r=>r.prio&&(r.text||r.sum));
    if(ps.length){const each=Math.round(max*0.75/ps.length);
      out+=`🟩 우선 자료(원고) — 지금 이 원고를 읽거나 이 내용으로 말하고 있을 수 있습니다. 들린 말이 원고 문장과 같으면 원고의 표기·용어를 따르되, 이번 녹음에서 실제로 들리지 않은 원고 문장은 절대 쓰지 마세요.\n`+ps.map(r=>`「${r.title}」\n${String(r.text||r.sum).slice(0,each)}`).join('\n')+'\n'}
    const rest=on.filter(r=>!r.prio&&r.sum);
    if(rest.length)out+=rest.map(r=>`- ${r.title}: ${String(r.sum).replace(/\s+/g,' ')}`).join('\n').slice(0,ps.length?Math.round(max*0.25):max)+'\n';
  }
  const t=[...new Set(refTerms())].slice(0,150);if(t.length)out+=`용어·이름: ${t.join(', ')}\n`;
  return out?`\n\n[배경 자료 · 참고만, 번역하거나 그대로 옮기지 마세요]\n${out}`:'';
}

  if(!SR)return notify('이 브라우저는 실시간 받아쓰기를 지원하지 않습니다. 글을 직접 입력하거나 음성 파일을 올려 주세요.');
  stopSpeech();const session=++data.recSession;
  const rec={data,session,t0:Date.now(),timer:null,retryTimer:null,stopped:false,retries:0,r:null};
  rec.done=new Promise(resolve=>rec.resolve=resolve);refRec=rec;data.recording=true;data.err='';
  const valid=()=>state.modal===data&&data.recSession===session;
  const finish=()=>{clearInterval(rec.timer);clearTimeout(rec.retryTimer);clearTimeout(rec.drainTimer);if(refRec===rec)refRec=null;data.recording=false;rec.resolve();if(valid())render()};
  rec.finish=finish;
  function launch(){
    if(rec.stopped||!valid()){finish();return}
    const base=data.text||'',buffer=createSpeechBuffer(),r=new SR();rec.r=r;
    r.lang='ko-KR';r.continuous=true;r.interimResults=true;
    r.onresult=e=>{if(!valid()||rec.r!==r)return;rec.retries=0;const text=buffer.update(e.results);data.text=(base+(base&&text?'\n':'')+text).trim();const area=$('#refDraft');if(area){area.value=data.text;area.scrollTop=area.scrollHeight}};
    r.onend=()=>{if(rec.r!==r)return;rec.r=null;if(rec.stopped||!valid()){finish();return}rec.retryTimer=setTimeout(launch,200)};
    r.onerror=e=>{
      if(!valid()||e.error==='aborted')return;
      if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)||++rec.retries>3){data.err='받아쓰기 중단 · '+e.error+' · 받아쓴 글은 수정하고 저장할 수 있습니다.';rec.stopped=true;try{r.abort()}catch{}finish()}
    };
    try{r.start()}catch(e){data.err='마이크를 시작하지 못했습니다 · '+e.message;rec.stopped=true;finish()}
  }
  rec.timer=setInterval(()=>{const label=$('#recTime'),secs=Math.floor((Date.now()-rec.t0)/1000);if(label)label.textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')},500);
  launch();render();
}
function stopRefRec(force=false){
  const rec=refRec;if(!rec)return Promise.resolve();
  rec.stopped=true;rec.data.recording=false;clearInterval(rec.timer);clearTimeout(rec.retryTimer);
  if(!rec.r){rec.finish();return rec.done}
  if(!rec.drainTimer)rec.drainTimer=setTimeout(()=>{try{rec.r?.abort()}catch{}rec.finish()},1500);
  try{if(force)rec.r.abort();else rec.r.stop()}catch{rec.finish()}
  return rec.done;
}

function romanizeKo(text){
  const I=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
  const V=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
  const F=['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
  const FL=['','g','kk','g','n','n','n','d','r','g','m','b','s','t','p','h','m','b','s','s','ss','ng','j','ch','k','t','p',''];
  const ch=[...text];let out='';
  for(let i=0;i<ch.length;i++){

const pronInflight={};

function makePron(text,code){

/* ── 사진 통역 (Gemini) ── */
function shrinkImage(file,max=1600){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85))};im.onerror=()=>{URL.revokeObjectURL(url);rej(Error('사진을 열지 못했습니다'))};im.src=url})}
/* L13: 사진 통역 — 사진 속 글을 언어별 덩어리로 나눔 (일본어·한국어·중국어·영어가 섞인 책·안내판)
   언어마다 골라 보기·모아 듣기, 덩어리마다 원문 듣기·한국어 듣기·다른 언어로 듣기, 언어가 잘못 잡히면 바꾸기 */
const PH_CODES=['ko',...LANGS.map(l=>l.code)];
const phFlag=c=>c==='ko'?'🇰🇷':(langOf(c)?.flag||'🌐');
async function photoTranslate(dataUrl,fg=active().code){
  const key=load('ai_key').trim();
  const prompt=`이 사진에 있는 글자를 모두 읽고, 언어별 덩어리로 나누세요. 사진 읽는 순서대로, 같은 언어가 이어지는 문단·줄은 한 덩어리로 묶습니다(메뉴·목록은 항목마다 줄바꿈).
각 덩어리: lang = 그 글의 언어 코드 (${PH_CODES.join(', ')} 중 하나, 목록에 없으면 가장 가까운 것), o = 사진 속 글자 그대로, ko = 한국어 번역(lang이 ko면 빈 문자열), fg = ${nameOf(fg)} 번역(lang이 ko일 때만, 아니면 빈 문자열).
한자는 문맥으로 일본어·중국어(간체 zh-CN/번체 zh-TW)·한국어 한자어를 구분하세요. 설명 없이 JSON {"blocks":[...]}만. 글자가 없으면 {"blocks":[]}.`;
  const schema={type:'OBJECT',properties:{blocks:{type:'ARRAY',items:{type:'OBJECT',properties:{lang:{type:'STRING'},o:{type:'STRING'},ko:{type:'STRING'},fg:{type:'STRING'}},required:['lang','o']}}},required:['blocks']};
  const body={contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}},{text:prompt}]}],generationConfig:{temperature:0.2,maxOutputTokens:8192,responseMimeType:'application/json',responseSchema:schema}};
  let lastErr;
  for(const m of [...new Set([gemModel(),'gemini-3.8-flash',GEM_FALLBACK].filter(Boolean))]){
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(60000)});
      const j=await res.json();if(!res.ok)throw Error(j.error?.message||res.status);
      const out=(j.candidates?.[0]?.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('').trim();
      const v=JSON.parse(out.replace(/^```(?:json)?\s*|\s*```$/g,''));
      return (v.blocks||[]).map(b=>{const lang=PH_CODES.includes(b.lang)?b.lang:(String(b.lang||'').startsWith('zh')?'zh-CN':'en');const x={lang,o:String(b.o||'').trim(),tr:{}};
        if(lang!=='ko'&&b.ko)x.tr.ko=String(b.ko).trim();if(lang==='ko'&&b.fg)x.tr[fg]=String(b.fg).trim();return x}).filter(x=>x.o);
    }catch(e){lastErr=e}
  }
  throw lastErr||Error('사진 통역 실패');
}

async function phTr(x,code){if(code===x.lang)return x.o;if(!x.tr[code])x.tr[code]=await translate(x.o,x.lang,code);return x.tr[code]}

async function phGet(id){const db=await phDb();return new Promise((resolve,reject)=>{const q=db.transaction('photos').objectStore('photos').get(id);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function phAll(){const db=await phDb();return new Promise((resolve,reject)=>{const q=db.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>resolve(q.result.sort((a,b)=>b.at-a.at));q.onerror=()=>reject(q.error)})}
async function phDelete(id){const db=await phDb();await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});for(const list of [state.items,state.listening])for(let i=list.length-1;i>=0;i--)if(list[i].photoId===id)list.splice(i,1);saveHistory()}
function photoRecord(data){return {id:data.id,img:data.img,blocks:(data.blocks||[]).map(b=>({lang:b.lang,o:b.o,tr:{...b.tr}})),fg:data.fg||active().code,mode:data.mode||state.mode,at:data.at||Date.now()}}
async function savePhoto(data){if(!data.id)data.id='ph-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);if(!data.at)data.at=Date.now();await phStore(photoRecord(data));data.saved=true}
function photoEntries(data){return data.blocks.map((b,i)=>({original:b.o,translation:b.tr[b.lang==='ko'?data.fg:'ko']||'',source:b.lang,target:b.lang==='ko'?data.fg:'ko',photoId:data.id,photoBlock:i,createdAt:data.at,trMode:'saved',failed:false})).filter(x=>x.translation)}
function updatePhotoEntries(data,add=false){const entries=photoEntries(data);for(const list of [state.items,state.listening])for(const e of entries){const old=list.find(x=>x.photoId===e.photoId&&x.photoBlock===e.photoBlock);if(old)Object.assign(old,e)}if(add){const list=data.mode==='listen'?state.listening:state.items;for(const e of entries)if(!list.some(x=>x.photoId===e.photoId&&x.photoBlock===e.photoBlock))list.push(e)}saveHistory()}
async function syncPhotoEntry(entry){if(!entry.photoId)return;try{const r=await phGet(entry.photoId);if(!r)return;const b=r.blocks[entry.photoBlock];if(!b)return;b.o=entry.original;b.lang=entry.source;b.tr[entry.target]=entry.translation;await phStore(r)}catch{notify('대화는 고쳤지만 사진 기록에 저장하지 못했습니다.')}}
async function openSavedPhoto(id){stopSpeech();stopDictation();try{const r=await phGet(id);if(!r)return notify('사진 기록이 없습니다.');state.side=false;state.modal={type:'photo',...r,saved:true,filter:'all',view:'both'};render()}catch(e){notify('사진을 열지 못했습니다 · '+e.message)}}
function openPhotoHistory(){stopSpeech();state.side=false;state.modal={type:'photoHistory'};render()}

/* Photos may be collected with repeated camera visits before a single submit. */
/* L26: 앱 안 카메라를 계속 열어 셔터만 눌러 여러 장 촬영. */
let refCamera=null;
function stopRefCamera(){const camera=refCamera;refCamera=null;if(!camera)return;camera.closed=true;camera.stream?.getTracks().forEach(t=>t.stop());if(camera.video)camera.video.srcObject=null}
async function startRefCamera(data){
  stopRefCamera();if(!navigator.mediaDevices?.getUserMedia){notify('이 브라우저는 연속 촬영을 지원하지 않습니다. 한 장 촬영이나 파일 선택을 사용하세요.');return}
  const camera={data,stream:null,closed:false};refCamera=camera;data.cameraError='';render();
  try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(camera.closed||refCamera!==camera||state.modal!==data){stream.getTracks().forEach(t=>t.stop());return}camera.stream=stream;render();
  }catch(e){if(refCamera===camera){stopRefCamera();data.cameraError='카메라를 열지 못했습니다. 한 장 촬영 또는 파일 선택을 사용해 주세요.';if(state.modal===data)render()}}
}
async function captureRefFrame(data,single=false){
  const camera=refCamera,video=camera?.video;if(!camera||camera.data!==data||!video?.videoWidth||data.capturing)return;
  data.capturing=true;
  try{const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.9));if(!blob)throw Error('사진을 담지 못했습니다.');
    if(refCamera!==camera||state.modal!==data)return;
    const file=new File([blob],'자료사진-'+Date.now()+'.jpg',{type:'image/jpeg'});data.files.push({file,url:URL.createObjectURL(file)});
    if(single){data.capturing=false;await submitRefPhotos(data)}else render();
  }catch(e){notify(e.message)}finally{data.capturing=false}
}
function openRefPhotos(gid,capture,allowPdf){
  if(provider()!=='gemini')return notify('Gemini 키·모드가 필요합니다');if(!navigator.onLine)return notify('인터넷이 필요합니다.');
  stopSpeech();state.side=false;const data={type:'refPhotos',gid,files:[],allowPdf};state.modal=data;render();if(capture)startRefCamera(data);
}
function pickRefPhotos(data,capture){
  stopRefCamera();const f=document.createElement('input');f.type='file';f.accept=capture?'image/*':data.allowPdf?'image/*,application/pdf':'image/*';if(capture)f.setAttribute('capture','environment');else f.multiple=true;
  f.onchange=()=>{if(state.modal!==data)return;for(const file of f.files){if(file.size>18e6){notify(file.name+' · 18MB까지 올릴 수 있습니다.');continue}data.files.push({file,url:file.type.startsWith('image/')?URL.createObjectURL(file):null})}render()};f.click();
}
function releaseRefPhotos(data){if(refCamera?.data===data)stopRefCamera();for(const x of data.files||[])if(x.url)URL.revokeObjectURL(x.url)}
async function submitRefPhotos(data){
  if(data.busy||!data.files.length)return;stopRefCamera();data.busy=true;let success=0;const failed=[];
  for(const [i,x] of data.files.entries()){
    data.status=(i+1)+' / '+data.files.length+' 정리 중…';if(state.modal===data)render();
    try{let mime=x.file.type||'',b64;if(mime.startsWith('image/')){mime='image/jpeg';b64=(await shrinkImage(x.file,2000)).split(',')[1]}else{mime='application/pdf';b64=await fileB64(x.file)}
      const extracted=await refExtract(b64,mime,false,x.file.name);if(!refGroups.some(g=>g.id===data.gid))throw Error('대상 그룹이 삭제되었습니다.');refAdd(data.gid,mime==='application/pdf'?'PDF':'사진',extracted);success++;if(x.url)URL.revokeObjectURL(x.url);
    }catch(e){x.err=e.message;failed.push(x)}
  }
  data.files=failed;data.busy=false;if(state.modal===data){if(!failed.length)backToRefs();else render();notify(success+'개 저장했습니다.'+(failed.length?' 실패한 '+failed.length+'개는 다시 올릴 수 있습니다.':''))}
}
function drawRefPhotos(body,data,actions){
  node('p','tiny','연속 촬영은 촬영 버튼을 누를 때마다 사진이 쌓입니다. 필요 없는 사진을 빼고 한 번에 올리세요.',body);
  const bar=node('div','row-btns','',body);
  button('연속 촬영','action primary',()=>startRefCamera(data),bar).disabled=!!data.busy;
  button('한 장 촬영·선택','action',()=>pickRefPhotos(data,true),bar).disabled=!!data.busy;
  button('사진·파일 선택','action',()=>pickRefPhotos(data,false),bar).disabled=!!data.busy;
  if(refCamera?.data===data){const camera=refCamera,video=node('video','ref-camera','',body);video.muted=true;video.autoplay=true;video.playsInline=true;camera.video=video;if(camera.stream){video.srcObject=camera.stream;video.play().catch(()=>{})}
    const row=node('div','row-btns','',body);button('● 촬영','action primary',()=>captureRefFrame(data),row);button('이 한 장 바로 올리기','action',()=>captureRefFrame(data,true),row);button('촬영 마침','action',()=>{stopRefCamera();render()},row);
  }
  if(data.cameraError)node('p','tiny',data.cameraError,body);
  node('p','tiny',data.busy?data.status:data.files.length+'장 모았습니다.',body);
  const grid=node('div','ph-grid','',body);data.files.forEach((x,i)=>{const item=node('div','','',grid);if(x.url){const im=node('img','','',item);im.src=x.url;im.alt='모은 사진 '+(i+1)}else node('p','tiny',x.file.name,item);button((i+1)+' · 빼기','action',()=>{if(x.url)URL.revokeObjectURL(x.url);data.files.splice(i,1);render()},item).disabled=!!data.busy;if(x.err)node('p','tiny',x.err,item)});
  button('한 번에 올리기 ('+data.files.length+'개)','action primary',()=>submitRefPhotos(data),actions).disabled=!!data.busy||!data.files.length;
}

    const b=button(`📥 ${active().name} 문구 받기`,'action primary',()=>downloadPhrases(code,b,()=>render()),body);
  }
  const chips=node('div','chips','',body);chips.style.margin='10px 0 12px';
  if(!all[data.cat])data.cat=Object.keys(all)[0];
  Object.keys(all).forEach(c=>button(c,'chip'+(data.cat===c?' on':''),()=>{data.cat=c;render()},chips));
  button('＋ 문구 추가하기','drawer-item add',()=>{state.modal={type:'addPhrase',cat:data.cat};render()},body);

let dict=null;
function mergeResults(results){
  let out='';
  for(let i=0;i<results.length;i++){
    const t=results[i][0].transcript.trim();if(!t)continue;
    if(!out)out=t;
    else if(t.startsWith(out))out=t;
    else if(out.endsWith(t)||out.includes(t))continue;
    else out+=' '+t;
  }
  return out;
}
function stopDictation(){const d=dict;if(!d)return;d.cancel=true;dict=null;clearTimeout(d.timer);try{d.r.abort()}catch{}}
function dictateTo(area,code,btn,onChange){
  if(dict){if(dict.btn===btn){requestStop();return}stopDictation()}
  if(!SR)return notify('이 브라우저는 음성 입력을 지원하지 않습니다. 크롬이나 삼성 인터넷을 써 주세요.');
  pauseRecognizer();stopSpeech();
  const r=new SR();r.lang=localeOf(code);r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  const base=area.value.trim();
  const d=dict={r,area,code,btn,onChange,timer:null,heard:false};
  const arm=ms=>{clearTimeout(d.timer);d.timer=setTimeout(()=>{if(dict===d)requestStop()},ms)};
  r.onresult=e=>{if(dict!==d)return;d.heard=true;const t=mergeResults(e.results);area.value=base?base+' '+t:t;onChange?.();arm(6000)};
  r.onerror=e=>{if(e.error==='not-allowed'){notify('마이크 권한이 허용되지 않았습니다.')}else if(e.error!=='no-speech'&&e.error!=='aborted')notify('음성 입력 오류: '+e.error)};
  r.onend=()=>finishDictation(d);
  try{r.start();setVoiceLabel(btn,true);arm(9000)}catch(err){dict=null;notify(err.message)}
}
function requestStop(){const d=dict;if(!d)return;clearTimeout(d.timer);try{d.r.stop()}catch{}setTimeout(()=>finishDictation(d),1500)}
function finishDictation(d){
  if(d.done)return;d.done=true;clearTimeout(d.timer);
  if(dict===d)dict=null;
  if(d.btn.isConnected)setVoiceLabel(d.btn,false);
  if(!d.cancel&&d.heard)aiPolish(d.area,d.code,d.onChange);
}

async function downloadPhrases(code,btn,done){

function splitText(text,max=380){
  const parts=text.replace(/\r/g,'').split(/(?<=[.!?。！？\n])\s*/);
  const out=[];let cur='';
  for(let p of parts){
    while(p.length>max){if(cur){out.push(cur);cur=''}out.push(p.slice(0,max));p=p.slice(max)}
    if((cur+' '+p).length>max){if(cur)out.push(cur);cur=p}else cur=cur?cur+' '+p:p;
  }
  if(cur.trim())out.push(cur);
  return out.map(s=>s.trim()).filter(Boolean);
}

/* L8: AI가 고민·메모(※修正, 再確認 등)를 같이 내면 걸러 냄 */
const NOTE_RX=/※|修正|再確認|再确认|注[:：]|備考|备注|Note[:：]|\(?\s*(?:직역|의역|오타|타이포|タイポ|誤字|直訳|意訳)/i;
function gemClean(raw,target){
  let o=String(raw||'').trim();
  const j=o.replace(/^```(?:json)?\s*|\s*```$/g,'');
  try{const v=JSON.parse(j);if(v&&typeof v.t==='string')o=v.t.trim()}catch{const m=j.match(/"t"\s*:\s*"((?:[^"\\]|\\.)*)"/);if(m)try{o=JSON.parse('"'+m[1]+'"').trim()}catch{}}
  o=o.replace(/[（(][^（）()]*(?:※|修正|再確認|誤字|タイポ|直訳|오타|직역)[^（）()]*[）)]/g,'').trim();
  const lines=o.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const hasKo=t=>/[가-힣]/.test(t);
  const good=lines.filter(l=>!NOTE_RX.test(l)&&!(target!=='ko'&&hasKo(l)));
  const noisy=good.length!==lines.length;
  if(!good.length)return {out:'',noisy:true};
  return {out:noisy?good[good.length-1]:good.join('\n'),noisy};

      if(!turn.finished&&!drop&&!isEmptyText(text))turn.parts.push(auDedupWords(text));
      turn.live='';
      if(!turn.finished&&manualTurn===turn&&state.mic){state.interim=turn.parts.join(' ');updateLive()}
      return;
    }
    if(!state.recognizer||state.recognizer===r){state.interim='';if(live&&text)state.listenPreview=text;updateLive()}
    if(drop||isEmptyText(text))return;
    text=auDedupWords(text);const now=Date.now();
    if(text===lastFinal.text&&now-lastFinal.at<5000)return;
    lastFinal={text,at:now,source,micId};gotFin=true;state.sourceTurn++;
    const timing=latencyStart(speechEndedAt||lastHeardAt||performance.now());latencyMark(timing,'commit');
    consume(text,source,{toListen:live,fromMic:true,micId,timing});
  }
  r._flush=commit;
  r._cut=()=>{
    if(!live||!turn||turn.finished||state.recognizer!==r)return;
    commit();turn.submit=true;markListenRaw(turn.parts.join(' '),turn.source);finishManualTurn(turn);
    turn=newManualTurn();manualTurn=turn;state.interim='';state.listenPreview='';updateLive();
  };
  r.onresult=event=>{
    if(!valid()||(state.recognizer!==r&&!r._draining))return;
    clearTimeout(micWatchdog);micRetry=0;lastHeardAt=performance.now();
    echo=!live&&(state.speaking||Date.now()-speakEnd<600);
    const text=buffer.update(event.results);if(state.mic&&!r._draining)activity();
    const owns=!state.recognizer||state.recognizer===r;
    if(turn){turn.live=echo?'':text;if(owns&&manualTurn===turn&&!turn.finished){state.interim=[...turn.parts,turn.live].filter(Boolean).join(' ');updateLive()}return}
    if(owns){state.interim=echo?'':text;if(live&&text)state.listenPreview=text;updateLive()}
    clearTimeout(gapTimer);if(!text)return;
    const last=event.results[event.results.length-1],final=!!last?.isFinal;
    const continuing=/(?:은|는|의|와|과|에서|으로|을|를|그리고|하지만|면서|하려고|は|の|を|けど|ので)$/.test(text.trim());
    const done=/[.!?。！？]$|(?:습니다|합니다|입니다|세요|어요|아요|에요|예요|죠|ます|です|ました)$/.test(text.trim());
    // 중간 결과는 화면에 즉시 표시하되 확정 결과보다 조금 더 기다려 중복 전송 방지.
    gapTimer=setTimeout(()=>{if(valid()&&(state.recognizer===r||r._draining))commit()},final?(done?250:continuing?1600:live?1200:700):(live?2000:1200));
    if(live&&!maxTimer)maxTimer=setTimeout(commit,10000);
  };
  r.onerror=e=>{if(!valid())return;clearTimeout(micWatchdog);if(e.error==='aborted')return;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){state.mic=false;state.recognizer=null;render();micDiagnostic('음성 인식 권한이 허용되지 않았습니다. Chrome 사이트 설정을 확인해 주세요.')}
    else if(e.error==='network')notify('음성 인식 서버와 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
  };
  r.onend=()=>{srAll.delete(r);clearTimeout(gapTimer);clearTimeout(maxTimer);clearTimeout(r._drainTimer);
    if(!valid()){r._draining=false;return}
    if(r._draining){commit();r._draining=false;finishManualTurn(turn);updateDrainStatus();return}
    if(state.recognizer!==r)return;state.recognizer=null;commit();updateMic();
    if(state.mic){if(gotFin||gotAudio){micRetry=0;resumeRecognizer()}else scheduleMicRetry(micLastError||'음성 인식 결과 없이 종료됨')}
  };
  try{r.start();micStartingAt=Date.now();micWatchdog=setTimeout(()=>{if(state.recognizer!==r||!state.mic)return;state.recognizer=null;try{r.abort()}catch{}scheduleMicRetry('마이크 시작 응답 없음 (8초)')},8000)}catch(e){state.recognizer=null;scheduleMicRetry(e.message);updateMic()}
}

/* ── 전체 화면 / 설치 ── */
function toggleFullscreen(){
  const d=document;
  if(d.fullscreenElement)d.exitFullscreen?.();
  else (d.documentElement.requestFullscreen?.()||Promise.reject()).catch(()=>notify('이 브라우저에서는 전체 화면을 지원하지 않습니다.'));
}
document.addEventListener('fullscreenchange',()=>{if(state.page==='main'&&!state.modal)render()});
let installEvent=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;if(state.modal?.type==='settings')render()});
async function installApp(){if(!installEvent)return notify(isIOS?'사파리 아래 공유 버튼(□↑) → "홈 화면에 추가"를 눌러 주세요.':'크롬 오른쪽 위 메뉴(⋮) → "앱 설치"(또는 "홈 화면에 추가")를 눌러 주세요.');installEvent.prompt();await installEvent.userChoice.catch(()=>{});installEvent=null;render()}
window.addEventListener('appinstalled',()=>notify('설치되었습니다. 홈 화면의 "여행 통역" 아이콘으로 여세요.'));
if('serviceWorker'in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update()).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||state.page!=='home')return;reloaded=true;location.reload()});
}


window.addEventListener('offline',()=>{if(state.page==='main')render()});
window.addEventListener('online',()=>{if(state.page==='main')render()});
window.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('.confirm-back')){$('.confirm-back').remove();return}if(state.modal||state.side)closeLayer();else if(state.page==='main')goHome()});
render();
