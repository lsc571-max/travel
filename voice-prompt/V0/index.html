<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14161c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>음성 지시문</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --ink:#16181d; --sub:#6b6f7a; --line:#e4e2dc;
  --accent:#2f43c8; --accent-soft:#e8ebfb; --rec:#e0393e; --ok:#1f9d6b;
  --radius:18px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,22,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111318;--panel:#1a1d24;--ink:#eef0f4;--sub:#9aa0ad;--line:#2a2e38;--accent:#7d8cff;--accent-soft:#232848;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
textarea,input{font:inherit;color:inherit}
.view{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.view.on{display:flex}
header.bar{display:flex;align-items:center;gap:8px;padding:14px 16px;min-height:60px}
header.bar h1{flex:1;margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.icon-btn:active{background:var(--line)}
.body{flex:1;overflow:auto;padding:4px 16px 24px}
.foot{display:flex;gap:10px;padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--bg)}
.btn{flex:1;height:54px;border-radius:14px;font-weight:600;font-size:16px;background:var(--panel);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn:active{transform:scale(.98)}
.muted{color:var(--sub);font-size:14px}

/* Home */
.home{flex:1;display:flex;flex-direction:column;gap:14px;padding:12px 16px 20px}
.brand{padding:18px 4px 8px}
.brand h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em}
.brand p{margin:6px 0 0;color:var(--sub)}
.big{flex:1;border-radius:24px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:0 24px;text-align:left}
.big .num{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.big b{display:block;font-size:22px;letter-spacing:-.02em}
.big span{display:block;color:var(--sub);font-size:14px;margin-top:4px}
.big:active{transform:scale(.99)}

/* Item list */
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;min-height:64px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row .no{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.row .t{flex:1;min-width:0;padding:6px 4px;text-align:left}
.row .t b{display:block;font-size:17px}
.row .t small{display:block;color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.tri{width:40px;height:40px;border-radius:10px;font-size:14px;color:var(--sub);transition:transform .2s}
.tri.open{transform:rotate(180deg)}
.arrows{display:flex;flex-direction:column}
.arrows button{width:42px;height:27px;font-size:13px;color:var(--sub);border-radius:6px}
.arrows button:active{background:var(--line)}
.subs{display:none;padding:0 10px 10px 18px;border-top:1px dashed var(--line)}
.subs.open{display:block}
.subs .row{min-height:54px;border-bottom:1px solid var(--line);padding-left:6px}
.subs .row .no{background:transparent;border:1px solid var(--line);color:var(--sub)}
.add-sub{width:100%;height:46px;margin-top:8px;border-radius:12px;border:1px dashed var(--line);color:var(--accent);font-weight:600}
.dragging{opacity:.95;box-shadow:0 12px 30px rgba(0,0,0,.18);background:var(--panel);position:relative;z-index:5;border-radius:12px}
.drop-mark{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}

/* Recorder */
.rec-wrap{flex:1;display:flex;flex-direction:column;padding:0 16px 8px;gap:12px;overflow:auto}
.title-input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:22px;font-weight:700;padding:6px 2px 10px;outline:none}
.mic-zone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 6px}
.mic{width:120px;height:120px;border-radius:50%;background:var(--accent);color:#fff;font-size:44px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(47,67,200,.35)}
.mic.on{background:var(--rec);box-shadow:0 0 0 0 rgba(224,57,62,.5);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(224,57,62,0)}100%{box-shadow:0 0 0 0 rgba(224,57,62,0)}}
.timer{font-variant-numeric:tabular-nums;color:var(--sub)}
textarea.text{flex:1;min-height:180px;width:100%;resize:none;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px;font-size:17px;line-height:1.6;outline:none}
textarea.text:focus{border-color:var(--accent)}
.interim{color:var(--sub);font-size:15px;min-height:22px}
.clips{display:flex;flex-direction:column;gap:8px}
.clip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.clip audio{flex:1;height:36px;min-width:0}
.chip{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink);background:var(--panel)}

/* Saved / compose */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:16px}
.card .txt{white-space:pre-wrap;line-height:1.6;font-size:15px}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;outline:none}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600}
.seg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea.compose{width:100%;min-height:52vh;resize:vertical;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px;font-size:16px;line-height:1.65;outline:none}
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.toolbar .btn{height:58px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.toolbar .btn i{font-style:normal;font-size:18px}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ver{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ver b{width:44px}
.ver span{flex:1;color:var(--sub);font-size:14px}
.sect{font-size:13px;color:var(--sub);font-weight:700;margin:18px 2px 8px;letter-spacing:.02em}
</style>
</head>
<body>

<!-- 첫 화면 -->
<section class="view on" id="v-home">
  <div class="home">
    <div class="brand"><h1>음성 지시문</h1><p>말하면 받아 적고, 하나의 지시문으로 합칩니다.</p></div>
    <button class="big" data-go="app"><div class="num">1</div><div><b>앱 만들기</b><span>프로그램 만들기 · 프로그램 검증하기</span></div></button>
    <button class="big" data-ws="pc"><div class="num">2</div><div><b>PC에서 작업하기</b><span>항목별로 말해서 지시문 만들기</span></div></button>
    <button class="big" data-ws="web"><div class="num">3</div><div><b>웹으로 작업하기</b><span>항목별로 말해서 지시문 만들기</span></div></button>
  </div>
  <div style="text-align:center;padding-bottom:12px"><button class="muted" data-go="settings">⚙ 설정</button></div>
</section>

<!-- 앱 만들기 메뉴 -->
<section class="view" id="v-app">
  <header class="bar"><button class="icon-btn" data-back>←</button><h1>앱 만들기</h1></header>
  <div class="home" style="padding-top:0">
    <button class="big" data-ws="make"><div class="num">A</div><div><b>프로그램 만들기</b><span>새 앱의 지시문을 항목별로 작성</span></div></button>
    <button class="big" data-ws="verify"><div class="num">B</div><div><b>프로그램 검증하기</b><span>기존 프로그램을 두 번 검증하는 지시문</span></div></button>
  </div>
</section>

<!-- 항목 목록 -->
<section class="view" id="v-items">
  <header class="bar"><button class="icon-btn" data-back>←</button><h1 id="items-title"></h1>
    <button class="icon-btn" data-go="saved" title="저장 목록">☰</button></header>
  <div class="body" id="items-list"></div>
  <div class="foot"><button class="btn" data-go="saved">저장 목록</button><button class="btn primary" id="btn-merge">합치기</button></div>
</section>

<!-- 녹음 (전체 화면) -->
<section class="view" id="v-rec">
  <header class="bar"><button class="icon-btn" id="rec-cancel">←</button><h1 id="rec-path"></h1></header>
  <div class="rec-wrap">
    <input class="title-input" id="rec-title" placeholder="항목 이름">
    <div class="mic-zone">
      <button class="mic" id="mic">🎙</button>
      <div class="timer" id="timer">눌러서 녹음 시작</div>
    </div>
    <div class="interim" id="interim"></div>
    <textarea class="text" id="rec-text" placeholder="말한 내용이 여기에 그대로 적힙니다. 직접 입력·붙여넣기도 됩니다."></textarea>
    <div class="clips" id="rec-clips"></div>
  </div>
  <div class="foot"><button class="btn" id="rec-del" style="flex:.6;color:var(--rec)">항목 삭제</button><button class="btn" id="rec-clear">텍스트 지우기</button><button class="btn primary" id="rec-done">완료</button></div>
</section>

<!-- 저장 목록 -->
<section class="view" id="v-saved">
  <header class="bar"><button class="icon-btn" data-back>←</button><h1>저장 목록</h1></header>
  <div class="body" id="saved-list"></div>
  <div class="foot"><button class="btn primary" id="btn-merge2">합치기</button></div>
</section>

<!-- 지시문 편집 -->
<section class="view" id="v-compose">
  <header class="bar"><button class="icon-btn" data-back>←</button><h1>지시문</h1></header>
  <div class="body">
    <label class="field"><span>앱 이름 (드라이브 폴더 이름)</span><input id="app-name" placeholder="예: 여행 기록 앱"></label>
    <div class="toggles">
      <button class="seg" data-auto="before">자동 문구 앞에</button>
      <button class="seg" data-auto="after">자동 문구 뒤에</button>
      <button class="seg" data-auto="none">자동 문구 없음</button>
      <button class="seg" id="re-merge">↻ 다시 합치기</button>
    </div>
    <textarea class="compose" id="compose"></textarea>
    <div class="toolbar">
      <button class="btn" id="c-listen"><i>🔊</i>듣기</button>
      <button class="btn" id="c-copy"><i>⧉</i>복사</button>
      <button class="btn primary" id="c-claude"><i>➤</i>클로드로</button>
      <button class="btn" id="c-save"><i>⬇</i>버전 저장</button>
    </div>
    <div class="sect">버전 기록 (원본은 그대로, 새 버전으로만 저장)</div>
    <div id="versions"></div>
  </div>
</section>

<!-- 설정 -->
<section class="view" id="v-settings">
  <header class="bar"><button class="icon-btn" data-back>←</button><h1>설정</h1></header>
  <div class="body">
    <label class="field"><span>자동 문구</span><textarea id="s-auto" rows="4"></textarea></label>
    <div class="sect">구글 음성(TTS)</div>
    <p class="muted">키가 없으면 기기의 구글 음성으로 읽습니다. 키는 이 기기에만 저장되고 화면에 다시 표시되지 않습니다.</p>
    <label class="field"><span>Google Cloud TTS API 키 <b id="s-key-state"></b></span><input id="s-key" type="password" autocomplete="off" placeholder="입력 후 저장"></label>
    <div class="sect">구글 드라이브</div>
    <p class="muted">OAuth 클라이언트 ID(공개 값)를 넣으면 [앱 이름]/[작업]/[V번호] 폴더로 자동 저장합니다.</p>
    <label class="field"><span>OAuth 클라이언트 ID</span><input id="s-client" placeholder="xxxx.apps.googleusercontent.com"></label>
    <div style="display:flex;gap:10px"><button class="btn" id="s-delkey">키 삭제</button><button class="btn primary" id="s-save">저장</button></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- 기본값 ---------- */
const BASE_ITEMS = ['목적','주제','주의사항','활용하는 사람','전달할 내용','진행 방식'];
const WS = {
  pc:{name:'PC 작업',items:BASE_ITEMS},
  web:{name:'웹 작업',items:BASE_ITEMS},
  make:{name:'프로그램 만들기',items:BASE_ITEMS},
  verify:{name:'프로그램 검증하기',items:['검증할 프로그램','확인할 기능','알려진 문제','주의사항','검증 관점','진행 방식']}
};
const AUTO_DEFAULT = '이 지시문으로 앱을 만들어 줘. 앱이 완성되면 한 번 검증하고, 다른 시각의 전문가 관점에서 한 번 더 검증해 줘.';
const AUTO_VERIFY = '아래 프로그램을 먼저 한 번 검증하고, 다른 시각의 전문가 관점에서 한 번 더 검증해 줘.';
const LS = 'vp.state.v0';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 저장소: 텍스트=localStorage, 녹음=IndexedDB ---------- */
let state;
function newNode(title){return {id:uid(),title,text:'',clips:[],subs:[],open:false}}
function load(){
  try{state=JSON.parse(localStorage.getItem(LS))}catch(e){}
  if(!state) state={ws:{},auto:AUTO_DEFAULT,appName:''};
  for(const k in WS) if(!state.ws[k]) state.ws[k]={items:WS[k].items.map(newNode),versions:[],draft:'',autoPos:'before'};
}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){toast('저장 공간이 부족합니다')}}
const idb = new Promise((res,rej)=>{const r=indexedDB.open('vp-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbPut(k,v){const d=await idb;return new Promise((r,j)=>{const t=d.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)})}
async function idbGet(k){const d=await idb;return new Promise(r=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function idbDel(k){const d=await idb;d.transaction('a','readwrite').objectStore('a').delete(k)}

/* ---------- 화면 이동 ---------- */
const stack=['home']; let cur='pc';
function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v))}
function go(v){stack.push(v);render(v);show(v)}
function back(){if(stack.length>1)stack.pop();const v=stack[stack.length-1];render(v);show(v)}
function render(v){({items:renderItems,saved:renderSaved,compose:renderCompose,settings:renderSettings})[v]?.()}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
  const w=e.target.closest('[data-ws]'); if(w){cur=w.dataset.ws;go('items');return}
  if(e.target.closest('[data-back]')) back();
});
// 전체 화면: 첫 터치 때 요청
document.addEventListener('pointerdown',()=>{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{})},{once:true});

let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- 항목 목록 ---------- */
const W=()=>state.ws[cur];
function preview(n){return n.text?n.text.replace(/\s+/g,' '):(n.clips.length?'녹음 '+n.clips.length+'개':'눌러서 말하기')}
function renderItems(){
  $('#items-title').textContent=WS[cur].name;
  const L=$('#items-list'); L.innerHTML='';
  W().items.forEach((it,i)=>{
    const box=document.createElement('div'); box.className='item';
    box.innerHTML=`<div class="row" data-path="${i}">
        <div class="no">${i+1}</div>
        <button class="t" data-open="${i}"><b>${esc(it.title)}</b><small>${esc(preview(it))}</small></button>
        ${it.text||it.clips.length?'<i class="dot"></i>':''}
        <div class="arrows"><button data-mv="${i}" data-d="-1">▲</button><button data-mv="${i}" data-d="1">▼</button></div>
        <button class="tri ${it.open?'open':''}" data-tri="${i}" aria-label="세부 항목">▼</button></div>
      <div class="subs ${it.open?'open':''} reorder" data-list="${i}">
        ${it.subs.map((s,j)=>`<div class="row drag" data-path="${i}.${j}">
          <div class="no">${j+1}</div>
          <button class="t" data-open="${i}.${j}"><b>${esc(s.title)}</b><small>${esc(preview(s))}</small></button>
          ${s.text||s.clips.length?'<i class="dot"></i>':''}
          <div class="arrows"><button data-mv="${i}.${j}" data-d="-1">▲</button><button data-mv="${i}.${j}" data-d="1">▼</button></div></div>`).join('')}
        <button class="add-sub" data-add="${i}">＋ 세부 항목 추가</button>
      </div>`;
    L.appendChild(box);
  });
  L.insertAdjacentHTML('beforeend',`<p class="muted" style="text-align:center">세부 항목은 ▲▼ 또는 길게 눌러 끌어서 순서를 바꿉니다.</p>`);
}
function getList(path){const p=String(path).split('.');return p.length===1?[W().items,+p[0]]:[W().items[+p[0]].subs,+p[1]]}
function getNode(path){const [a,i]=getList(path);return a[i]}
$('#items-list').addEventListener('click',e=>{
  const t=e.target.closest('[data-tri]'); if(t){const it=W().items[+t.dataset.tri];it.open=!it.open;save();renderItems();return}
  const m=e.target.closest('[data-mv]'); if(m){const [a,i]=getList(m.dataset.mv),j=i+ +m.dataset.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderItems();return}
  const ad=e.target.closest('[data-add]'); if(ad){const it=W().items[+ad.dataset.add];const n=newNode('세부 항목 '+(it.subs.length+1));it.subs.push(n);save();openRec(ad.dataset.add+'.'+(it.subs.length-1));return}
  const o=e.target.closest('[data-open]'); if(o&&!dragJustEnded) openRec(o.dataset.open);
});

/* 길게 눌러 끌기 */
let drag=null,dragJustEnded=false;
$('#items-list').addEventListener('pointerdown',e=>{
  const row=e.target.closest('.row.drag'); if(!row||e.target.closest('.arrows'))return;
  const sx=e.clientX,sy=e.clientY;
  const timer=setTimeout(()=>{drag={row,list:row.parentElement,sy,over:row};row.classList.add('dragging');navigator.vibrate?.(30)},420);
  const cancel=ev=>{if(!drag&&(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8)){clearTimeout(timer);off()}};
  const up=()=>{clearTimeout(timer);off();if(drag)endDrag()};
  function off(){removeEventListener('pointermove',cancel);removeEventListener('pointerup',up);removeEventListener('pointercancel',up)}
  addEventListener('pointermove',cancel);addEventListener('pointerup',up);addEventListener('pointercancel',up);
});
addEventListener('pointermove',e=>{
  if(!drag)return;
  drag.row.style.transform=`translateY(${e.clientY-drag.sy}px)`;
  drag.row.style.pointerEvents='none';
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.row.drag');
  drag.list.querySelectorAll('.drop-mark').forEach(x=>x.classList.remove('drop-mark'));
  if(t&&t.parentElement===drag.list&&t!==drag.row){t.classList.add('drop-mark');drag.over=t}
});
document.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});
function endDrag(){
  const from=drag.row.dataset.path,to=drag.over.dataset.path;drag=null;
  dragJustEnded=true;setTimeout(()=>dragJustEnded=false,300);
  if(from!==to){const [a,i]=getList(from),j=getList(to)[1];const [x]=a.splice(i,1);a.splice(j,0,x);save()}
  renderItems();
}

/* ---------- 녹음 화면 ---------- */
let recPath=null,rec=null,sr=null,chunks=[],tStart=0,tInt=null,baseText='';
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function openRec(path){
  recPath=path;const n=getNode(path),p=String(path).split('.');
  $('#rec-path').textContent=WS[cur].name+' · '+(p.length===1?(+p[0]+1)+'번':(+p[0]+1)+'-'+(+p[1]+1)+'번');
  $('#rec-title').value=n.title;$('#rec-text').value=n.text;$('#interim').textContent='';
  $('#timer').textContent='눌러서 녹음 시작';
  $('#rec-del').style.display=p.length===1?'none':'';
  renderClips(n);go('rec');
}
async function renderClips(n){
  const box=$('#rec-clips');box.innerHTML='';
  for(const [k,c] of n.clips.entries()){
    const blob=await idbGet(c.key);if(!blob)continue;
    const url=URL.createObjectURL(blob);
    const d=document.createElement('div');d.className='clip';
    d.innerHTML=`<audio controls src="${url}"></audio><a class="chip" href="${url}" download="${fileBase(n)}_녹음${k+1}.${ext(c.type)}" style="display:grid;place-items:center;text-decoration:none">저장</a><button class="chip" data-delclip="${k}">삭제</button>`;
    box.appendChild(d);
  }
}
$('#rec-clips').addEventListener('click',async e=>{
  const b=e.target.closest('[data-delclip]');if(!b||!confirm('이 녹음을 삭제할까요?'))return;
  const n=getNode(recPath);const [c]=n.clips.splice(+b.dataset.delclip,1);await idbDel(c.key);save();renderClips(n);
});
const ext=t=>/mp4|aac/.test(t||'')?'m4a':/ogg/.test(t||'')?'ogg':'webm';
const fileBase=n=>(WS[cur].name+'_'+n.title).replace(/[\\/:*?"<>|\s]+/g,'_');

$('#mic').onclick=()=>rec?stopRec():startRec();
async function startRec(){
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('마이크 권한이 필요합니다');return}
  const path=recPath;chunks=[];rec=new MediaRecorder(stream);
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const key=uid();
    await idbPut(key,blob);const n=getNode(path);n.clips.push({key,type:blob.type,at:Date.now()});
    save();if(recPath===path)renderClips(n);rec=null;
  };
  rec.start();
  baseText=$('#rec-text').value;
  if(SR){
    sr=new SR();sr.lang='ko-KR';sr.continuous=true;sr.interimResults=true;
    const done=new Set();
    sr.onresult=e=>{
      let fin='',tmp='';
      for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){if(!done.has(i)){done.add(i);fin+=r[0].transcript}}else tmp+=r[0].transcript}
      if(fin){const ta=$('#rec-text');ta.value=(ta.value&&!/\s$/.test(ta.value)?ta.value+' ':ta.value)+fin.trim();}
      $('#interim').textContent=tmp;
    };
    sr.onend=()=>{if(rec&&sr){done.clear();try{sr.start()}catch(e){}}};
    sr.onerror=e=>{if(e.error==='not-allowed'||e.error==='audio-capture')toast('받아쓰기를 시작하지 못했습니다. 녹음은 계속됩니다. 글자는 직접 입력해 주세요.')};
    try{sr.start()}catch(e){}
  }else toast('이 브라우저는 받아쓰기를 지원하지 않습니다. 녹음만 저장됩니다.');
  $('#mic').classList.add('on');$('#mic').textContent='■';
  tStart=Date.now();tInt=setInterval(()=>{const s=(Date.now()-tStart)/1000|0;$('#timer').textContent='녹음 중 '+String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
}
function stopRec(){
  clearInterval(tInt);$('#mic').classList.remove('on');$('#mic').textContent='🎙';$('#timer').textContent='저장했습니다 · 다시 누르면 이어서 녹음';
  const r=rec;if(sr){sr.onend=null;try{sr.stop()}catch(e){}sr=null}
  $('#interim').textContent='';r&&r.state!=='inactive'&&r.stop();
}
function syncText(){const n=getNode(recPath);if(!n)return;n.title=$('#rec-title').value.trim()||n.title;n.text=$('#rec-text').value}
$('#rec-text').addEventListener('input',()=>{syncText();save()});
$('#rec-title').addEventListener('input',()=>{syncText();save()});
$('#rec-done').onclick=()=>{if(rec)stopRec();syncText();save();back()};
$('#rec-cancel').onclick=$('#rec-done').onclick;
$('#rec-del').onclick=async()=>{
  const p=String(recPath).split('.');
  if(p.length===1){toast('기본 항목은 삭제할 수 없습니다. 내용만 지울 수 있어요.');return}
  if(!confirm('이 세부 항목과 녹음을 삭제할까요?'))return;
  if(rec)stopRec();const [a,i]=getList(recPath);const [n]=a.splice(i,1);for(const c of n.clips)await idbDel(c.key);
  recPath=null;save();back();
};
$('#items-list').addEventListener('contextmenu',e=>{if(e.target.closest('.row.drag'))e.preventDefault()});
$('#rec-clear').onclick=()=>{if(confirm('텍스트를 지울까요? (녹음은 남습니다)')){$('#rec-text').value='';syncText();save()}};

/* ---------- 저장 목록 ---------- */
function eachNode(fn){W().items.forEach((it,i)=>{fn(it,(i+1)+'',0);it.subs.forEach((s,j)=>fn(s,(i+1)+'-'+(j+1),1))})}
async function renderSaved(){
  const L=$('#saved-list');L.innerHTML='';let any=false;
  const list=[];eachNode((n,no)=>{if(n.text||n.clips.length)list.push([n,no])});
  for(const [n,no] of list){
    any=true;const c=document.createElement('div');c.className='card';
    c.innerHTML=`<h3>${no}. ${esc(n.title)}</h3><div class="txt">${esc(n.text)||'<span class="muted">(텍스트 없음)</span>'}</div><div class="clips" style="margin-top:10px"></div><div class="acts"></div>`;
    const cl=c.querySelector('.clips');
    for(const [k,x] of n.clips.entries()){const b=await idbGet(x.key);if(!b)continue;const u=URL.createObjectURL(b);
      cl.insertAdjacentHTML('beforeend',`<div class="clip"><audio controls src="${u}"></audio><a class="chip" style="display:grid;place-items:center;text-decoration:none" href="${u}" download="${fileBase(n)}_녹음${k+1}.${ext(x.type)}">녹음 저장</a></div>`)}
    const acts=c.querySelector('.acts');
    if(n.text){
      const tb=document.createElement('button');tb.className='chip';tb.textContent='텍스트 저장';tb.onclick=()=>downloadText(fileBase(n)+'.txt',n.text);acts.appendChild(tb);
      const cp=document.createElement('button');cp.className='chip';cp.textContent='복사';cp.onclick=()=>copy(n.text);acts.appendChild(cp);
      const ls=document.createElement('button');ls.className='chip';ls.textContent='듣기';ls.onclick=()=>speak(n.text);acts.appendChild(ls);
    }
    L.appendChild(c);
  }
  if(!any)L.innerHTML='<div class="empty">아직 저장한 항목이 없습니다.<br>항목을 눌러 말해 보세요.</div>';
}

/* ---------- 합치기 (정리·요약 없음, 순서대로 이어 붙임) ---------- */
function merged(){
  const parts=[];
  eachNode((n,no,lv)=>{if(!n.text.trim())return;parts.push((lv?'  ':'')+no+'. '+n.title+'\n'+n.text)});
  const body=parts.join('\n\n'),w=W();
  const auto=cur==='verify'&&state.auto===AUTO_DEFAULT?AUTO_VERIFY:state.auto;
  if(w.autoPos==='before')return auto+'\n\n'+body;
  if(w.autoPos==='after')return body+'\n\n'+auto;
  return body;
}
function doMerge(){const w=W();w.draft=merged();save();go('compose')}
$('#btn-merge').onclick=doMerge;$('#btn-merge2').onclick=doMerge;

/* ---------- 지시문 편집 ---------- */
function renderCompose(){
  const w=W();$('#compose').value=w.draft;$('#app-name').value=state.appName;
  document.querySelectorAll('[data-auto]').forEach(b=>b.classList.toggle('on',b.dataset.auto===w.autoPos));
  $('#versions').innerHTML=w.versions.length?w.versions.slice().reverse().map(v=>`<div class="ver"><b>V${v.v}</b><span>${new Date(v.at).toLocaleString('ko-KR')}${v.drive?' · 드라이브 저장됨':''}</span><button class="chip" data-load="${v.v}">불러오기</button></div>`).join(''):'<p class="muted">아직 저장한 버전이 없습니다.</p>';
}
$('#compose').addEventListener('input',e=>{W().draft=e.target.value;save()});
$('#app-name').addEventListener('input',e=>{state.appName=e.target.value;save()});
document.querySelectorAll('[data-auto]').forEach(b=>b.onclick=()=>{W().autoPos=b.dataset.auto;W().draft=merged();save();renderCompose()});
$('#re-merge').onclick=()=>{if(confirm('지금 편집한 내용 대신 항목을 다시 합칠까요?')){W().draft=merged();save();renderCompose()}};
$('#versions').addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(!b)return;const v=W().versions.find(x=>x.v==b.dataset.load);W().draft=v.text;save();renderCompose();toast('V'+v.v+'을 불러왔습니다')});
$('#c-listen').onclick=()=>speaking?stopSpeak():speak($('#compose').value);
$('#c-copy').onclick=()=>copy($('#compose').value);
$('#c-claude').onclick=async()=>{
  const t=$('#compose').value;await copy(t,true);
  // claude.ai/new?q= 로 내용 전달 (모바일은 클로드 앱으로 열림). 길면 클립보드 붙여넣기용으로도 복사됨
  const url='https://claude.ai/new?q='+encodeURIComponent(t.length>6000?t.slice(0,6000):t);
  window.open(url,'_blank');
  toast(t.length>6000?'내용이 길어 일부만 전달됩니다. 전체는 복사되어 있으니 붙여넣으세요.':'클로드를 엽니다 (내용도 복사됨)');
};
$('#c-save').onclick=async()=>{
  const w=W(),v=w.versions.length;const text=$('#compose').value;
  const ver={v,text,at:Date.now(),drive:false};w.versions.push(ver);save();renderCompose();
  const name=`${state.appName||'앱'}_${WS[cur].name}_V${v}.txt`.replace(/[\\/:*?"<>|\s]+/g,'_');
  if(localStorage.getItem('vp.client')){
    try{await driveSave(ver);ver.drive=true;save();renderCompose();toast('V'+v+' 드라이브 저장 완료')}
    catch(e){downloadText(name,text);toast('드라이브 저장 실패 → 기기에 V'+v+' 저장')}
  }else{downloadText(name,text);toast('V'+v+' 저장 (기기 다운로드)')}
};

/* ---------- 공용 ---------- */
async function copy(t,quiet){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  quiet||toast('복사했습니다');
}
function downloadText(name,text){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
  a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* 구글 TTS: Cloud 키가 있으면 Google Cloud TTS, 없으면 기기의 Google 음성 */
let speaking=false,ttsAudio=null;
function stopSpeak(){speaking=false;speechSynthesis.cancel();ttsAudio?.pause();$('#c-listen').innerHTML='<i>🔊</i>듣기'}
function chunksOf(t,n){const out=[];let s='';for(const p of t.split(/(?<=[.!?。\n])/)){if((s+p).length>n&&s){out.push(s);s=''}s+=p}s&&out.push(s);return out.flatMap(x=>x.length>n?x.match(new RegExp('[\\s\\S]{1,'+n+'}','g')):[x])}
async function speak(text){
  if(!text.trim())return;stopSpeak();speaking=true;$('#c-listen').innerHTML='<i>■</i>멈춤';
  const key=localStorage.getItem('vp.ttskey');
  if(key){
    try{
      for(const part of chunksOf(text,1400)){
        if(!speaking)break;
        const r=await fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({input:{text:part},voice:{languageCode:'ko-KR',name:'ko-KR-Neural2-A'},audioConfig:{audioEncoding:'MP3'}})});
        if(!r.ok)throw new Error(r.status);
        const {audioContent}=await r.json();
        ttsAudio=new Audio('data:audio/mp3;base64,'+audioContent);
        await new Promise(res=>{ttsAudio.onended=res;ttsAudio.onpause=res;ttsAudio.play().catch(res)});
      }
      return stopSpeak();
    }catch(e){toast('구글 클라우드 음성 실패 → 기기 음성으로 읽습니다')}
  }
  const voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ko'));
  const voice=voices.find(v=>/google/i.test(v.name))||voices[0];
  const parts=chunksOf(text,200);
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang='ko-KR';if(voice)u.voice=voice;if(i===parts.length-1)u.onend=stopSpeak;speechSynthesis.speak(u)});
}
speechSynthesis?.getVoices();

/* ---------- 구글 드라이브: [앱 이름]/[작업]/[V#] ---------- */
let gToken=null;
function loadGis(){return new Promise((res,rej)=>{if(window.google?.accounts)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function token(){
  if(gToken&&gToken.exp>Date.now())return gToken.v;await loadGis();
  return new Promise((res,rej)=>{google.accounts.oauth2.initTokenClient({client_id:localStorage.getItem('vp.client'),scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>r.access_token?(gToken={v:r.access_token,exp:Date.now()+(r.expires_in-60)*1000},res(r.access_token)):rej(r)}).requestAccessToken()})
}
async function gapi(url,opt={}){const t=await token();const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});if(!r.ok)throw new Error(r.status);return r.json()}
async function folder(name,parent){
  const q=`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false and '${parent}' in parents`;
  const f=await gapi('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent(q));
  if(f.files.length)return f.files[0].id;
  return (await gapi('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parent]})})).id;
}
async function upload(name,blob,parent){
  const fd=new FormData();fd.append('metadata',new Blob([JSON.stringify({name,parents:[parent]})],{type:'application/json'}));fd.append('file',blob);
  return gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',body:fd});
}
async function driveSave(ver){
  const root=await folder(state.appName||'음성 지시문 앱','root');
  const task=await folder(WS[cur].name,root);
  const vf=await folder('V'+ver.v,task);
  await upload('지시문.txt',new Blob([ver.text],{type:'text/plain'}),vf);
  const items=[];eachNode((n,no)=>items.push([n,no]));
  for(const [n,no] of items){
    if(n.text)await upload(`${no}_${n.title}.txt`,new Blob([n.text],{type:'text/plain'}),vf);
    for(const [k,c] of n.clips.entries()){const b=await idbGet(c.key);if(b)await upload(`${no}_${n.title}_녹음${k+1}.${ext(c.type)}`,b,vf)}
  }
}

/* ---------- 설정 ---------- */
function renderSettings(){
  $('#s-auto').value=state.auto;$('#s-key').value='';
  $('#s-key-state').textContent=localStorage.getItem('vp.ttskey')?'· 저장됨':'· 없음';
  $('#s-client').value=localStorage.getItem('vp.client')||'';
}
$('#s-save').onclick=()=>{
  state.auto=$('#s-auto').value.trim()||AUTO_DEFAULT;save();
  const k=$('#s-key').value.trim();if(k)localStorage.setItem('vp.ttskey',k);
  const c=$('#s-client').value.trim();c?localStorage.setItem('vp.client',c):localStorage.removeItem('vp.client');
  renderSettings();toast('저장했습니다');
};
$('#s-delkey').onclick=()=>{localStorage.removeItem('vp.ttskey');renderSettings();toast('키를 삭제했습니다')};

load();
if(localStorage.getItem('vp.client'))loadGis().catch(()=>{});
