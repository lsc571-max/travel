<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>녹음 교정 테스트</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f4f6f8;color:#1d2733}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #e3e8ee}
header h1{font-size:19px;margin:0;color:#1f6fd1}
header .ver{font-size:12px;color:#99a3ae}
#setup{padding:10px 16px;background:#fff;border-bottom:1px solid #e3e8ee;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#setup input{flex:1;min-width:150px;padding:9px 10px;border:1px solid #ccd5df;border-radius:10px;font-size:14px}
#setup select{padding:9px 6px;border:1px solid #ccd5df;border-radius:10px;font-size:14px;background:#fff}
#stat{display:flex;gap:14px;padding:8px 16px;font-size:13px;color:#5b6773;background:#fff;border-bottom:1px solid #e3e8ee;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c4ccd4;margin-right:4px;vertical-align:middle}
.on{background:#2fa05a}.bad{background:#e0443c}
#meter{flex:1;height:8px;background:#e6ebf0;border-radius:4px;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:#2fa05a;transition:width .08s}
#live{padding:10px 16px;min-height:44px;font-size:16px;color:#7a8794;background:#fffbe8;border-bottom:1px solid #efe6bf}
#list{flex:1;overflow-y:auto;padding:12px 12px 20px;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
.card{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px #0000000d}
.lab{font-size:12px;font-weight:700;margin-bottom:3px}
.chrome .lab{color:#8a96a3}.gem .lab{color:#1f6fd1}
.chrome .tx{font-size:15px;color:#6b7783}
.gem{margin-top:8px}.gem .tx{font-size:18px;font-weight:600}
.same{color:#2fa05a;font-size:12px;font-weight:600}.diff{color:#d9822b;font-size:12px;font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:#99a3ae}
.meta button{border:1px solid #d5dde5;background:#fff;border-radius:16px;padding:4px 10px;font-size:12px;color:#4b5763}
footer{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e3e8ee}
footer button{flex:1;border:none;border-radius:18px;padding:16px 8px;font-size:18px;font-weight:700}
#go{background:#1f6fd1;color:#fff}#go.stop{background:#e0443c}
#cut{flex:.6;background:#e9eef4;color:#33404d}
.tx.empty{color:#b0b9c2;font-weight:400;font-size:14px}
.card.carry{background:#f7f9fb;box-shadow:none;border:1px dashed #cdd6df}.card.carry .tx{color:#8a96a3;font-weight:500}
.parts button{margin-left:4px}
#clr{flex:.45;background:#e9eef4;color:#33404d;font-size:15px}
#sum{font-size:12px;color:#5b6773}
</style>
</head>
<body>
<header><h1>🎙️ 녹음 교정 테스트</h1><span class="ver">T2 · Claude</span></header>
<div id="setup">
  <input id="key" type="password" placeholder="Gemini API 키 (앱에 넣은 키가 있으면 자동)">
  <select id="model">
    <option value="gemini-3.5-flash-lite">⚡ 빠름</option>
    <option value="gemini-3.8-flash">⚖️ 균형</option>
    <option value="gemini-4-argon">🎯 정확</option>
  </select>
  <select id="pause" title="이만큼 쉬면 문장을 잘라 보냄">
    <option value="0.6">쉼 0.6초</option>
    <option value="0.9">쉼 0.9초</option>
    <option value="1.3">쉼 1.3초</option>
    <option value="2">쉼 2초</option>
  </select>
</div>
<div id="stat">
  <span><span id="dMic" class="dot"></span>녹음</span>
  <span><span id="dVoice" class="dot"></span>말소리</span>
  <div id="meter"><i></i></div>
  <span id="sum"></span>
</div>
<div id="live">시작을 누르고 강의하듯 말씀해 보세요. 크롬 받아쓰기 없이 녹음만 Gemini가 받아 적습니다.</div>
<div id="list"></div>
<footer>
  <button id="clr">지우기</button>
  <button id="cut">문장 끝</button>
  <button id="go">시작</button>
</footer>
<script>
/* T1: 크롬 받아쓰기는 녹음과 동시에 안 돼서 뺌.
   마이크는 계속 켜 두고 녹음만 → 말이 잠깐 쉬면 그 조각을 Gemini가 받아 적음 (앞 문장 2개는 글자로 문맥 참고) */
const $=id=>document.getElementById(id);
const ls={get:(k,d='')=>{try{return localStorage.getItem(k)??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
$('key').value=ls.get('ai_key');
$('key').onchange=()=>ls.set('ai_key',$('key').value.trim());
$('model').value=ls.get('t2_model','gemini-3.8-flash');
$('model').onchange=()=>ls.set('t2_model',$('model').value);
$('pause').value=ls.get('t2_pause','0.9');
$('pause').onchange=()=>ls.set('t2_pause',$('pause').value);

const BASE_TERMS='게이트,러너,스프루,캐비티,코어,파팅라인,이젝터,이젝터 핀,성형품,사출,사출금형,프레스금형,순차이송금형,몰드베이스,언더컷,슬라이드,경사핀,냉각수 회로,핫러너,콜드러너,웰드라인,싱크마크,버,플래시,후가공,일체,인서트,다이,펀치,스트리퍼,파일럿,블랭킹,피어싱,벤딩,드로잉,CNC 선반,밀링,엔드밀,공작물,절삭,이송,절삭속도,공차,인벤터,오토캐드,한국폴리텍대학 서울정수캠퍼스';
function terms(){let g=[];try{g=(JSON.parse(ls.get('glossary','[]'))||[]).map(x=>x.word).filter(Boolean)}catch{}return [...new Set([...g,...BASE_TERMS.split(',')])].slice(0,200).join(', ')}

/* ── 녹음 (16kHz, 최근 120초 보관) ── */
let ac,src,proc,stream,RATE=16000,buf=[],bufStart=0,total=0,running=false;
function slice(a,b){
  a=Math.max(a,bufStart);b=Math.min(b,total);if(b<=a)return null;
  const out=new Float32Array(b-a);let pos=bufStart,o=0;
  for(const c of buf){const ce=pos+c.length;if(ce>a&&pos<b){const s=Math.max(a,pos)-pos,e=Math.min(b,ce)-pos;out.set(c.subarray(s,e),o);o+=e-s}pos=ce}
  return out;
}
function down(f,from){if(from===RATE)return f;const r=from/RATE,n=Math.floor(f.length/r),o=new Float32Array(n);for(let i=0;i<n;i++){const s=Math.floor(i*r),e=Math.min(f.length,Math.floor((i+1)*r));let v=0;for(let j=s;j<e;j++)v+=f[j];o[i]=v/Math.max(1,e-s)}return o}
function wav(f){
  const b=new ArrayBuffer(44+f.length*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+f.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,RATE,true);v.setUint32(28,RATE*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,f.length*2,true);
  for(let i=0;i<f.length;i++){const s=Math.max(-1,Math.min(1,f[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true)}
  return new Blob([b],{type:'audio/wav'});
}

/* ── 말소리 감지: 소리 크기로 말하는 중/쉬는 중 판단 ── */
let floor=0.004,speaking=false,segStart=-1,lastVoice=0,voiced=0,frames=[]; // frames: [끝 위치, 크기] (긴 문장 자를 곳 찾기용)
const MAXSEC=10; // T2: 조각은 짧게 (문장은 받아 적은 뒤 이어 붙여 만듦)
function onFrame(f){
  buf.push(f);total+=f.length;
  while(buf.length&&total-bufStart-buf[0].length>RATE*120){bufStart+=buf[0].length;buf.shift()}
  let e=0;for(let i=0;i<f.length;i++)e+=f[i]*f[i];const rms=Math.sqrt(e/f.length);
  $('meter').firstChild.style.width=Math.min(100,rms*900)+'%';
  const thr=Math.max(floor*3,0.008),isV=rms>thr;
  if(!isV)floor=floor*0.97+rms*0.03;               // 조용할 때 주변 소음 크기를 천천히 익힘
  frames.push([total,rms]);if(frames.length>400)frames.shift();
  if(isV){
    lastVoice=total;voiced+=f.length;
    if(segStart<0)segStart=Math.max(bufStart,total-f.length-Math.round(RATE*0.35)); // 말 시작 0.35초 앞부터
  }
  $('dVoice').className='dot'+(isV?' on':'');
  if(segStart<0){liveIdle();return}
  const len=(total-segStart)/RATE,quiet=(total-lastVoice)/RATE;
  $('live').textContent=`🎙️ 녹음 중 ${len.toFixed(1)}초`+(quiet>0.25?' · 쉬는 중':'');
  if(quiet>=Number($('pause').value))cut(lastVoice+Math.round(RATE*0.25));
  else if(len>=MAXSEC){                             // 너무 길면 최근 3초 중 가장 조용한 곳에서 자름
    let best=null;for(const [p,r] of frames)if(p>total-RATE*3&&p<total-RATE*0.3&&(!best||r<best[1]))best=[p,r];
    cut(best?best[0]:total);
  }
}
function cut(end){
  if(segStart<0)return;
  end=Math.min(end??total,total);
  const a=segStart,v=voiced;segStart=-1;voiced=0;
  if(v<RATE*0.3)return;                            // 0.3초도 안 되는 소리(기침·잡음)는 버림
  const it={a,b:end,st:'busy',ms:0};items.push(it);draw();send(it);
  if(end<total&&lastVoice>end){segStart=end;voiced=lastVoice-end}  // 자른 뒤에 이어진 말은 다음 조각으로
}
$('cut').onclick=()=>cut(total);

async function startMic(){
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  try{ac=new AudioContext({sampleRate:16000})}catch{ac=new AudioContext()}
  const inRate=ac.sampleRate;
  src=ac.createMediaStreamSource(stream);proc=ac.createScriptProcessor(2048,1,1);
  proc.onaudioprocess=e=>{if(running)onFrame(new Float32Array(down(e.inputBuffer.getChannelData(0),inRate)))};
  src.connect(proc);proc.connect(ac.destination);
  $('dMic').className='dot on';
  stream.getAudioTracks()[0].onended=()=>{$('dMic').className='dot bad';$('live').textContent='⚠️ 녹음이 끊겼습니다'};
}
function stopMic(){try{proc.disconnect();src.disconnect()}catch{}try{stream.getTracks().forEach(t=>t.stop())}catch{}try{ac.close()}catch{}$('dMic').className='dot';$('dVoice').className='dot';$('meter').firstChild.style.width='0'}

/* ── Gemini 받아쓰기 ── */
const items=[],tok={in:0,out:0};
function ctxBefore(it){const i=items.indexOf(it);return items.slice(0,i).filter(x=>x.st==='done'&&x.t).slice(-2).map(x=>x.t).join(' ').slice(-300)}
async function send(it){
  const key=($('key').value||ls.get('ai_key')).trim();
  if(!key){it.st='nokey';assemble();return}
  const pcm=slice(it.a,it.b);if(!pcm){it.st='err';it.err='녹음된 소리 없음';assemble();return}
  it.sec=(pcm.length/RATE).toFixed(1);
  const blob=wav(pcm);it.url=URL.createObjectURL(blob);
  const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(blob)});
  const before=ctxBefore(it);
  const sys=`당신은 한국어 강의 받아쓰기 전문가입니다. 녹음에서 들리는 한국어를 정확하게 받아 적으세요. 강의 분야는 금형(사출·프레스·순차이송)·기계가공·CAD입니다. 자주 나오는 용어: ${terms()}.
규칙: 들린 그대로 적되 맞춤법·띄어쓰기는 바르게. 문장이 실제로 끝난 곳(~합니다·~요·~다 등)에만 마침표나 물음표를 찍고, 녹음이 문장 중간에서 끊기면 끝에 마침표를 찍지 마세요. 발음이 뭉개진 단어는 분야 용어와 [앞 문장] 문맥으로 가장 알맞은 말을 고르세요. 녹음은 말이 쉬는 곳에서 잘라 보내므로 문장 중간에서 시작하거나 끝날 수 있습니다 — 그대로 적고 없는 말을 보태지 마세요. [앞 문장]은 바로 앞 녹음을 받아 적은 것으로 참고용이며 다시 적지 마세요. 이번 녹음이 앞 문장에 이어지는 말이면 이어지는 부분만 적으세요. 말소리가 없거나 잡음뿐이면 빈 문자열. 설명 없이 JSON {"t":"받아쓴 글"}만 답하세요.`;
  const user=(before?`[앞 문장]\n${before}\n\n`:'')+'이 녹음을 받아 적으세요.';
  const m=$('model').value;const cfg={temperature:0.1,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{t:{type:'STRING'}},required:['t']}};
  if(/argon/.test(m))cfg.thinkingConfig={thinkingLevel:'low'};
  const t0=Date.now();
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{inline_data:{mime_type:'audio/wav',data:b64}},{text:user}]}],generationConfig:cfg}),signal:AbortSignal.timeout(40000)});
    const j=await res.json().catch(()=>({}));if(!res.ok)throw Error(j.error?.message||('오류 '+res.status));
    const raw=(j.candidates?.[0]?.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('').trim();
    let t=raw;try{t=JSON.parse(raw.replace(/^```(?:json)?\s*|\s*```$/g,'')).t??raw}catch{}
    it.t=String(t).trim();it.st='done';it.ms=Date.now()-t0;
    const u=j.usageMetadata;if(u){tok.in+=u.promptTokenCount||0;tok.out+=(u.candidatesTokenCount||0)+(u.thoughtsTokenCount||0)}
  }catch(e){it.st='err';it.err=e.message;it.ms=Date.now()-t0}
  it.endAt=Date.now();assemble();
}

/* ── T2: 받아 적은 조각을 순서대로 이어 붙여 종결어미(마침표)에서 문장으로 나눔 ── */
const sents=[];let carry='',carryParts=[],nextIdx=0,carryAt=0;
const KO_END=/(습니다|습니까|입니다|입니까|합니다|합니까|됩니다|됩니까|었다|았다|였다|했다|한다|된다|있다|없다|이다|하다|겠다|는다|같다|않다|세요|에요|예요|어요|아요|해요|네요|군요|지요|까요|데요|거든요|죠)$/;
function assemble(){
  while(nextIdx<items.length&&items[nextIdx].st!=='busy'){
    const it=items[nextIdx++];
    if(it.st==='done'&&it.t){carry=(carry+' '+it.t).replace(/\s+/g,' ').trim();carryParts.push(nextIdx);carryAt=Date.now()}
  }
  // 마침표·물음표·느낌표 + 띄어쓰기(또는 끝)에서 자름 (3.5 같은 소수점은 안 자름)
  let used=0;
  for(let i=0;i<carry.length;i++){
    if('.?!。'.includes(carry[i])&&(i+1===carry.length||/\s/.test(carry[i+1]))){const t=carry.slice(used,i+1).trim();if(t)sents.push({t,parts:[...carryParts],full:true});used=i+1}
  }
  if(used){carry=carry.slice(used).trim();carryParts=carry?[carryParts[carryParts.length-1]]:[]}
  draw();
}
// 남은 말이 있는데 말이 멈춘 채 2초 지나면(종결어미가 없어도) 문장으로 내보냄
setInterval(()=>{
  if(!carry||segStart>=0||nextIdx<items.length)return;
  if(Date.now()-carryAt<2000)return;
  sents.push({t:carry,parts:[...carryParts],full:KO_END.test(carry.replace(/[.?!]$/,''))});carry='';carryParts=[];draw();
},300);
function liveIdle(){const busy=items.length-nextIdx;$('live').textContent=busy?`받아 적는 중… (${busy}조각)`:running?'듣는 중… (말씀하시면 자동으로 잡습니다)':'멈췄습니다.'}

/* ── 화면 ── */
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
const play=i=>{const u=items[i-1]?.url;if(u)new Audio(u).play()};
function draw(){
  const pbtn=ps=>ps.map(n=>`<button onclick="play(${n})">🔊${n}</button>`).join('');
  let h=sents.map((x,i)=>`<div class="card gem" style="margin-top:0"><div class="tx">${esc(x.t)}</div>
    <div class="meta"><span>${i+1}번 문장${x.full?'':' · 2초 쉼으로 끊음'}</span><span class="parts">${pbtn(x.parts)}</span></div></div>`).join('');
  const busy=items.slice(nextIdx).filter(x=>x.st==='busy').length;
  const errs=items.filter(x=>x.st==='err'||x.st==='nokey');
  if(carry||busy)h+=`<div class="card carry"><div class="tx">${esc(carry)}${busy?` <span class="tx empty">… 받아 적는 중 (${busy}조각)</span>`:''}</div><div class="meta"><span>이어지는 중 · 문장이 끝나면 위로 올라감</span><span class="parts">${pbtn(carryParts)}</span></div></div>`;
  if(errs.length){const e=errs[errs.length-1];h+=`<div class="card"><div class="tx empty">⚠️ ${e.st==='nokey'?'Gemini 키를 위에 넣어 주세요':esc(e.err||'')}</div></div>`}
  $('list').innerHTML=h;$('list').scrollTop=1e9;
  const done=items.filter(x=>x.ms);const avg=done.length?(done.reduce((a,x)=>a+x.ms,0)/done.length/1000).toFixed(1):'';
  $('sum').textContent=items.length?`${sents.length}문장 · ${items.length}조각${avg?' · 평균 '+avg+'초':''} · 토큰 ${tok.in+tok.out}`:'';
}
$('clr').onclick=()=>{items.length=0;sents.length=0;carry='';carryParts=[];nextIdx=0;tok.in=tok.out=0;draw()};

/* ── 시작·멈춤 ── */
$('go').onclick=async()=>{
  if(running){cut(total);running=false;setTimeout(stopMic,300);$('go').textContent='시작';$('go').classList.remove('stop');liveIdle();return}
  try{await startMic()}catch(e){$('dMic').className='dot bad';$('live').textContent='⚠️ 녹음 시작 실패: '+e.message;return}
  buf=[];bufStart=0;total=0;segStart=-1;voiced=0;frames=[];floor=0.004;
  running=true;$('go').textContent='멈춤';$('go').classList.add('stop');
};
</script>
</body>
</html>
